<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Teacher Dashboard">
  <title>Teacher Dashboard | GRACAIS</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../assets/style.css">

  <style>
    .teacher-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .welcome-panel {
      padding: 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, #063B7A, #0B5CAD);
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(3, 42, 88, 0.08);
    }

    .welcome-panel h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin: 0 0 10px 0;
    }

    .welcome-panel p {
      line-height: 1.7;
      margin: 0;
      color: #E0F5FF;
    }

    .teacher-label {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 12px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 30px;
      font-size: .82rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
    }

    .section-title {
      color: #063B7A;
      font-size: 1.25rem;
      margin-bottom: 16px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 26px;
    }

    .dashboard-card {
      display: block;
      padding: 20px;
      border: 1px solid #D9E5F0;
      border-radius: 12px;
      background: white;
      color: #17324d;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(3,42,88,.04);
      transition: transform .15s ease, border-color .15s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-2px);
      border-color: #063B7A;
    }

    .card-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #E0F5FF;
      color: #063B7A;
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .dashboard-card h3 {
      color: #063B7A;
      margin: 0 0 6px 0;
      font-size: 1.05rem;
    }

    .dashboard-card p {
      color: #64748b;
      font-size: .88rem;
      line-height: 1.6;
      margin: 0;
    }

    .portal-card {
      background: white;
      border: 1px solid #D9E5F0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
    }

    .portal-card p {
      color: #526579;
      line-height: 1.7;
      margin: 0;
    }

    .status-note {
      background: #FFF8E6;
      border: 1px solid #F4D58D;
      color: #795716;
      border-radius: 10px;
      padding: 14px 18px;
      line-height: 1.6;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }

    @media (max-width: 850px) {
      .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .teacher-page { padding: 16px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .welcome-panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import {
      requireUser,
      setupLogout,
      esc
    } from "../assets/app.js";

    const ALLOWED_ROLES = [
      "teacher",
      "instructor"
    ];

    const app = document.getElementById("app");

    // Build the page shell.
    app.innerHTML = `
      <div class="portal-shell">
        <aside id="sidebar" class="sidebar" data-sidebar>
          <div class="sidebar-brand">
            <a href="./dashboard.html" class="brand-link">
              <img
                src="../logo.png"
                alt="GRACAIS logo"
                class="sidebar-logo"
              >
              <span class="brand-text">
                <strong>GRACAIS</strong>
                <small>Teacher Portal</small>
              </span>
            </a>

            <button
              type="button"
              id="sidebarClose"
              class="sidebar-close"
              aria-label="Close navigation"
            >×</button>
          </div>

          <div class="sidebar-content">
            <div class="sidebar-group">
              <p class="sidebar-group-title">TEACHING</p>
              <nav class="sidebar-nav">
                <a class="sidebar-link active" href="./dashboard.html">
                  <span class="sidebar-icon">▦</span>
                  <span>Dashboard</span>
                </a>
                <a class="sidebar-link" href="./my-students.html">
                  <span class="sidebar-icon">♙</span>
                  <span>My Students</span>
                </a>
                <a class="sidebar-link" href="./grades.html">
                  <span class="sidebar-icon">▥</span>
                  <span>Grades</span>
                </a>
                <a class="sidebar-link" href="./attendance.html">
                  <span class="sidebar-icon">✓</span>
                  <span>Attendance</span>
                </a>
                <a class="sidebar-link" href="./schedule.html">
                  <span class="sidebar-icon">◷</span>
                  <span>My Schedule</span>
                </a>
                <a class="sidebar-link" href="./announcements.html">
                  <span class="sidebar-icon">◉</span>
                  <span>Announcements</span>
                </a>
              </nav>
            </div>

            <div class="sidebar-group">
              <p class="sidebar-group-title">ACCOUNT</p>
              <nav class="sidebar-nav">
                <a class="sidebar-link" href="./password.html">
                  <span class="sidebar-icon">◇</span>
                  <span>Change Password</span>
                </a>
              </nav>
            </div>
          </div>

          <div class="sidebar-footer">
            <div class="sidebar-school-name">
              Graceland Academy International School of Excellence
            </div>
            <div class="sidebar-role">Teacher Portal [Grades 4th - 12th]</div>
          </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-area">
          <header class="topbar">
            <button
              type="button"
              id="menuToggle"
              class="menu-toggle"
              data-menu-toggle
              aria-label="Open navigation"
              aria-expanded="false"
              aria-controls="sidebar"
            >☰</button>

            <div class="topbar-heading">
              <h1>Teacher Dashboard</h1>
              <p>GRACAIS Academic Portal [Grades 4th - 12th]</p>
            </div>

            <button
              type="button"
              class="logout-button"
              data-logout
            >
              <span aria-hidden="true">⇥</span>
              <span>Sign Out</span>
            </button>
          </header>

          <section id="pageContent" class="page-content teacher-page">
            <div class="portal-card">
              <p>Verifying your teacher account...</p>
            </div>
          </section>
        </main>
      </div>
    `;

    // Mobile navigation.
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    const toggle = document.getElementById("menuToggle");
    const close = document.getElementById("sidebarClose");

    function closeSidebar() {
      sidebar.classList.remove("open");
      overlay.classList.remove("visible");
      toggle.setAttribute("aria-expanded", "false");
    }

    function openSidebar() {
      sidebar.classList.add("open");
      overlay.classList.add("visible");
      toggle.setAttribute("aria-expanded", "true");
    }

    toggle.addEventListener("click", openSidebar);
    close.addEventListener("click", closeSidebar);
    overlay.addEventListener("click", closeSidebar);

    sidebar.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", closeSidebar);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeSidebar();
    });

    setupLogout();

    // Require a real authenticated teacher account.
    const result = await requireUser(ALLOWED_ROLES);

    if (result) {
      const profile = result.profile || {};
      const fullName = [
        profile.first_name,
        profile.last_name
      ].filter(Boolean).join(" ");

      document.getElementById("pageContent").innerHTML = `
        <section class="welcome-panel">
          <span class="teacher-label">Faculty Account</span>
          <h1>Welcome${fullName ? ", " + esc(fullName) : ""}!</h1>
          <p>
            Manage your assigned students, grade records, attendance sheets, and class timetable for Grades 4th through 12th.
          </p>
        </section>

        <div class="status-note">
          <strong>Faculty Workspace Notice:</strong>
          Assigned student rosters, grade records, and timetable sessions will update dynamically as official school queries synchronize with your account.
        </div>

        <section>
          <h2 class="section-title">My Teaching Workspace</h2>

          <div class="dashboard-grid">
            <a class="dashboard-card" href="./my-students.html">
              <div class="card-icon" aria-hidden="true">♙</div>
              <h3>My Students</h3>
              <p>View student rosters assigned to your classes.</p>
            </a>

            <a class="dashboard-card" href="./grades.html">
              <div class="card-icon" aria-hidden="true">▥</div>
              <h3>Grade Management</h3>
              <p>Enter and review academic marks for Grades 4th–12th.</p>
            </a>

            <a class="dashboard-card" href="./attendance.html">
              <div class="card-icon" aria-hidden="true">✓</div>
              <h3>Attendance</h3>
              <p>Record daily class attendance and print formal sheet logs.</p>
            </a>

            <a class="dashboard-card" href="./schedule.html">
              <div class="card-icon" aria-hidden="true">◷</div>
              <h3>My Schedule</h3>
              <p>Review your weekly teaching timetable.</p>
            </a>

            <a class="dashboard-card" href="./announcements.html">
              <div class="card-icon" aria-hidden="true">◉</div>
              <h3>Announcements</h3>
              <p>Read official published updates from administration.</p>
            </a>

            <a class="dashboard-card" href="./password.html">
              <div class="card-icon" aria-hidden="true">◇</div>
              <h3>Change Password</h3>
              <p>Update your teacher account credentials securely.</p>
            </a>
          </div>
        </section>

        <section class="portal-card">
          <h2 class="section-title" style="margin-top:0;">Academic Summary</h2>
          <p>
            Your assigned classes, student counts, pending grade submissions, and attendance totals will display here upon connection with authorized database records.
          </p>
        </section>
      `;

      console.info("GRACAIS teacher account verified.");
    }
  </script>
</body>
</html>
