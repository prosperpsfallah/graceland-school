<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Teacher Grade Management">
  <title>Grade Management | GRACAIS</title>
  <link rel="icon" href="../logo.png">
  <link rel="stylesheet" href="../assets/style.css">

  <style>
    .teacher-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .welcome-panel {
      padding: 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, #063B7A, #0B5CAD);
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(3, 42, 88, 0.08);
    }

    .welcome-panel h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin: 0 0 10px 0;
    }

    .welcome-panel p {
      line-height: 1.7;
      margin: 0;
      color: #E0F5FF;
    }

    .portal-card {
      background: white;
      border: 1px solid #D9E5F0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
    }

    .portal-card h2, .portal-card h3 {
      color: #063B7A;
      margin: 0 0 8px 0;
      font-size: 1.15rem;
    }

    .muted {
      color: #64748B;
      font-size: 0.88rem;
      line-height: 1.6;
      margin: 0;
    }

    .grade-notice {
      padding: 14px 18px;
      margin-bottom: 24px;
      border: 1px solid #F4D58D;
      border-radius: 10px;
      background: #FFF8E6;
      color: #795716;
      line-height: 1.6;
      font-size: 0.9rem;
    }

    .grade-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .grade-fields label {
      display: block;
      font-weight: 600;
      color: #334155;
      margin-bottom: 7px;
      font-size: 0.88rem;
    }

    .grade-fields select,
    .grade-fields input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      background: #fff;
      color: #18324B;
      font: inherit;
      font-size: 0.9rem;
    }

    .grade-fields select:focus,
    .grade-fields input:focus {
      outline: none;
      border-color: #063B7A;
      box-shadow: 0 0 0 3px rgba(6, 59, 122, 0.1);
    }

    .grade-fields input:disabled,
    .grade-fields select:disabled {
      background: #F1F5F9;
      cursor: not-allowed;
    }

    .score-preview {
      margin-top: 20px;
      padding: 18px;
      border-radius: 10px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: center;
    }

    .preview-item small {
      display: block;
      color: #64748B;
      margin-bottom: 4px;
      font-size: 0.8rem;
    }

    .preview-item strong {
      color: #063B7A;
      font-size: 1.35rem;
    }

    /* Table Chart Layout */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      margin-top: 16px;
    }

    .portal-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    .portal-table th {
      background: #F8FAFC;
      color: #063B7A;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 2px solid #E2E8F0;
      white-space: nowrap;
    }

    .portal-table td {
      padding: 14px 16px;
      border-bottom: 1px solid #E2E8F0;
      color: #334155;
      vertical-align: middle;
    }

    .font-bold-title {
      font-weight: 600;
      color: #0F172A;
    }

    .grade-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      background: #E0F5FF;
      color: #063B7A;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Dropdown Action System */
    .portal-action-wrapper {
      position: relative;
      display: flex;
      justify-content: flex-end;
    }

    .portal-action-btn {
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      color: #0F172A;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .portal-action-btn:hover { background: #E2E8F0; }

    .portal-dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background: #ffffff;
      border: 1px solid #E2E8F0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border-radius: 8px;
      min-width: 170px;
      z-index: 50;
      overflow: hidden;
    }

    .portal-dropdown-menu.show { display: block; }

    .portal-dropdown-item {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: #334155;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .portal-dropdown-item:hover {
      background: #F8FAFC;
      color: #063B7A;
    }

    .empty-state-cell {
      text-align: center;
      padding: 32px 16px;
      color: #64748B;
    }

    .status-message {
      margin-top: 14px;
      color: #64748B;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .grade-fields { grid-template-columns: 1fr; }
      .teacher-page { padding: 16px; }
      .portal-card { padding: 18px; }
      .welcome-panel { padding: 20px; }
    }
  </style>
</head>

<body>
  <div id="app">
    <p style="padding:24px;">Checking teacher access…</p>
  </div>

  <script type="module">
    import {
      requireUser,
      setupLogout,
      esc
    } from "../assets/app.js";

    const ALLOWED_ROLES = ["teacher", "instructor"];
    let assignedStudentsList = [];

    const periods = [
      "1st Period",
      "2nd Period",
      "3rd Period",
      "3rd Period Exam",
      "4th Period",
      "5th Period",
      "6th Period",
      "6th Period Exam"
    ];

    const gradeOptions = Array.from(
      { length: 9 },
      (_, index) => index + 4
    );

    function toggleActionDropdown(button) {
      const currentDropdown = button.nextElementSibling;
      const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
      
      allDropdowns.forEach(menu => {
        if (menu !== currentDropdown) {
          menu.classList.remove("show");
        }
      });

      if (currentDropdown) {
        currentDropdown.classList.toggle("show");
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".portal-action-wrapper")) {
        document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
          menu.classList.remove("show");
        });
      }
    });

    function renderStudents(records) {
      const tbody = document.getElementById("studentTableBody");
      const status = document.getElementById("studentStatus");
      if (!tbody || !status) return;

      status.textContent = `${records.length} student record${records.length === 1 ? "" : "s"} shown`;

      if (!records.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state-cell">
              <div style="font-size:28px; margin-bottom:8px;">👥</div>
              <strong style="color:#063B7A; display:block; margin-bottom:4px;">No student records loaded</strong>
              <span>Students in your assigned classes (Grades 4th - 12th) will populate after database synchronization.</span>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = records.map((item, index) => {
        const studentName = item.full_name || [item.first_name, item.last_name].filter(Boolean).join(" ") || "Student";
        const studentId = item.school_id || item.student_id || "—";
        const gradeLevel = item.grade_level ? `Grade ${item.grade_level}` : "—";
        const currentGrade = item.score ?? "Not set";

        return `
          <tr>
            <td class="font-bold-title">${esc(studentName)}</td>
            <td>${esc(studentId)}</td>
            <td><span class="grade-badge">${esc(gradeLevel)}</span></td>
            <td><strong style="color:#063B7A;">${esc(currentGrade)}</strong></td>
            <td>
              <div class="portal-action-wrapper">
                <button type="button" class="portal-action-btn action-toggle-btn">
                  Actions ▾
                </button>
                <div class="portal-dropdown-menu">
                  <button type="button" class="portal-dropdown-item inspect-student-btn" data-index="${index}">
                    👁️ Inspect Record
                  </button>
                  <button type="button" class="portal-dropdown-item copy-student-btn" data-name="${esc(studentName)}" data-id="${esc(studentId)}">
                    📋 Copy Info
                  </button>
                </div>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".action-toggle-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleActionDropdown(btn);
        });
      });

      tbody.querySelectorAll(".inspect-student-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const rec = records[btn.dataset.index];
          const name = rec.full_name || [rec.first_name, rec.last_name].filter(Boolean).join(" ") || "Student";
          alert(`--- Student Profile ---\nName: ${name}\nID: ${rec.school_id || 'N/A'}\nClass: Grade ${rec.grade_level || 'N/A'}`);
        });
      });

      tbody.querySelectorAll(".copy-student-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const info = `${btn.dataset.name} (${btn.dataset.id})`;
          navigator.clipboard.writeText(info);
          alert(`Copied student details: ${info}`);
        });
      });
    }

    function buildPage() {
      const app = document.getElementById("app");

      app.innerHTML = `
        <div class="portal-shell">
          <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
              <img
                src="../logo.png"
                alt="GRACAIS logo"
                style="width:48px;height:48px;object-fit:contain;"
                onerror="this.style.display='none'"
              >
              <div>
                <strong>GRACAIS</strong>
                <small>Teacher Portal</small>
              </div>
            </div>

            <nav class="sidebar-nav" aria-label="Teacher navigation">
              <a href="./dashboard.html">Dashboard</a>
              <a href="./my-students.html">My Students</a>
              <a href="./grades.html" aria-current="page">Grade Management</a>
              <a href="./attendance.html">Attendance</a>
              <a href="./schedule.html">My Schedule</a>
              <a href="./announcements.html">Announcements</a>
              <a href="./password.html">Change Password</a>
            </nav>

            <div class="sidebar-footer">
              <button type="button" id="logoutButton" class="logout-button">
                Sign Out
              </button>
            </div>
          </aside>

          <div class="main-area">
            <header class="topbar">
              <button
                type="button"
                id="menuButton"
                aria-label="Open navigation menu"
                aria-expanded="false"
              >☰</button>
              <div>
                <strong>Grade Management</strong>
                <div id="teacherName" style="font-size:13px;color:#64748b;">
                  Teacher Portal [Grades 4th - 12th]
                </div>
              </div>
            </header>

            <main class="teacher-page">
              <section class="welcome-panel">
                <span style="display:inline-block;margin-bottom:10px;padding:4px 12px;border:1px solid rgba(255,255,255,.45);border-radius:30px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,0.1);">Academic Records</span>
                <h1>Grade Management</h1>
                <p>Manage and calculate academic grades for your assigned classes across Grades 4th through 12th.</p>
              </section>

              <div class="grade-notice">
                <strong>Academic records integrity.</strong>
                Scores and grade updates apply strictly to active academic sessions and synchronally reflect verified Supabase RLS security policies.
              </div>

              <!-- Entry Setup Card -->
              <section class="portal-card">
                <h2>Grade Entry Settings</h2>
                <p class="muted">
                  Select the academic class level and target grading period.
                </p>

                <div class="grade-fields">
                  <div>
                    <label for="gradeClass">Class Level</label>
                    <select id="gradeClass">
                      <option value="">Select class</option>
                      ${gradeOptions.map(number =>
                        `<option value="${number}">Grade ${number}</option>`
                      ).join("")}
                    </select>
                  </div>

                  <div>
                    <label for="gradePeriod">Grading Period</label>
                    <select id="gradePeriod">
                      <option value="">Select period</option>
                      ${periods.map(period =>
                        `<option value="${esc(period)}">${esc(period)}</option>`
                      ).join("")}
                    </select>
                  </div>

                  <div>
                    <label for="gradeScore">Score (0–100)</label>
                    <input
                      id="gradeScore"
                      type="number"
                      min="0"
                      max="100"
                      step="1"
                      placeholder="Enter score to preview"
                      inputmode="numeric"
                    >
                  </div>
                </div>

                <div class="score-preview" aria-live="polite">
                  <div class="preview-item">
                    <small>Numeric Score</small>
                    <strong id="scorePreview">—</strong>
                  </div>
                  <div class="preview-item">
                    <small>Letter Grade</small>
                    <strong id="letterPreview">—</strong>
                  </div>
                </div>

                <p class="status-message" id="gradeMessage">
                  Preview only: scores are calculated locally until saved to the database.
                </p>
              </section>

              <!-- Assigned Students Table Card -->
              <section class="portal-card">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                  <div>
                    <h2>Assigned Students</h2>
                    <p class="muted">Students enrolled in your assigned classes.</p>
                  </div>
                  <p id="studentStatus" style="margin:0; font-weight:600; color:#063B7A; font-size:0.88rem;">0 records loaded</p>
                </div>

                <div class="table-container">
                  <table class="portal-table">
                    <thead>
                      <tr>
                        <th>Student Name</th>
                        <th>Student ID</th>
                        <th>Class Level</th>
                        <th>Current Score</th>
                        <th style="text-align: right;">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="studentTableBody">
                      <tr>
                        <td colspan="5" class="empty-state-cell">
                          <div style="font-size:28px; margin-bottom:8px;">👥</div>
                          <strong style="color:#063B7A; display:block; margin-bottom:4px;">No student records loaded</strong>
                          <span>Students in your assigned classes (Grades 4th - 12th) will populate after database synchronization.</span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>

              <!-- Grading Scale Table Card -->
              <section class="portal-card">
                <h2>Standard Grading Scale</h2>
                <p class="muted">Official mark conversion standard for GRACAIS E-Portal.</p>

                <div class="table-container">
                  <table class="portal-table">
                    <thead>
                      <tr>
                        <th scope="col">Score Range</th>
                        <th scope="col">Letter Grade</th>
                        <th scope="col">Performance Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr><td class="font-bold-title">90 – 100</td><td><span class="grade-badge">A</span></td><td>Excellent / Superior</td></tr>
                      <tr><td class="font-bold-title">80 – 89</td><td><span class="grade-badge">B</span></td><td>Above Average</td></tr>
                      <tr><td class="font-bold-title">70 – 79</td><td><span class="grade-badge">C</span></td><td>Average / Satisfactory</td></tr>
                      <tr><td class="font-bold-title">60 – 69</td><td><span class="grade-badge">D</span></td><td>Passing / Below Average</td></tr>
                      <tr><td class="font-bold-title">Below 60</td><td><span class="grade-badge" style="background:#FEE2E2; color:#991B1B;">F</span></td><td>Failing / Needs Improvement</td></tr>
                    </tbody>
                  </table>
                </div>
                <p class="status-message">
                  Automatic period averages and cumulative totals compute upon submission into Supabase.
                </p>
              </section>
            </main>
          </div>

          <div id="sidebarOverlay" class="sidebar-overlay"></div>
        </div>
      `;

      const menuButton = document.getElementById("menuButton");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");

      function closeMenu() {
        sidebar?.classList.remove("open");
        overlay?.classList.remove("show");
        menuButton?.setAttribute("aria-expanded", "false");
      }

      menuButton?.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        overlay.classList.toggle("show", isOpen);
        menuButton.setAttribute("aria-expanded", String(isOpen));
      });

      overlay?.addEventListener("click", closeMenu);

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeMenu();
      });

      const scoreInput = document.getElementById("gradeScore");
      const scorePreview = document.getElementById("scorePreview");
      const letterPreview = document.getElementById("letterPreview");
      const gradeMessage = document.getElementById("gradeMessage");

      scoreInput.addEventListener("input", () => {
        const rawValue = scoreInput.value;

        if (rawValue === "") {
          scorePreview.textContent = "—";
          letterPreview.textContent = "—";
          gradeMessage.textContent =
            "Preview only: scores are not saved to the school database.";
          return;
        }

        const score = Number(rawValue);

        if (!Number.isFinite(score) || score < 0 || score > 100) {
          scorePreview.textContent = "Invalid";
          letterPreview.textContent = "—";
          gradeMessage.textContent =
            "Enter a score from 0 to 100.";
          return;
        }

        if (!Number.isInteger(score)) {
          scorePreview.textContent = "Invalid";
          letterPreview.textContent = "—";
          gradeMessage.textContent =
            "Enter a whole-number score from 0 to 100.";
          return;
        }

        let letter = "F";
        if (score >= 90) letter = "A";
        else if (score >= 80) letter = "B";
        else if (score >= 70) letter = "C";
        else if (score >= 60) letter = "D";

        scorePreview.textContent = String(score);
        letterPreview.textContent = letter;
        gradeMessage.textContent =
          "Preview calculated locally only. Nothing has been saved.";
      });
    }

    setupLogout();

    const result = await requireUser(ALLOWED_ROLES);

    if (result) {
      buildPage();

      const profile = result.profile || {};
      const fullName = [
        profile.first_name,
        profile.last_name
      ].filter(Boolean).join(" ");

      document.getElementById("teacherName").textContent =
        (fullName ? "Teacher: " + fullName : "Authorized Teacher") + " [Grades 4th - 12th]";

      renderStudents(assignedStudentsList);
      setupLogout();
    }
  </script>
</body>
</html>
