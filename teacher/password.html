
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Teacher Password Settings">
  <title>Change Password | GRACAIS</title>
  <link rel="icon" href="../logo.png">
  <link rel="stylesheet" href="../assets/style.css">

  <style>
    .teacher-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .page-heading {
      margin-bottom: 22px;
    }

    .page-heading h1 {
      color: #063B7A;
      margin-bottom: 8px;
    }

    .panel {
      background: #fff;
      border: 1px solid #dbe7f0;
      border-radius: 14px;
      padding: 22px;
      margin: 20px 0;
      box-shadow: 0 4px 14px rgba(3, 42, 88, 0.05);
    }

    .notice {
      padding: 14px 16px;
      margin: 16px 0;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      background: #f0f9ff;
      color: #075985;
      line-height: 1.6;
    }

    .form-field {
      margin: 18px 0;
    }

    .form-field label {
      display: block;
      font-weight: 600;
      color: #17324d;
      margin-bottom: 7px;
    }

    .form-field input {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #17324d;
      font: inherit;
    }

    .form-field input:focus {
      outline: 2px solid #38BDF8;
      outline-offset: 2px;
    }

    .password-help {
      color: #64748b;
      font-size: .9rem;
      line-height: 1.6;
      margin-top: 7px;
    }

    .action-button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      background: #063B7A;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .action-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    @media (max-width: 760px) {
      .teacher-page {
        padding: 14px;
      }

      .panel {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <p style="padding:24px;">Checking teacher access…</p>
  </div>

  <script type="module">
    import {
      supabase,
      supabaseReady
    } from "../assets/supabase.js";

    import {
      requireUser,
      setupLogout
    } from "../assets/app.js";

    const ALLOWED_ROLES = ["teacher", "instructor"];

    function renderPage() {
      document.getElementById("app").innerHTML = `
        <div class="portal-shell">
          <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
              <img
                src="../logo.png"
                alt="GRACAIS logo"
                style="width:48px;height:48px;object-fit:contain;"
                onerror="this.style.display='none'"
              >
              <div>
                <strong>GRACAIS</strong>
                <small>Teacher Portal</small>
              </div>
            </div>

            <nav class="sidebar-nav" aria-label="Teacher navigation">
              <a href="./dashboard.html">Dashboard</a>
              <a href="./my-students.html">My Students</a>
              <a href="./grades.html">Grade Management</a>
              <a href="./attendance.html">Attendance</a>
              <a href="./schedule.html">My Schedule</a>
              <a href="./announcements.html">Announcements</a>
              <a href="./password.html" aria-current="page">Change Password</a>
            </nav>

            <div class="sidebar-footer">
              <button type="button" id="logoutButton" class="logout-button">
                Sign Out
              </button>
            </div>
          </aside>

          <div class="main-area">
            <header class="topbar">
              <button
                type="button"
                id="menuButton"
                aria-label="Open navigation menu"
                aria-expanded="false"
              >☰</button>
              <div>
                <strong>Account Security</strong>
                <div id="teacherName" style="font-size:13px;color:#64748b;">
                  Teacher Portal
                </div>
              </div>
            </header>

            <main class="teacher-page">
              <section class="page-heading">
                <h1>Change Password</h1>
                <p>Keep your school account secure.</p>
              </section>

              <div class="notice">
                Use a strong password that you do not use for other accounts.
                Your new password will be submitted to Supabase Authentication.
              </div>

              <section class="panel">
                <h2>Update Your Password</h2>

                <form id="passwordForm">
                  <div class="form-field">
                    <label for="newPassword">New password</label>
                    <input
                      id="newPassword"
                      name="newPassword"
                      type="password"
                      autocomplete="new-password"
                      minlength="8"
                      required
                    >
                    <p class="password-help">
                      Use at least 8 characters. A longer, unique password
                      is recommended.
                    </p>
                  </div>

                  <div class="form-field">
                    <label for="confirmPassword">Confirm new password</label>
                    <input
                      id="confirmPassword"
                      name="confirmPassword"
                      type="password"
                      autocomplete="new-password"
                      minlength="8"
                      required
                    >
                  </div>

                  <button class="action-button" id="savePasswordButton" type="submit">
                    Update Password
                  </button>

                  <div
                    id="passwordMessage"
                    class="message"
                    role="status"
                    aria-live="polite"
                  ></div>
                </form>
              </section>
            </main>
          </div>

          <div id="sidebarOverlay" class="sidebar-overlay"></div>
        </div>
      `;

      const menuButton = document.getElementById("menuButton");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");

      function closeMenu() {
        sidebar?.classList.remove("open");
        overlay?.classList.remove("show");
        menuButton?.setAttribute("aria-expanded", "false");
      }

      menuButton?.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        overlay.classList.toggle("show", isOpen);
        menuButton.setAttribute("aria-expanded", String(isOpen));
      });

      overlay?.addEventListener("click", closeMenu);

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeMenu();
      });

      const form = document.getElementById("passwordForm");
      const newPassword = document.getElementById("newPassword");
      const confirmPassword = document.getElementById("confirmPassword");
      const saveButton = document.getElementById("savePasswordButton");
      const message = document.getElementById("passwordMessage");

      function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();

        const password = newPassword.value;
        const confirmation = confirmPassword.value;

        if (password.length < 8) {
          showMessage("Your password must contain at least 8 characters.", "error");
          return;
        }

        if (password !== confirmation) {
          showMessage("The passwords do not match. Please try again.", "error");
          confirmPassword.focus();
          return;
        }

        if (!supabaseReady || !supabase) {
          showMessage(
            "The secure password service is not configured. Please contact the portal administrator.",
            "error"
          );
          return;
        }

        saveButton.disabled = true;
        saveButton.textContent = "Updating…";
        message.className = "message";

        try {
          const { data: userData, error: userError } =
            await supabase.auth.getUser();

          if (userError || !userData?.user) {
            showMessage(
              "Your session could not be verified. Sign in again and retry.",
              "error"
            );
            return;
          }

          const { error } = await supabase.auth.updateUser({
            password
          });

          if (error) {
            showMessage(
              error.message || "The password could not be updated.",
              "error"
            );
            return;
          }

          form.reset();
          showMessage(
            "Your password was updated successfully.",
            "success"
          );
        } catch (error) {
          showMessage(
            "The password service could not be reached. Check your connection and try again.",
            "error"
          );
        } finally {
          saveButton.disabled = false;
          saveButton.textContent = "Update Password";
        }
      });
    }

    setupLogout();

    const result = await requireUser(ALLOWED_ROLES);

    if (result) {
      renderPage();

      const profile = result.profile || {};
      const fullName = [
        profile.first_name,
        profile.last_name
      ].filter(Boolean).join(" ");

      document.getElementById("teacherName").textContent =
        fullName || "Authorized Teacher";

      setupLogout();
    }
  </script>
</body>
</html>
