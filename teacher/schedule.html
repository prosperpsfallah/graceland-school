<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Teacher Schedule">
  <title>My Schedule | GRACAIS</title>
  <link rel="icon" href="../logo.png">
  <link rel="stylesheet" href="../assets/style.css">

  <style>
    .teacher-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .welcome-panel {
      padding: 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, #063B7A, #0B5CAD);
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(3, 42, 88, 0.08);
    }

    .welcome-panel h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin: 0 0 10px 0;
    }

    .welcome-panel p {
      line-height: 1.7;
      margin: 0;
      color: #E0F5FF;
    }

    .portal-card {
      background: #fff;
      border: 1px solid #D9E5F0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
    }

    .portal-card h2, .portal-card h3 {
      color: #063B7A;
      margin: 0 0 8px 0;
      font-size: 1.15rem;
    }

    .muted {
      color: #64748B;
      font-size: 0.88rem;
      line-height: 1.6;
      margin: 0;
    }

    .notice {
      padding: 14px 18px;
      margin-bottom: 24px;
      border: 1px solid #F4D58D;
      border-radius: 10px;
      background: #FFF8E6;
      color: #795716;
      line-height: 1.6;
      font-size: 0.9rem;
    }

    /* Table Chart Layout */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      margin-top: 16px;
    }

    .portal-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    .portal-table th {
      background: #F8FAFC;
      color: #063B7A;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 2px solid #E2E8F0;
      white-space: nowrap;
    }

    .portal-table td {
      padding: 14px 16px;
      border-bottom: 1px solid #E2E8F0;
      color: #334155;
      vertical-align: middle;
    }

    .font-bold-title {
      font-weight: 600;
      color: #0F172A;
    }

    .day-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      background: #E0F5FF;
      color: #063B7A;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Dropdown Action System */
    .portal-action-wrapper {
      position: relative;
      display: flex;
      justify-content: flex-end;
    }

    .portal-action-btn {
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      color: #0F172A;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .portal-action-btn:hover { background: #E2E8F0; }

    .portal-dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background: #ffffff;
      border: 1px solid #E2E8F0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border-radius: 8px;
      min-width: 170px;
      z-index: 50;
      overflow: hidden;
    }

    .portal-dropdown-menu.show { display: block; }

    .portal-dropdown-item {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: #334155;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .portal-dropdown-item:hover {
      background: #F8FAFC;
      color: #063B7A;
    }

    .empty-state-cell {
      text-align: center;
      padding: 32px 16px;
      color: #64748B;
    }

    .status-message {
      margin-top: 14px;
      color: #64748B;
      line-height: 1.6;
      font-size: .88rem;
    }

    @media (max-width: 760px) {
      .teacher-page { padding: 16px; }
      .portal-card { padding: 18px; }
      .welcome-panel { padding: 20px; }
    }
  </style>
</head>

<body>
  <div id="app">
    <p style="padding:24px;">Checking teacher access…</p>
  </div>

  <script type="module">
    import {
      requireUser,
      setupLogout,
      esc
    } from "../assets/app.js";

    const ALLOWED_ROLES = ["teacher", "instructor"];
    let teacherScheduleList = [];

    function toggleActionDropdown(button) {
      const currentDropdown = button.nextElementSibling;
      const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
      
      allDropdowns.forEach(menu => {
        if (menu !== currentDropdown) {
          menu.classList.remove("show");
        }
      });

      if (currentDropdown) {
        currentDropdown.classList.toggle("show");
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".portal-action-wrapper")) {
        document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
          menu.classList.remove("show");
        });
      }
    });

    function renderSchedule(records) {
      const tbody = document.getElementById("scheduleTableBody");
      const status = document.getElementById("scheduleStatus");
      if (!tbody || !status) return;

      status.textContent = `${records.length} session${records.length === 1 ? "" : "s"} shown`;

      if (!records.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state-cell">
              <div style="font-size:28px; margin-bottom:8px;">🗓️</div>
              <strong style="color:#063B7A; display:block; margin-bottom:4px;">No schedule records available</strong>
              <span>Your teaching schedule for Grades 4th through 12th will populate after school timetable queries are connected.</span>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = records.map((item, index) => {
        const dayVal = item.day || item.day_of_week || "—";
        const timeVal = item.time || (item.start_time && item.end_time ? `${item.start_time} - ${item.end_time}` : "—");
        const classVal = item.class_name || (item.grade_level ? `Grade ${item.grade_level}` : "—");
        const subjectVal = item.subject_name || item.subject || "—";
        const roomVal = item.room || item.classroom || "—";

        return `
          <tr>
            <td><span class="day-badge">${esc(dayVal)}</span></td>
            <td class="font-bold-title">${esc(timeVal)}</td>
            <td><strong style="color:#063B7A;">${esc(classVal)}</strong></td>
            <td class="font-bold-title">${esc(subjectVal)}</td>
            <td>${esc(roomVal)}</td>
            <td>
              <div class="portal-action-wrapper">
                <button type="button" class="portal-action-btn action-toggle-btn">
                  Actions ▾
                </button>
                <div class="portal-dropdown-menu">
                  <button type="button" class="portal-dropdown-item inspect-schedule-btn" data-index="${index}">
                    👁️ Inspect Session
                  </button>
                  <button type="button" class="portal-dropdown-item copy-schedule-btn" data-subject="${esc(subjectVal)}" data-class="${esc(classVal)}" data-day="${esc(dayVal)}">
                    📋 Copy Summary
                  </button>
                </div>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".action-toggle-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleActionDropdown(btn);
        });
      });

      tbody.querySelectorAll(".inspect-schedule-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const rec = records[btn.dataset.index];
          alert(`--- Schedule Session ---\nDay: ${rec.day || rec.day_of_week || 'N/A'}\nSubject: ${rec.subject_name || rec.subject || 'N/A'}\nClass: ${rec.class_name || 'Grade ' + (rec.grade_level || 'N/A')}\nRoom: ${rec.room || rec.classroom || 'N/A'}`);
        });
      });

      tbody.querySelectorAll(".copy-schedule-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const summary = `GRACAIS Faculty Schedule: ${btn.dataset.subject} for ${btn.dataset.class} on ${btn.dataset.day}`;
          navigator.clipboard.writeText(summary);
          alert(`Copied summary: ${summary}`);
        });
      });
    }

    function renderPage() {
      const app = document.getElementById("app");

      app.innerHTML = `
        <div class="portal-shell">
          <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
              <img
                src="../logo.png"
                alt="GRACAIS logo"
                style="width:48px;height:48px;object-fit:contain;"
                onerror="this.style.display='none'"
              >
              <div>
                <strong>GRACAIS</strong>
                <small>Teacher Portal</small>
              </div>
            </div>

            <nav class="sidebar-nav" aria-label="Teacher navigation">
              <a href="./dashboard.html">Dashboard</a>
              <a href="./my-students.html">My Students</a>
              <a href="./grades.html">Grade Management</a>
              <a href="./attendance.html">Attendance</a>
              <a href="./schedule.html" aria-current="page">My Schedule</a>
              <a href="./announcements.html">Announcements</a>
              <a href="./password.html">Change Password</a>
            </nav>

            <div class="sidebar-footer">
              <button type="button" id="logoutButton" class="logout-button">
                Sign Out
              </button>
            </div>
          </aside>

          <div class="main-area">
            <header class="topbar">
              <button
                type="button"
                id="menuButton"
                aria-label="Open navigation menu"
                aria-expanded="false"
              >☰</button>
              <div>
                <strong>My Schedule</strong>
                <div id="teacherName" style="font-size:13px;color:#64748b;">
                  Teacher Portal [Grades 4th - 12th]
                </div>
              </div>
            </header>

            <main class="teacher-page">
              <section class="welcome-panel">
                <span style="display:inline-block;margin-bottom:10px;padding:4px 12px;border:1px solid rgba(255,255,255,.45);border-radius:30px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,0.1);">Timetable Operations</span>
                <h1>My Teaching Schedule</h1>
                <p>View your assigned classes, subject sessions, and scheduled periods across Grades 4th through 12th.</p>
              </section>

              <div class="notice">
                <strong>Schedule synchronization:</strong>
                Only sessions assigned to your authenticated teacher account are retrieved from Supabase and displayed here.
              </div>

              <!-- Weekly Schedule Table Card -->
              <section class="portal-card">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                  <div>
                    <h2>Weekly Teaching Timetable</h2>
                    <p class="muted">Assigned academic sessions, class levels, and rooms.</p>
                  </div>
                  <p id="scheduleStatus" style="margin:0; font-weight:600; color:#063B7A; font-size:0.88rem;">0 sessions loaded</p>
                </div>

                <div class="table-container">
                  <table class="portal-table">
                    <thead>
                      <tr>
                        <th>Day</th>
                        <th>Time Period</th>
                        <th>Class Level</th>
                        <th>Subject</th>
                        <th>Room</th>
                        <th style="text-align: right;">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="scheduleTableBody">
                      <tr>
                        <td colspan="6" class="empty-state-cell">
                          <div style="font-size:28px; margin-bottom:8px;">🗓️</div>
                          <strong style="color:#063B7A; display:block; margin-bottom:4px;">No schedule records available</strong>
                          <span>Your teaching schedule for Grades 4th through 12th will populate after school timetable queries are connected.</span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <p class="status-message">
                  Official schedule records include academic year, class section, subject, weekday, period timing, and assigned room location.
                </p>
              </section>
            </main>
          </div>

          <div id="sidebarOverlay" class="sidebar-overlay"></div>
        </div>
      `;

      const menuButton = document.getElementById("menuButton");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");

      function closeMenu() {
        sidebar?.classList.remove("open");
        overlay?.classList.remove("show");
        menuButton?.setAttribute("aria-expanded", "false");
      }

      menuButton?.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        overlay.classList.toggle("show", isOpen);
        menuButton.setAttribute("aria-expanded", String(isOpen));
      });

      overlay?.addEventListener("click", closeMenu);

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeMenu();
      });
    }

    setupLogout();

    const result = await requireUser(ALLOWED_ROLES);

    if (result) {
      renderPage();

      const profile = result.profile || {};
      const fullName = [
        profile.first_name,
        profile.last_name
      ].filter(Boolean).join(" ");

      document.getElementById("teacherName").textContent =
        (fullName ? "Teacher: " + fullName : "Authorized Teacher") + " [Grades 4th - 12th]";

      renderSchedule(teacherScheduleList);
      setupLogout();
    }
  </script>
</body>
</html>
