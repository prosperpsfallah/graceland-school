<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Student Enrollment Records">
  <title>Student Enrollment | GRACAIS E-Portal</title>
  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import {
      setupLogout,
      esc
    } from "../assets/app.js";
    import {
      initLayout,
      requireUser
    } from "../assets/layout.js";
    import { supabase } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    let enrollmentRecords = [];

    function safe(value) {
      return esc(String(value ?? ""));
    }

    function getStudentName(record) {
      const student = record.students;
      if (student) {
        const name = [
          student.first_name,
          student.last_name
        ].filter(Boolean).join(" ");
        if (name) return name;
      }
      return record.student_name || record.full_name || "—";
    }

    function getStudentId(record) {
      return record.students?.student_id
        || record.student_id
        || "—";
    }

    function getClassName(record) {
      return record.classes?.name
        || record.class_name
        || record.class_id
        || "—";
    }

    function getAcademicYear(record) {
      return record.academic_years?.name
        || record.academic_year
        || record.academic_year_id
        || "—";
    }

    function getEnrollmentStatus(record) {
      return record.status
        || record.enrollment_status
        || "Active";
    }

    function toggleActionDropdown(button) {
      const currentDropdown = button.nextElementSibling;
      const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
      
      allDropdowns.forEach(menu => {
        if (menu !== currentDropdown) {
          menu.classList.remove("show");
        }
      });

      if (currentDropdown) {
        currentDropdown.classList.toggle("show");
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".portal-action-wrapper")) {
        document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
          menu.classList.remove("show");
        });
      }
    });

    function renderEnrollments() {
      const tbody = document.getElementById("enrollmentRows");
      const status = document.getElementById("enrollmentStatus");
      const searchInput = document.getElementById("enrollmentSearch");
      if (!tbody || !status || !searchInput) return;

      const query = searchInput.value.trim().toLowerCase();
      const filtered = enrollmentRecords.filter(record => {
        const searchable = [
          getStudentId(record),
          getStudentName(record),
          getClassName(record),
          getAcademicYear(record),
          getEnrollmentStatus(record)
        ].join(" ").toLowerCase();
        return searchable.includes(query);
      });

      status.textContent =
        `${filtered.length} enrollment record${filtered.length === 1 ? "" : "s"} shown`;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state-cell">
              <div class="empty-state">
                <h3>${query ? "No matching enrollments" : "No enrollment records found"}</h3>
                <p>
                  ${query
                    ? "Try searching with a different student ID, name, class, or academic year."
                    : "Existing enrollment records will appear here when available in the database."}
                </p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map((record, index) => {
        const studentIdVal = getStudentId(record);
        const studentNameVal = getStudentName(record);
        const classVal = getClassName(record);
        const yearVal = getAcademicYear(record);
        const statusVal = getEnrollmentStatus(record);
        const isActive = statusVal.toLowerCase() === "active";

        return `
          <tr>
            <td style="font-family: monospace;" class="font-bold-title">${safe(studentIdVal)}</td>
            <td>${safe(studentNameVal)}</td>
            <td>${safe(classVal)}</td>
            <td>${safe(yearVal)}</td>
            <td>
              <span class="status-badge ${isActive ? "active" : "inactive"}">
                ${safe(statusVal)}
              </span>
            </td>
            <td>
              <div class="portal-action-wrapper">
                <button type="button" class="portal-action-btn action-toggle-btn">
                  Actions ▾
                </button>
                <div class="portal-dropdown-menu">
                  <button type="button" class="portal-dropdown-item view-enrollment" data-index="${index}">
                    👁️ Inspect Enrollment
                  </button>
                  <button type="button" class="portal-dropdown-item copy-student-id" data-id="${safe(studentIdVal)}">
                    📋 Copy Student ID
                  </button>
                </div>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".action-toggle-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleActionDropdown(btn);
        });
      });

      tbody.querySelectorAll(".view-enrollment").forEach(button => {
        button.addEventListener("click", () => {
          const record = filtered[button.dataset.index];
          alert(`--- Enrollment Record ---\nStudent: ${getStudentName(record)} (${getStudentId(record)})\nClass: ${getClassName(record)}\nAcademic Year: ${getAcademicYear(record)}\nStatus: ${getEnrollmentStatus(record)}`);
        });
      });

      tbody.querySelectorAll(".copy-student-id").forEach(button => {
        button.addEventListener("click", () => {
          const id = button.dataset.id;
          if (id) {
            navigator.clipboard.writeText(id);
            alert(`Copied Student ID: ${id}`);
          }
        });
      });
    }

    async function fetchEnrollmentsData() {
      const primaryRelational = await supabase
        .from("enrollments")
        .select(`
          *,
          students (
            student_id,
            first_name,
            last_name
          ),
          classes (
            name
          ),
          academic_years (
            name
          )
        `);

      if (!primaryRelational.error) {
        return primaryRelational;
      }

      console.warn("Relational enrollments query failed, trying direct select...", primaryRelational.error);

      const primaryDirect = await supabase
        .from("enrollments")
        .select("*");

      if (!primaryDirect.error) {
        return primaryDirect;
      }

      console.warn("enrollments table query failed, trying student_enrollments fallback...", primaryDirect.error);

      const studentEnrollments = await supabase
        .from("student_enrollments")
        .select("*");

      if (!studentEnrollments.error) {
        return studentEnrollments;
      }

      const classEnrollments = await supabase
        .from("class_enrollments")
        .select("*");

      if (!classEnrollments.error) {
        return classEnrollments;
      }

      return primaryRelational;
    }

    async function loadEnrollments() {
      const tbody = document.getElementById("enrollmentRows");
      const status = document.getElementById("enrollmentStatus");
      const refreshButton = document.getElementById("refreshEnrollments");
      if (!tbody || !status || !refreshButton) return;

      refreshButton.disabled = true;
      status.textContent = "Loading enrollment records...";
      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="loading-cell">Loading enrollment records...</td>
        </tr>
      `;

      try {
        const { data, error } = await fetchEnrollmentsData();

        if (error) throw error;

        enrollmentRecords = data ?? [];
        enrollmentRecords.sort((a, b) =>
          getStudentName(a).localeCompare(getStudentName(b))
        );
        renderEnrollments();
      } catch (error) {
        console.error("Enrollment loading error:", error);
        status.textContent = "Unable to load enrollment records";
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state-cell">
              <div class="empty-state">
                <h3>Could not load enrollment records</h3>
                <p>
                  Check the enrollments table, its foreign-key
                  relationships, and the Supabase access policies.
                </p>
                <p id="enrollmentError" style="color: #DC2626; font-size: 13px; margin-top: 6px;"></p>
              </div>
            </td>
          </tr>
        `;
        const errorElement = document.getElementById("enrollmentError");
        if (errorElement) {
          errorElement.textContent =
            error?.message || "An unexpected database error occurred.";
        }
      } finally {
        refreshButton.disabled = false;
      }
    }

    async function initEnrollmentPage() {
      initLayout(
        "super_admin",
        "student-enrollment.html",
        "Student Enrollment"
      );
      setupLogout();
      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Student Enrollment Records</h1>
            <p>
              Review student enrollment and class placement
              records for GRACAIS [Grades 4th - 12th].
            </p>
          </div>
          <button
            type="button"
            class="btn btn-secondary"
            id="refreshEnrollments"
          >
            ↻ Refresh Records
          </button>
        </section>

        <section class="card portal-card">
          <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
            <div>
              <h2>Enrollment Records</h2>
              <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Existing enrollment records from the school database.</p>
            </div>
            <p id="enrollmentStatus" aria-live="polite" style="font-weight: 600; color: #063B7A; margin: 0;">Preparing enrollment records...</p>
          </div>

          <div class="table-toolbar" style="margin-bottom: 16px;">
            <div class="search-input-wrapper">
              <input
                type="search"
                id="enrollmentSearch"
                placeholder="🔍 Search by student ID, name, class, or year..."
                autocomplete="off"
                style="width:100%; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px;"
              >
            </div>
          </div>

          <div class="table-container">
            <table class="portal-table">
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Academic Year</th>
                  <th>Enrollment Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="enrollmentRows">
                <tr>
                  <td colspan="6" class="loading-cell">Loading enrollment records...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <style>
          .portal-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #D9E5F0;
            box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
            padding: 24px;
          }

          .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
          }

          .page-heading h1 {
            color: #063B7A;
            font-size: 1.5rem;
            margin: 0;
          }

          .page-heading p {
            color: #64748B;
            margin: 4px 0 0 0;
            font-size: 0.9rem;
          }

          .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
          }

          .portal-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
          }

          .portal-table th {
            background: #F8FAFC;
            color: #063B7A;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid #E2E8F0;
            white-space: nowrap;
          }

          .portal-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #E2E8F0;
            color: #334155;
            vertical-align: middle;
          }

          .font-bold-title {
            font-weight: 600;
            color: #0F172A;
          }

          .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
          }
          .status-badge.active {
            background: #DCFCE7;
            color: #15803D;
          }
          .status-badge.inactive {
            background: #F1F5F9;
            color: #64748B;
          }

          /* Dropdown Menu System */
          .portal-action-wrapper {
            position: relative;
            display: flex;
            justify-content: flex-end;
          }

          .portal-action-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
          }

          .portal-action-btn:hover {
            background: #E2E8F0;
          }

          .portal-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            min-width: 170px;
            z-index: 50;
            overflow: hidden;
          }

          .portal-dropdown-menu.show {
            display: block;
          }

          .portal-dropdown-item {
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            background: transparent;
            border: none;
            color: #334155;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease;
          }

          .portal-dropdown-item:hover {
            background: #F8FAFC;
            color: #063B7A;
          }

          .loading-cell {
            text-align: center;
            padding: 24px;
            color: #64748B;
          }

          .empty-state-cell {
            text-align: center;
            padding: 32px 16px;
            color: #64748B;
          }

          #refreshEnrollments:disabled {
            opacity: 0.65;
            cursor: wait;
          }
        </style>
      `;

      document
        .getElementById("enrollmentSearch")
        .addEventListener("input", renderEnrollments);
      document
        .getElementById("refreshEnrollments")
        .addEventListener("click", loadEnrollments);

      await loadEnrollments();
    }

    initEnrollmentPage().catch(error => {
      console.error("Enrollment page error:", error);
      const pageContent = document.getElementById("pageContent");
      if (pageContent) {
        pageContent.innerHTML = `
          <section class="card portal-card">
            <h2>Unable to load Enrollment Records</h2>
            <p>
              Check the shared portal files and authentication configuration.
            </p>
          </section>
        `;
      }
    });
  </script>
</body>
</html>
