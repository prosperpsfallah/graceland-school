<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS E-Portal System Settings">
  <title>System Settings | GRACAIS E-Portal</title>
  <link
    rel="icon"
    href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png"
    type="image/png"
  >
  <link
    rel="apple-touch-icon"
    href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png"
  >
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import {
      initLayout,
      requireUser
    } from "../assets/layout.js";
    import {
      setupLogout,
      esc
    } from "../assets/app.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration"
    ];
    const SCHOOL_NAME =
      "Graceland Academy International School of Excellence";
    const SCHOOL_ABBREVIATION = "GRACAIS";

    function showSettingsError(message) {
      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;
      pageContent.innerHTML = `
        <section class="card portal-card">
          <h2>Unable to load System Settings</h2>
          <p>${esc(message)}</p>
        </section>
      `;
    }

    function toggleActionDropdown(button) {
      const currentDropdown = button.nextElementSibling;
      const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
      
      allDropdowns.forEach(menu => {
        if (menu !== currentDropdown) {
          menu.classList.remove("show");
        }
      });

      if (currentDropdown) {
        currentDropdown.classList.toggle("show");
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".portal-action-wrapper")) {
        document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
          menu.classList.remove("show");
        });
      }
    });

    async function initSettingsPage() {
      initLayout(
        "super_admin",
        "settings.html",
        "System Settings"
      );
      setupLogout();
      const user = await requireUser(ALLOWED_ROLES);
      if (!user) return;
      const pageContent = document.getElementById("pageContent");
      if (!pageContent) {
        throw new Error("The shared portal layout did not create pageContent.");
      }

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>System Settings</h1>
            <p>
              Manage and review the configuration of the
              GRACAIS E-Portal [Grades 4th - 12th].
            </p>
          </div>
        </section>

        <div class="portal-grid">
          <!-- School Identity Card -->
          <section class="card portal-card">
            <div class="card-header">
              <div>
                <h2>School Information</h2>
                <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Official identity of the institution.</p>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="schoolName">Official School Name</label>
                <input
                  id="schoolName"
                  type="text"
                  value="${esc(SCHOOL_NAME)}"
                  readonly
                  style="width:100%; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px; background: #F8FAFC;"
                >
              </div>
              <div class="form-group">
                <label for="schoolAbbreviation">School Abbreviation</label>
                <input
                  id="schoolAbbreviation"
                  type="text"
                  value="${esc(SCHOOL_ABBREVIATION)}"
                  readonly
                  style="width:100%; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px; background: #F8FAFC;"
                >
              </div>
            </div>
            <p style="margin-top: 12px; font-size: 0.88rem; color: #64748B;">
              These are the official school details displayed throughout the portal. They cannot be changed from this reference section.
            </p>
          </section>

          <!-- Quick Navigation Links Card -->
          <section class="card portal-card">
            <div class="card-header">
              <div>
                <h2>Academic Configuration</h2>
                <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Open pages to manage core academic structures.</p>
              </div>
            </div>
            <div class="settings-links">
              <a class="portal-btn-link" href="academic-years.html">Academic Years →</a>
              <a class="portal-btn-link" href="classes.html">Classes & Grade Levels →</a>
              <a class="portal-btn-link" href="grades.html">Grade Records →</a>
              <a class="portal-btn-link" href="schedule.html">Academic Schedule →</a>
            </div>
            <p style="font-size: 0.88rem; color: #64748B; margin: 0;">
              Keep historical academic records available across school years. Changes must follow the school's approved academic rules.
            </p>
          </section>

          <!-- Security Control Table Chart Card -->
          <section class="card portal-card">
            <div class="card-header" style="margin-bottom: 16px;">
              <div>
                <h2>Security and Access Policy</h2>
                <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Policies protecting student information and administrative privileges.</p>
              </div>
            </div>
            <div class="table-container">
              <table class="portal-table">
                <thead>
                  <tr>
                    <th>Security Rule / Control</th>
                    <th>Scope</th>
                    <th>Status</th>
                    <th style="text-align: right;">Actions</th>
                  </tr>
                </thead>
                <tbody id="securityRulesBody">
                  <tr>
                    <td class="font-bold-title">User Authentication</td>
                    <td>Authorized account sign-ins only</td>
                    <td><span class="status-badge active">Enforced</span></td>
                    <td>
                      <div class="portal-action-wrapper">
                        <button type="button" class="portal-action-btn action-toggle-btn">Actions ▾</button>
                        <div class="portal-dropdown-menu">
                          <button type="button" class="portal-dropdown-item view-rule-btn" data-title="User Authentication" data-desc="Allow access only to authorized user accounts via Supabase auth.">👁️ Inspect Rule</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td class="font-bold-title">Role-Based Page Control</td>
                    <td>Super Admin, Principal, Registrar, Admin</td>
                    <td><span class="status-badge active">Enforced</span></td>
                    <td>
                      <div class="portal-action-wrapper">
                        <button type="button" class="portal-action-btn action-toggle-btn">Actions ▾</button>
                        <div class="portal-dropdown-menu">
                          <button type="button" class="portal-dropdown-item view-rule-btn" data-title="Role-Based Control" data-desc="Restrict administrative views according to assigned role permissions.">👁️ Inspect Rule</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td class="font-bold-title">Data Protection</td>
                    <td>Grades, Attendance, and Student Records</td>
                    <td><span class="status-badge active">Enforced</span></td>
                    <td>
                      <div class="portal-action-wrapper">
                        <button type="button" class="portal-action-btn action-toggle-btn">Actions ▾</button>
                        <div class="portal-dropdown-menu">
                          <button type="button" class="portal-dropdown-item view-rule-btn" data-title="Data Protection" data-desc="Protect sensitive academic records via Row Level Security policies.">👁️ Inspect Rule</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td class="font-bold-title">Audit Logging</td>
                    <td>System Activity and Operations</td>
                    <td><span class="status-badge active">Enforced</span></td>
                    <td>
                      <div class="portal-action-wrapper">
                        <button type="button" class="portal-action-btn action-toggle-btn">Actions ▾</button>
                        <div class="portal-dropdown-menu">
                          <button type="button" class="portal-dropdown-item view-rule-btn" data-title="Audit Logging" data-desc="Maintain real-time audit trail of administrative actions.">👁️ Inspect Rule</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="settings-links" style="margin-top: 16px;">
              <a class="portal-btn-link" href="users.html">Manage Users →</a>
              <a class="portal-btn-link" href="audit-logs.html">View Audit Logs →</a>
            </div>
          </section>

          <!-- Module Support Table Chart Card -->
          <section class="card portal-card">
            <div class="card-header" style="margin-bottom: 16px;">
              <div>
                <h2>Supported Portal Features</h2>
                <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Academic operations handled within the GRACAIS E-Portal.</p>
              </div>
            </div>
            <div class="table-container">
              <table class="portal-table">
                <thead>
                  <tr>
                    <th>Academic Feature Module</th>
                    <th>Grade Scope</th>
                    <th>Status</th>
                    <th style="text-align: right;">Actions</th>
                  </tr>
                </thead>
                <tbody id="featuresBody">
                  <tr>
                    <td class="font-bold-title">Student Academic Records</td>
                    <td>4th Grade – 12th Grade</td>
                    <td><span class="status-badge active">Active</span></td>
                    <td>
                      <div class="portal-action-wrapper">
                        <button type="button" class="portal-action-btn action-toggle-btn">Actions ▾</button>
                        <div class="portal-dropdown-menu">
                          <button type="button" class="portal-dropdown-item view-module-btn" data-name="Student Records" data-target="students.html">👁️ Open Module</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td class="font-bold-title">Grades & Transcripts</td>
                    <td>4th Grade – 12th Grade</td>
                    <td><span class="status-badge active">Active</span></td>
                    <td>
                      <div class="portal-action-wrapper">
                        <button type="button" class="portal-action-btn action-toggle-btn">Actions ▾</button>
                        <div class="portal-dropdown-menu">
                          <button type="button" class="portal-dropdown-item view-module-btn" data-name="Grades" data-target="grades.html">👁️ Open Module</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td class="font-bold-title">Attendance Tracking</td>
                    <td>4th Grade – 12th Grade</td>
                    <td><span class="status-badge active">Active</span></td>
                    <td>
                      <div class="portal-action-wrapper">
                        <button type="button" class="portal-action-btn action-toggle-btn">Actions ▾</button>
                        <div class="portal-dropdown-menu">
                          <button type="button" class="portal-dropdown-item view-module-btn" data-name="Attendance" data-target="attendance.html">👁️ Open Module</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td class="font-bold-title">Class & Timetable Management</td>
                    <td>4th Grade – 12th Grade</td>
                    <td><span class="status-badge active">Active</span></td>
                    <td>
                      <div class="portal-action-wrapper">
                        <button type="button" class="portal-action-btn action-toggle-btn">Actions ▾</button>
                        <div class="portal-dropdown-menu">
                          <button type="button" class="portal-dropdown-item view-module-btn" data-name="Schedule" data-target="schedule.html">👁️ Open Module</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td class="font-bold-title">Announcements & Documents</td>
                    <td>School-wide</td>
                    <td><span class="status-badge active">Active</span></td>
                    <td>
                      <div class="portal-action-wrapper">
                        <button type="button" class="portal-action-btn action-toggle-btn">Actions ▾</button>
                        <div class="portal-dropdown-menu">
                          <button type="button" class="portal-dropdown-item view-module-btn" data-name="Documents" data-target="documents.html">👁️ Open Module</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <p style="margin-top: 14px; font-size: 0.88rem; color: #64748B;">
              This is an academic information system. School-fee collection, payments, financial transactions, invoicing, and receipts are excluded.
            </p>
          </section>
        </div>

        <style>
          .portal-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
          }

          .portal-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #D9E5F0;
            box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
            padding: 24px;
          }

          .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
          }

          .page-heading h1 {
            color: #063B7A;
            font-size: 1.5rem;
            margin: 0;
          }

          .page-heading p {
            color: #64748B;
            margin: 4px 0 0 0;
            font-size: 0.9rem;
          }

          .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
          }

          @media (max-width: 600px) {
            .form-row {
              grid-template-columns: 1fr;
            }
          }

          .settings-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0;
          }

          .portal-btn-link {
            display: inline-block;
            color: #063B7A;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            padding: 8px 14px;
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            transition: all 0.2s ease;
          }

          .portal-btn-link:hover {
            background: #E0F5FF;
            border-color: #063B7A;
          }

          .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
          }

          .portal-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
          }

          .portal-table th {
            background: #F8FAFC;
            color: #063B7A;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid #E2E8F0;
            white-space: nowrap;
          }

          .portal-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #E2E8F0;
            color: #334155;
            vertical-align: middle;
          }

          .font-bold-title {
            font-weight: 600;
            color: #0F172A;
          }

          .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
          }

          .status-badge.active {
            background: #DCFCE7;
            color: #15803D;
          }

          /* Dropdown Menu System */
          .portal-action-wrapper {
            position: relative;
            display: flex;
            justify-content: flex-end;
          }

          .portal-action-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
          }

          .portal-action-btn:hover {
            background: #E2E8F0;
          }

          .portal-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            min-width: 160px;
            z-index: 50;
            overflow: hidden;
          }

          .portal-dropdown-menu.show {
            display: block;
          }

          .portal-dropdown-item {
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            background: transparent;
            border: none;
            color: #334155;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease;
          }

          .portal-dropdown-item:hover {
            background: #F8FAFC;
            color: #063B7A;
          }
        </style>
      `;

      pageContent.querySelectorAll(".action-toggle-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleActionDropdown(btn);
        });
      });

      pageContent.querySelectorAll(".view-rule-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          alert(`--- Policy Details: ${btn.dataset.title} ---\n${btn.dataset.desc}`);
        });
      });

      pageContent.querySelectorAll(".view-module-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          window.location.href = btn.dataset.target;
        });
      });
    }

    initSettingsPage().catch(error => {
      console.error("System Settings error:", error);
      showSettingsError(
        error?.message || "Please check the shared portal files and authentication."
      );
    });
  </script>
</body>
</html>
