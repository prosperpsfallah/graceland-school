<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Subject Management">
  <title>Subjects | GRACAIS E-Portal</title>

  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
  <div id="app">
    <main class="page-content">
      <p>Loading subject records...</p>
    </main>
  </div>

  <script type="module">
    import {
      requireUser,
      setupLogout
    } from "../assets/app.js";

    import {
      initLayout
    } from "../assets/layout.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    async function initSubjectsPage() {
      initLayout(
        "super_admin",
        "subjects.html",
        "Subject Management"
      );

      setupLogout();

      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Subject Management</h1>
            <p>
              View and manage the academic subjects taught
              at Graceland Academy International School
              of Excellence (GRACAIS).
            </p>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <div>
              <h2>Academic Subjects</h2>
              <p>
                Subject information will come from the
                connected GRACAIS database.
              </p>
            </div>
          </div>

          <div class="form-group">
            <label for="subjectSearch">Search subjects</label>
            <input
              type="search"
              id="subjectSearch"
              placeholder="Search by subject name..."
              autocomplete="off"
              disabled
            >
            <small>
              Search will be enabled after database integration.
            </small>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Subject ID</th>
                  <th>Subject Name</th>
                  <th>Class</th>
                  <th>Academic Year</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="5">
                    <div class="empty-state">
                      <h3>No subject records loaded</h3>
                      <p>
                        Real subject records will appear after
                        database integration. No sample subjects
                        are being inserted.
                      </p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    initSubjectsPage().catch(error => {
      console.error("Subject management error:", error);

      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card">
              <h2>Unable to load Subject Management</h2>
              <p>
                Check the shared portal files and
                authentication configuration.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
