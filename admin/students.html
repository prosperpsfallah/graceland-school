<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Student Records">
  <title>Students | GRACAIS E-Portal</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="app">
    <main class="page-content">
      <p>Loading student records...</p>
    </main>
  </div>
  <script type="module">
    import {
      requireUser,
      setupLogout,
      esc
    } from "../assets/app.js";
    import {
      initLayout,
      emptyState
    } from "../assets/layout.js";
    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    async function initStudentsPage() {
      initLayout(
        "super_admin",
        "students.html",
        "Student Records"
      );
      setupLogout();
      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;
      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;
      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Student Records</h1>
            <p>
              View and manage student academic records
              for Graceland Academy International School
              of Excellence.
            </p>
          </div>
        </section>
        <section class="card">
          <div class="card-header">
            <div>
              <h2>Students</h2>
              <p>
                Student records will appear here when
                the real database is connected.
              </p>
            </div>
          </div>
          <div class="form-group">
            <label for="studentSearch">
              Search student records
            </label>
            <input
              type="search"
              id="studentSearch"
              placeholder="Search by student ID or name..."
              autocomplete="off"
              disabled
            >
            <small>
              Search will be enabled after database integration.
            </small>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>First Name</th>
                  <th>Last Name</th>
                  <th>Class</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="5">
                    <div class="empty-state">
                      <h3>No records loaded</h3>
                      <p>
                        Connect the GRACAIS database to display
                        actual student records. No sample students
                        or demo records are being inserted.
                      </p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
      console.info(
        "GRACAIS Student Records page initialized."
      );
    }
    initStudentsPage().catch(error => {
      console.error("Students page error:", error);
      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card">
              <h2>Unable to load Student Records</h2>
              <p>
                Please check the shared portal files
                and authentication configuration.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
