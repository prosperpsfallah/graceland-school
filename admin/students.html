<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Student Portal">
  <title>Student Dashboard | GRACAIS</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import { setupLogout, esc } from "./assets/app.js";
    import { initLayout, requireUser } from "./assets/layout.js";
    import { supabase } from "./assets/supabase.js";

    const ALLOWED_ROLES = ["student"];

    initLayout(
      "student",
      "student-dashboard.html",
      "Student Dashboard"
    );

    setupLogout();

    const auth = await requireUser(ALLOWED_ROLES);
    if (auth) {
      const content = document.getElementById("pageContent");

      if (content) {
        content.innerHTML = `
          <section class="card portal-card">
            <h2 style="margin:0 0 8px 0; color:#063B7A;">Welcome to Your Student Portal</h2>
            <p style="margin:0; color:#64748B; font-size:14px;">
              View your academic records, assignments, and school details below.
            </p>
          </section>

          <section class="card portal-card" style="margin-top:22px;">
            <h3 style="margin-top:0; color:#063B7A;">My Profile Information</h3>
            <div id="studentProfileInfo" style="color:#334155; font-size:14px; line-height:1.8;">
              Loading profile details...
            </div>
          </section>

          <style>
            .portal-card {
              background: #ffffff;
              border-radius: 12px;
              border: 1px solid #D9E5F0;
              box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
              padding: 24px;
            }
          </style>
        `;

        try {
          const { data: profile } = await supabase
            .from("user_profiles")
            .select("*")
            .eq("id", auth.user.id)
            .single();

          if (profile) {
            document.getElementById("studentProfileInfo").innerHTML = `
              <p><strong>Name:</strong> ${esc(profile.first_name || "")} ${esc(profile.last_name || "")}</p>
              <p><strong>School ID:</strong> ${esc(profile.school_id || "N/A")}</p>
              <p><strong>Email:</strong> ${esc(profile.email || auth.user.email)}</p>
              <p><strong>Grade Level:</strong> Grade ${esc(profile.grade_level || "4")}</p>
              <p><strong>Status:</strong> <span style="color:#15803D; font-weight:600;">${esc(profile.status || "Active")}</span></p>
            `;
          }
        } catch (err) {
          console.error("Error loading profile:", err);
        }
      }
    }
  </script>
</body>
</html>
