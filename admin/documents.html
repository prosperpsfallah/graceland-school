<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Academic Documents">
  <title>Documents | GRACAIS E-Portal</title>
  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import { initLayout, requireUser } from "../assets/layout.js";
    import { setupLogout } from "../assets/app.js";
    import { supabase } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    const BUCKET = "academic-documents";

    initLayout("super_admin", "documents.html", "Academic Documents");
    setupLogout();

    const auth = await requireUser(ALLOWED_ROLES);
    if (auth) {
      const pageContent = document.getElementById("pageContent");
      if (pageContent) {
        pageContent.innerHTML = `
          <section class="page-heading">
            <div>
              <h1>Academic Documents</h1>
              <p>
                Manage authorized school documents for
                Graceland Academy International School of Excellence (GRACAIS) [Grades 4th - 12th].
              </p>
            </div>
            <button type="button" id="refreshDocuments" class="btn btn-secondary">
              ↻ Refresh Library
            </button>
          </section>

          <div class="portal-grid">
            <!-- Upload Form Card -->
            <section class="card portal-card">
              <div class="card-header">
                <div>
                  <h2>Upload a Document</h2>
                  <p>Upload approved academic documents to secure storage.</p>
                </div>
              </div>
              <form id="documentForm">
                <div class="form-group">
                  <label for="documentName">Document name</label>
                  <input
                    id="documentName"
                    type="text"
                    maxlength="150"
                    required
                    placeholder="Enter document title"
                  >
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label for="documentType">Document type</label>
                    <select id="documentType" required>
                      <option value="">Select type</option>
                      <option value="Academic Report">Academic Report</option>
                      <option value="Exam Paper">Exam Paper</option>
                      <option value="Class Material">Class Material</option>
                      <option value="School Notice">School Notice</option>
                      <option value="Policy">Policy</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="documentFile">Choose file</label>
                    <input
                      id="documentFile"
                      type="file"
                      accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg"
                      required
                    >
                    <small style="color: #64748B; font-size: 0.8rem; display: block; margin-top: 4px;">Maximum file size: 10 MB.</small>
                  </div>
                </div>
                <button type="submit" id="uploadButton" class="btn btn-primary" style="margin-top: 8px;">
                  + Upload Document
                </button>
                <p id="uploadMessage" role="status" class="form-message"></p>
              </form>
            </section>

            <!-- Document Library Table Card -->
            <section class="card portal-card">
              <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
                <div>
                  <h2>Document Library</h2>
                  <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Documents saved in the school database.</p>
                </div>
                <p id="listMessage" role="status" style="font-weight: 600; color: #063B7A; margin: 0;">Loading documents...</p>
              </div>

              <div class="table-toolbar" style="margin-bottom: 16px;">
                <div class="search-input-wrapper">
                  <input
                    type="search"
                    id="documentSearch"
                    placeholder="🔍 Search by document name or type..."
                    autocomplete="off"
                    style="width:100%; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px;"
                  >
                </div>
              </div>

              <div class="table-container">
                <table class="portal-table">
                  <thead>
                    <tr>
                      <th>Document Name</th>
                      <th>Document Type</th>
                      <th>Date Added</th>
                      <th style="text-align: right;">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="documentsBody">
                    <tr><td colspan="4" class="loading-cell">Loading documents...</td></tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>

          <style>
            .portal-grid {
              display: flex;
              flex-direction: column;
              gap: 20px;
            }

            .portal-card {
              background: #ffffff;
              border-radius: 12px;
              border: 1px solid #D9E5F0;
              box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
              padding: 24px;
            }

            .page-heading {
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 20px;
              flex-wrap: wrap;
              gap: 12px;
            }

            .page-heading h1 {
              color: #063B7A;
              font-size: 1.5rem;
              margin: 0;
            }

            .page-heading p {
              color: #64748B;
              margin: 4px 0 0 0;
              font-size: 0.9rem;
            }

            .form-row {
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 16px;
            }

            @media (max-width: 600px) {
              .form-row {
                grid-template-columns: 1fr;
              }
            }

            #documentForm {
              display: grid;
              gap: 16px;
              margin-top: 12px;
            }

            .form-message {
              margin-top: 8px;
              font-size: 0.88rem;
              font-weight: 500;
              color: #063B7A;
            }

            .table-container {
              width: 100%;
              overflow-x: auto;
              border: 1px solid #E2E8F0;
              border-radius: 8px;
            }

            .portal-table {
              width: 100%;
              border-collapse: collapse;
              text-align: left;
              font-size: 0.88rem;
            }

            .portal-table th {
              background: #F8FAFC;
              color: #063B7A;
              font-weight: 600;
              padding: 12px 16px;
              border-bottom: 2px solid #E2E8F0;
              white-space: nowrap;
            }

            .portal-table td {
              padding: 14px 16px;
              border-bottom: 1px solid #E2E8F0;
              color: #334155;
              vertical-align: middle;
            }

            .font-bold-title {
              font-weight: 600;
              color: #0F172A;
            }

            .type-badge {
              display: inline-block;
              padding: 4px 10px;
              border-radius: 12px;
              background: #E0F5FF;
              color: #063B7A;
              font-size: 0.8rem;
              font-weight: 600;
            }

            /* Dropdown Menu System */
            .portal-action-wrapper {
              position: relative;
              display: flex;
              justify-content: flex-end;
            }

            .portal-action-btn {
              background: #F1F5F9;
              border: 1px solid #CBD5E1;
              color: #0F172A;
              padding: 6px 12px;
              border-radius: 6px;
              font-size: 0.85rem;
              font-weight: 600;
              cursor: pointer;
              transition: all 0.2s ease;
            }

            .portal-action-btn:hover {
              background: #E2E8F0;
            }

            .portal-dropdown-menu {
              display: none;
              position: absolute;
              right: 0;
              top: 100%;
              margin-top: 4px;
              background: #ffffff;
              border: 1px solid #E2E8F0;
              box-shadow: 0 10px 25px rgba(0,0,0,0.1);
              border-radius: 8px;
              min-width: 170px;
              z-index: 50;
              overflow: hidden;
            }

            .portal-dropdown-menu.show {
              display: block;
            }

            .portal-dropdown-item {
              width: 100%;
              text-align: left;
              padding: 10px 14px;
              background: transparent;
              border: none;
              color: #334155;
              font-size: 0.85rem;
              font-weight: 500;
              cursor: pointer;
              display: flex;
              align-items: center;
              gap: 8px;
              transition: background 0.15s ease;
            }

            .portal-dropdown-item:hover {
              background: #F8FAFC;
              color: #063B7A;
            }

            .loading-cell {
              text-align: center;
              padding: 24px;
              color: #64748B;
            }

            .empty-state-cell {
              text-align: center;
              padding: 32px 16px;
              color: #64748B;
            }
          </style>
        `;

        const form = document.getElementById("documentForm");
        const uploadMessage = document.getElementById("uploadMessage");
        const listMessage = document.getElementById("listMessage");
        const uploadButton = document.getElementById("uploadButton");
        const documentsBody = document.getElementById("documentsBody");
        const searchInput = document.getElementById("documentSearch");
        let documents = [];

        function escapeHTML(value) {
          return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[char]);
        }

        function formatDate(value) {
          if (!value) return "—";
          const date = new Date(value);
          return Number.isNaN(date.getTime())
            ? "—"
            : date.toLocaleDateString();
        }

        function getDocName(doc) {
          return doc.name || doc.title || doc.document_name || doc.file_name || "Untitled Document";
        }

        function getDocType(doc) {
          return doc.document_type || doc.type || doc.category || "—";
        }

        function getDocPath(doc) {
          return doc.storage_path || doc.file_path || doc.path || doc.url || "";
        }

        function getDocDate(doc) {
          return doc.created_at || doc.date_added || doc.updated_at || null;
        }

        function toggleActionDropdown(button) {
          const currentDropdown = button.nextElementSibling;
          const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
          
          allDropdowns.forEach(menu => {
            if (menu !== currentDropdown) {
              menu.classList.remove("show");
            }
          });

          if (currentDropdown) {
            currentDropdown.classList.toggle("show");
          }
        }

        document.addEventListener("click", (e) => {
          if (!e.target.closest(".portal-action-wrapper")) {
            document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
              menu.classList.remove("show");
            });
          }
        });

        function renderDocuments() {
          const term = searchInput.value.trim().toLowerCase();
          const filtered = documents.filter(doc =>
            [getDocName(doc), getDocType(doc)]
              .some(value => String(value ?? "").toLowerCase().includes(term))
          );

          if (!filtered.length) {
            documentsBody.innerHTML = `
              <tr><td colspan="4" class="empty-state-cell">No matching documents found.</td></tr>
            `;
            return;
          }

          documentsBody.innerHTML = filtered.map(doc => `
            <tr>
              <td class="font-bold-title">${escapeHTML(getDocName(doc))}</td>
              <td><span class="type-badge">${escapeHTML(getDocType(doc))}</span></td>
              <td>${escapeHTML(formatDate(getDocDate(doc)))}</td>
              <td>
                <div class="portal-action-wrapper">
                  <button type="button" class="portal-action-btn action-toggle-btn">
                    Actions ▾
                  </button>
                  <div class="portal-dropdown-menu">
                    <button
                      type="button"
                      class="portal-dropdown-item open-doc-btn"
                      data-document-id="${escapeHTML(doc.id)}"
                    >
                      👁️ Open / Download
                    </button>
                    <button
                      type="button"
                      class="portal-dropdown-item copy-doc-path"
                      data-path="${escapeHTML(getDocPath(doc))}"
                    >
                      📋 Copy File Path
                    </button>
                  </div>
                </div>
              </td>
            </tr>
          `).join("");

          documentsBody.querySelectorAll(".action-toggle-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              toggleActionDropdown(btn);
            });
          });

          documentsBody.querySelectorAll(".open-doc-btn").forEach(button => {
            button.addEventListener("click", () => {
              const doc = documents.find(
                item => String(item.id) === button.dataset.documentId
              );
              if (doc) openDocument(doc);
            });
          });

          documentsBody.querySelectorAll(".copy-doc-path").forEach(button => {
            button.addEventListener("click", () => {
              const path = button.dataset.path;
              if (path) {
                navigator.clipboard.writeText(path);
                alert(`Copied file path: ${path}`);
              } else {
                alert("No path found for this document.");
              }
            });
          });
        }

        async function fetchDocumentsData() {
          let primaryRes = await supabase
            .from("documents")
            .select("*");

          if (!primaryRes.error) {
            return primaryRes;
          }

          console.warn("Primary documents table query failed, trying fallback tables...", primaryRes.error);

          let fallbackRes = await supabase
            .from("academic_documents")
            .select("*");

          if (!fallbackRes.error) {
            return fallbackRes;
          }

          let schoolDocsRes = await supabase
            .from("school_documents")
            .select("*");

          if (!schoolDocsRes.error) {
            return schoolDocsRes;
          }

          return primaryRes;
        }

        async function loadDocuments() {
          listMessage.textContent = "Loading documents...";
          documentsBody.innerHTML =
            '<tr><td colspan="4" class="loading-cell">Loading...</td></tr>';

          const { data, error } = await fetchDocumentsData();

          if (error) {
            console.error("Document loading error:", error);
            documents = [];
            documentsBody.innerHTML = `
              <tr>
                <td colspan="4" class="empty-state-cell">
                  <div>
                    <p>Could not load documents. Check the documents table, column names, and Supabase access policies.</p>
                    <p style="color: #DC2626; font-size: 13px; margin-top: 6px;">Error detail: ${escapeHTML(error.message || "")}</p>
                  </div>
                </td>
              </tr>
            `;
            listMessage.textContent = "Document loading failed.";
            return;
          }

          documents = data || [];
          listMessage.textContent = `${documents.length} document(s) loaded.`;
          renderDocuments();
        }

        async function openDocument(doc) {
          const path = getDocPath(doc);

          if (!path) {
            uploadMessage.textContent = "This document has no storage path recorded.";
            return;
          }

          if (path.startsWith("http://") || path.startsWith("https://")) {
            window.open(path, "_blank", "noopener,noreferrer");
            return;
          }

          const { data, error } = await supabase.storage
            .from(BUCKET)
            .createSignedUrl(path, 60);

          if (!error && data?.signedUrl) {
            window.open(data.signedUrl, "_blank", "noopener,noreferrer");
            return;
          }

          console.warn("Signed URL failed, attempting public URL...", error);

          const { data: publicData } = supabase.storage
            .from(BUCKET)
            .getPublicUrl(path);

          if (publicData?.publicUrl) {
            window.open(publicData.publicUrl, "_blank", "noopener,noreferrer");
            return;
          }

          uploadMessage.textContent = "Unable to open this document. Check storage permissions and path.";
        }

        form.addEventListener("submit", async event => {
          event.preventDefault();
          const name = document.getElementById("documentName").value.trim();
          const documentType = document.getElementById("documentType").value;
          const file = document.getElementById("documentFile").files[0];

          if (!name || !documentType || !file) {
            uploadMessage.textContent = "Complete all fields and choose a file.";
            return;
          }

          if (file.size > 10 * 1024 * 1024) {
            uploadMessage.textContent = "The file exceeds the 10 MB limit.";
            return;
          }

          const allowedExtensions = [
            "pdf", "doc", "docx", "xls", "xlsx",
            "ppt", "pptx", "png", "jpg", "jpeg"
          ];
          const extension = file.name.split(".").pop().toLowerCase();

          if (!allowedExtensions.includes(extension)) {
            uploadMessage.textContent = "This file type is not allowed.";
            return;
          }

          uploadButton.disabled = true;
          uploadMessage.textContent = "Uploading document...";

          const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const storagePath = `${crypto.randomUUID()}-${safeFileName}`;

          const { error: storageError } = await supabase.storage
            .from(BUCKET)
            .upload(storagePath, file, {
              upsert: false,
              contentType: file.type || "application/octet-stream"
            });

          if (storageError) {
            console.error("Storage upload error:", storageError);
            uploadButton.disabled = false;
            uploadMessage.textContent =
              "Upload failed. Check that the academic-documents bucket exists and upload permission is configured.";
            return;
          }

          const { error: databaseError } = await supabase
            .from("documents")
            .insert({
              name,
              document_type: documentType,
              storage_path: storagePath
            });

          if (databaseError) {
            console.error("Document record error:", databaseError);
            const { error: cleanupError } = await supabase.storage
              .from(BUCKET)
              .remove([storagePath]);

            if (cleanupError) {
              console.error("Storage cleanup error:", cleanupError);
            }

            uploadButton.disabled = false;
            uploadMessage.textContent =
              `Database save error: ${databaseError.message || "Check the documents table columns and insert policy."}`;
            return;
          }

          form.reset();
          uploadButton.disabled = false;
          uploadMessage.textContent = "Document uploaded successfully.";
          await loadDocuments();
        });

        searchInput.addEventListener("input", renderDocuments);
        document.getElementById("refreshDocuments")
          .addEventListener("click", loadDocuments);

        await loadDocuments();
      }
    }
  </script>
</body>
</html>
