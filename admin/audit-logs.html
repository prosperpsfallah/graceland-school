<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS E-Portal Audit Logs">
  <title>Audit Logs | GRACAIS E-Portal</title>
  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import {
      initLayout,
      requireUser
    } from "../assets/layout.js";
    import {
      setupLogout
    } from "../assets/app.js";
    import {
      supabase
    } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration"
    ];

    initLayout(
      "super_admin",
      "audit-logs.html",
      "Audit Logs"
    );

    setupLogout();

    const user = await requireUser(ALLOWED_ROLES);

    if (user) {
      const pageContent = document.getElementById("pageContent");
      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h2>System Activity History</h2>
            <p>
              Review important actions performed by authorized
              users in the GRACAIS E-Portal [Grades 4th - 12th].
            </p>
          </div>
          <button type="button" id="refreshLogs" class="btn btn-secondary">
            ↻ Refresh Logs
          </button>
        </section>

        <section class="card portal-card">
          <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
            <div>
              <h3>Audit Log Records</h3>
              <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Real-time security and administrative logs synchronized with Supabase.</p>
            </div>
            <p id="logMessage" role="status" style="font-weight: 600; color: #063B7A; margin: 0;">Loading audit records...</p>
          </div>

          <div class="table-toolbar" style="margin-bottom: 16px;">
            <div class="search-input-wrapper">
              <input
                type="search"
                id="logSearch"
                placeholder="🔍 Search activity, user, or record ID..."
                aria-label="Search audit logs"
                style="width:100%; max-width:480px; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px;"
              >
            </div>
          </div>

          <div class="table-container">
            <table class="portal-table">
              <thead>
                <tr>
                  <th>Date & Time</th>
                  <th>User ID</th>
                  <th>Action</th>
                  <th>Target Record</th>
                  <th>Details</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="auditLogsBody">
                <tr>
                  <td colspan="6" class="loading-cell">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <style>
          .portal-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #D9E5F0;
            box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
            padding: 24px;
          }

          .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
          }

          .page-heading h2 {
            color: #063B7A;
            font-size: 1.5rem;
            margin: 0;
          }

          .page-heading p {
            color: #64748B;
            margin: 4px 0 0 0;
            font-size: 0.9rem;
          }

          .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
          }

          .portal-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
          }

          .portal-table th {
            background: #F8FAFC;
            color: #063B7A;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid #E2E8F0;
            white-space: nowrap;
          }

          .portal-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #E2E8F0;
            color: #334155;
            vertical-align: middle;
          }

          .action-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            background: #E0F5FF;
            color: #063B7A;
            font-weight: 600;
            font-size: 0.8rem;
          }

          /* Dropdown Menu System */
          .portal-action-wrapper {
            position: relative;
            display: flex;
            justify-content: flex-end;
          }

          .portal-action-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
          }

          .portal-action-btn:hover {
            background: #E2E8F0;
          }

          .portal-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            min-width: 160px;
            z-index: 50;
            overflow: hidden;
          }

          .portal-dropdown-menu.show {
            display: block;
          }

          .portal-dropdown-item {
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            background: transparent;
            border: none;
            color: #334155;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease;
          }

          .portal-dropdown-item:hover {
            background: #F8FAFC;
            color: #063B7A;
          }

          .loading-cell {
            text-align: center;
            padding: 24px;
            color: #64748B;
          }

          .empty-state-cell {
            text-align: center;
            padding: 32px 16px;
            color: #64748B;
          }
        </style>
      `;

      const logsBody = document.getElementById("auditLogsBody");
      const logMessage = document.getElementById("logMessage");
      const logSearch = document.getElementById("logSearch");
      const refreshButton = document.getElementById("refreshLogs");
      let auditLogs = [];

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[character]);
      }

      function formatDate(value) {
        if (!value) return "—";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return String(value);
        }
        return date.toLocaleString();
      }

      function toggleActionDropdown(button) {
        const currentDropdown = button.nextElementSibling;
        const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
        
        allDropdowns.forEach(menu => {
          if (menu !== currentDropdown) {
            menu.classList.remove("show");
          }
        });

        if (currentDropdown) {
          currentDropdown.classList.toggle("show");
        }
      }

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".portal-action-wrapper")) {
          document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
            menu.classList.remove("show");
          });
        }
      });

      function displayLogs() {
        const searchTerm = logSearch.value.trim().toLowerCase();
        const filteredLogs = auditLogs.filter(log => {
          const searchableText = [
            log.action,
            log.user_id,
            log.record_type,
            log.record_id,
            log.details,
            log.created_at
          ].map(value => String(value ?? "")).join(" ").toLowerCase();
          return searchableText.includes(searchTerm);
        });

        if (filteredLogs.length === 0) {
          logsBody.innerHTML = `
            <tr>
              <td colspan="6" class="empty-state-cell">No matching audit records found.</td>
            </tr>
          `;
          return;
        }

        logsBody.innerHTML = filteredLogs.map((log, index) => `
          <tr>
            <td style="white-space:nowrap; font-weight:500;">${escapeHTML(formatDate(log.created_at))}</td>
            <td style="font-family:monospace;">${escapeHTML(log.user_id || "—")}</td>
            <td><span class="action-badge">${escapeHTML(log.action || "—")}</span></td>
            <td>
              <strong>${escapeHTML(log.record_type || "—")}</strong>
              ${log.record_id ? `<br><small style="color:#64748B;">ID: ${escapeHTML(log.record_id)}</small>` : ""}
            </td>
            <td style="max-width:250px; overflow-wrap:anywhere;">${escapeHTML(log.details || "—")}</td>
            <td>
              <div class="portal-action-wrapper">
                <button type="button" class="portal-action-btn action-toggle-btn">
                  Actions ▾
                </button>
                <div class="portal-dropdown-menu">
                  <button type="button" class="portal-dropdown-item view-log-item" data-index="${index}">
                    👁️ Inspect Activity
                  </button>
                  <button type="button" class="portal-dropdown-item copy-log-id" data-id="${escapeHTML(log.id || log.record_id || '')}">
                    📋 Copy ID
                  </button>
                </div>
              </div>
            </td>
          </tr>
        `).join("");

        logsBody.querySelectorAll(".action-toggle-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleActionDropdown(btn);
          });
        });

        logsBody.querySelectorAll(".view-log-item").forEach(button => {
          button.addEventListener("click", () => {
            const log = filteredLogs[button.dataset.index];
            alert(`--- Audit Log Details ---\nDate: ${formatDate(log.created_at)}\nUser ID: ${log.user_id || 'N/A'}\nAction: ${log.action || 'N/A'}\nTarget: ${log.record_type || 'N/A'} (ID: ${log.record_id || 'N/A'})\nDetails: ${log.details || 'None'}`);
          });
        });

        logsBody.querySelectorAll(".copy-log-id").forEach(button => {
          button.addEventListener("click", () => {
            const id = button.dataset.id;
            if (id) {
              navigator.clipboard.writeText(id);
              alert(`Copied ID to clipboard: ${id}`);
            } else {
              alert("No ID associated with this log entry.");
            }
          });
        });
      }

      async function loadAuditLogs() {
        logMessage.textContent = "Loading audit records...";
        logsBody.innerHTML = `
          <tr><td colspan="6" class="loading-cell">Loading...</td></tr>
        `;

        const { data, error } = await supabase
          .from("audit_logs")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(500);

        if (error) {
          console.error("Unable to load audit logs:", error);
          auditLogs = [];
          logsBody.innerHTML = `
            <tr>
              <td colspan="6" class="empty-state-cell">
                Could not load audit records. Check the audit_logs
                table columns and Supabase access policies.
              </td>
            </tr>
          `;
          logMessage.textContent =
            "Audit records could not be loaded.";
          return;
        }

        auditLogs = data || [];
        logMessage.textContent =
          `${auditLogs.length} audit record(s) loaded.`;
        displayLogs();
      }

      logSearch.addEventListener("input", displayLogs);
      refreshButton.addEventListener("click", loadAuditLogs);
      await loadAuditLogs();
    }
  </script>
</body>
</html>
