<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Teacher Records">
  <title>Teachers | GRACAIS E-Portal</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="app">
    <main class="page-content">
      <p>Loading teacher records...</p>
    </main>
  </div>
  <script type="module">
    import {
      requireUser,
      setupLogout,
      esc
    } from "../assets/app.js";
    import {
      initLayout
    } from "../assets/layout.js";
    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    async function initTeachersPage() {
      initLayout(
        "super_admin",
        "teachers.html",
        "Teacher Records"
      );
      setupLogout();
      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;
      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;
      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Teacher Records</h1>
            <p>
              View and manage teacher information for
              Graceland Academy International School
              of Excellence (GRACAIS).
            </p>
          </div>
        </section>
        <section class="card">
          <div class="card-header">
            <div>
              <h2>Teachers</h2>
              <p>
                Actual teacher records will load from the
                GRACAIS database after integration.
              </p>
            </div>
          </div>
          <div class="form-group">
            <label for="teacherSearch">
              Search teacher records
            </label>
            <input
              type="search"
              id="teacherSearch"
              placeholder="Search by teacher ID or name..."
              autocomplete="off"
              disabled
            >
            <small>
              Search will be enabled after database integration.
            </small>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Teacher ID</th>
                  <th>First Name</th>
                  <th>Last Name</th>
                  <th>Email</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="5">
                    <div class="empty-state">
                      <h3>No records loaded</h3>
                      <p>
                        Connect the real database to display
                        registered teachers. No demo accounts
                        or sample teacher records are created
                        by this page.
                      </p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
      console.info(
        "GRACAIS Teacher Records page initialized."
      );
    }
    initTeachersPage().catch(error => {
      console.error("Teacher records page error:", error);
      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card">
              <h2>Unable to load Teacher Records</h2>
              <p>
                Check the shared portal files and
                authentication configuration.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
