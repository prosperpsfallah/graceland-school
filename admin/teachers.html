<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Teacher Records">
  <title>Teachers | GRACAIS E-Portal</title>
  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import { setupLogout, esc } from "../assets/app.js";
    import { initLayout, requireUser } from "../assets/layout.js";
    import { supabase } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    let allTeachers = [];

    function safe(value) {
      return esc(String(value ?? ""));
    }

    function toggleActionDropdown(button) {
      const currentDropdown = button.nextElementSibling;
      const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
      
      allDropdowns.forEach(menu => {
        if (menu !== currentDropdown) {
          menu.classList.remove("show");
        }
      });

      if (currentDropdown) {
        currentDropdown.classList.toggle("show");
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".portal-action-wrapper")) {
        document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
          menu.classList.remove("show");
        });
      }
    });

    function renderTeachers(teachers) {
      const tbody = document.getElementById("teachersTableBody");
      const count = document.getElementById("teacherCount");
      if (!tbody || !count) return;

      count.textContent = String(teachers.length);

      if (!teachers.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state-cell">
              <div class="empty-state">
                <h3>No teacher records found</h3>
                <p>
                  No matching teacher records were found in the database.
                  Registered teachers will appear here when available.
                </p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = teachers.map((teacher, index) => {
        const idVal = teacher.teacher_id || teacher.id || "—";
        const firstNameVal = teacher.first_name || "—";
        const lastNameVal = teacher.last_name || "—";
        const emailVal = teacher.email || "—";
        const statusVal = teacher.status || "—";
        const isActive = statusVal.toLowerCase() === "active";

        return `
          <tr>
            <td style="font-family: monospace;" class="font-bold-title">${safe(idVal)}</td>
            <td class="font-bold-title">${safe(firstNameVal)}</td>
            <td>${safe(lastNameVal)}</td>
            <td>${safe(emailVal)}</td>
            <td>
              <span class="status-badge ${isActive ? "active" : "inactive"}">
                ${safe(statusVal)}
              </span>
            </td>
            <td>
              <div class="portal-action-wrapper">
                <button type="button" class="portal-action-btn action-toggle-btn">
                  Actions ▾
                </button>
                <div class="portal-dropdown-menu">
                  <button type="button" class="portal-dropdown-item view-teacher" data-index="${index}">
                    👁️ View Details
                  </button>
                  <button type="button" class="portal-dropdown-item copy-teacher-id" data-id="${safe(idVal)}">
                    📋 Copy Teacher ID
                  </button>
                </div>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".action-toggle-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleActionDropdown(btn);
        });
      });

      tbody.querySelectorAll(".view-teacher").forEach(button => {
        button.addEventListener("click", () => {
          const teacher = teachers[button.dataset.index];
          alert(`--- Teacher Profile ---\nID: ${teacher.teacher_id || teacher.id || 'N/A'}\nName: ${teacher.first_name || ''} ${teacher.last_name || ''}\nEmail: ${teacher.email || 'N/A'}\nStatus: ${teacher.status || 'N/A'}`);
        });
      });

      tbody.querySelectorAll(".copy-teacher-id").forEach(button => {
        button.addEventListener("click", () => {
          const id = button.dataset.id;
          if (id && id !== "—") {
            navigator.clipboard.writeText(id);
            alert(`Copied Teacher ID: ${id}`);
          } else {
            alert("No Teacher ID available to copy.");
          }
        });
      });
    }

    function filterTeachers() {
      const input = document.getElementById("teacherSearch");
      const term = (input?.value || "").trim().toLowerCase();
      const filtered = allTeachers.filter(teacher => {
        const searchable = [
          teacher.teacher_id,
          teacher.id,
          teacher.first_name,
          teacher.last_name,
          teacher.email,
          teacher.status
        ].filter(Boolean).join(" ").toLowerCase();
        return searchable.includes(term);
      });
      renderTeachers(filtered);
    }

    async function loadTeachers() {
      const tbody = document.getElementById("teachersTableBody");
      const message = document.getElementById("teacherMessage");
      const refreshButton = document.getElementById("refreshTeachers");
      if (refreshButton) refreshButton.disabled = true;

      if (tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="loading-cell">Loading teacher records...</td>
          </tr>
        `;
      }

      if (message) message.textContent = "";

      try {
        const { data, error } = await supabase
          .from("teachers")
          .select("*")
          .order("last_name", { ascending: true });

        if (error) throw error;

        allTeachers = data || [];
        filterTeachers();

        if (message) {
          message.textContent = "Teacher records loaded successfully.";
        }
      } catch (error) {
        console.error("Unable to load teachers:", error);
        allTeachers = [];
        if (tbody) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="empty-state-cell">
                <div class="empty-state">
                  <h3>Unable to load teacher records</h3>
                  <p>
                    Check the teachers table, its column names,
                    and your Supabase access policies.
                  </p>
                </div>
              </td>
            </tr>
          `;
        }
        if (message) {
          message.textContent =
            error.message || "A database error occurred.";
        }
      } finally {
        if (refreshButton) refreshButton.disabled = false;
      }
    }

    async function initTeachersPage() {
      initLayout("super_admin", "teachers.html", "Teacher Records");
      setupLogout();
      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Teacher Records</h1>
            <p>
              View registered teacher information for
              Graceland Academy International School of Excellence (GRACAIS) [Grades 4th - 12th].
            </p>
          </div>
          <button type="button" id="refreshTeachers" class="btn btn-secondary">
            ↻ Refresh Records
          </button>
        </section>

        <section class="card portal-card">
          <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
            <div>
              <h2>Faculty Roster</h2>
              <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Records are retrieved from the connected database.</p>
            </div>
            <p style="margin:0; font-weight:600; color:#063B7A;">Total teacher records: <strong id="teacherCount">0</strong></p>
          </div>

          <div class="table-toolbar" style="margin-bottom: 16px;">
            <div class="search-input-wrapper">
              <input
                type="search"
                id="teacherSearch"
                placeholder="🔍 Search by teacher ID, name, email, or status..."
                autocomplete="off"
                style="width:100%; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px;"
              >
            </div>
          </div>

          <p id="teacherMessage" role="status" aria-live="polite" style="margin-top:0; font-size:0.88rem; font-weight:500; color:#063B7A;"></p>

          <div class="table-container">
            <table class="portal-table">
              <thead>
                <tr>
                  <th>Teacher ID</th>
                  <th>First Name</th>
                  <th>Last Name</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="teachersTableBody">
                <tr>
                  <td colspan="6" class="loading-cell">Preparing teacher records...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <style>
          .portal-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #D9E5F0;
            box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
            padding: 24px;
          }

          .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
          }

          .page-heading h1 {
            color: #063B7A;
            font-size: 1.5rem;
            margin: 0;
          }

          .page-heading p {
            color: #64748B;
            margin: 4px 0 0 0;
            font-size: 0.9rem;
          }

          .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
          }

          .portal-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
          }

          .portal-table th {
            background: #F8FAFC;
            color: #063B7A;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid #E2E8F0;
            white-space: nowrap;
          }

          .portal-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #E2E8F0;
            color: #334155;
            vertical-align: middle;
          }

          .font-bold-title {
            font-weight: 600;
            color: #0F172A;
          }

          .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
          }
          .status-badge.active {
            background: #DCFCE7;
            color: #15803D;
          }
          .status-badge.inactive {
            background: #F1F5F9;
            color: #64748B;
          }

          /* Dropdown Menu System */
          .portal-action-wrapper {
            position: relative;
            display: flex;
            justify-content: flex-end;
          }

          .portal-action-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
          }

          .portal-action-btn:hover {
            background: #E2E8F0;
          }

          .portal-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            min-width: 160px;
            z-index: 50;
            overflow: hidden;
          }

          .portal-dropdown-menu.show {
            display: block;
          }

          .portal-dropdown-item {
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            background: transparent;
            border: none;
            color: #334155;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease;
          }

          .portal-dropdown-item:hover {
            background: #F8FAFC;
            color: #063B7A;
          }

          .loading-cell {
            text-align: center;
            padding: 24px;
            color: #64748B;
          }

          .empty-state-cell {
            text-align: center;
            padding: 32px 16px;
            color: #64748B;
          }

          #refreshTeachers:disabled {
            opacity: 0.65;
            cursor: wait;
          }
        </style>
      `;

      document
        .getElementById("teacherSearch")
        ?.addEventListener("input", filterTeachers);
      document
        .getElementById("refreshTeachers")
        ?.addEventListener("click", loadTeachers);

      await loadTeachers();
    }

    initTeachersPage().catch(error => {
      console.error("Teacher records page error:", error);
      const pageContent = document.getElementById("pageContent");
      if (pageContent) {
        pageContent.innerHTML = `
          <section class="card portal-card">
            <h2>Unable to open Teacher Records</h2>
            <p>
              Check the shared portal files, authentication configuration,
              and browser console for the error.
            </p>
          </section>
        `;
      }
    });
  </script>
</body>
</html>
