<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#063B7A"
  >

  <meta
    name="description"
    content="GRACAIS Administration Dashboard"
  >

  <title>
    Administration Dashboard | GRACAIS
  </title>

  <link
    rel="icon"
    type="image/png"
    href="../logo.png"
  >

  <link
    rel="apple-touch-icon"
    href="../logo.png"
  >

  <link
    rel="manifest"
    href="../manifest.json"
  >

  <link
    rel="stylesheet"
    href="../assets/style.css"
  >
</head>

<body>

  <div id="app"></div>

  <script type="module">

    // ============================================
    // GRACAIS ADMINISTRATION DASHBOARD
    // ============================================

    import {
      requireUser,
      setupLogout,
      esc
    } from "../assets/app.js";

    import {
      initLayout
    } from "../assets/layout.js";


    // ============================================
    // PERMITTED ADMINISTRATIVE ROLES
    // ============================================

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];


    // ============================================
    // INITIALIZE DASHBOARD
    // ============================================

    async function initDashboard() {

      initLayout(
        "super_admin",
        "dashboard.html",
        "Administration Dashboard"
      );

      setupLogout();

      const auth = await requireUser(
        ALLOWED_ROLES
      );

      if (!auth) {
        return;
      }

      const profile = auth.profile;

      const firstName =
        profile.first_name || "Administrator";

      const content =
        document.getElementById("pageContent");

      if (!content) {
        return;
      }

      content.innerHTML = `

        <section class="card">

          <p
            style="
              color: var(--primary-blue);
              font-weight: 700;
              font-size: 12px;
              letter-spacing: 1px;
            "
          >
            GRACAIS ADMINISTRATION
          </p>

          <h2
            style="
              margin-top: 10px;
              color: var(--deep-blue);
              font-size: 26px;
            "
          >
            Welcome, ${esc(firstName)}
          </h2>

          <p
            style="
              margin-top: 8px;
              color: var(--text-muted);
            "
          >
            Welcome to the administration portal
            of Graceland Academy International
            School of Excellence.
          </p>

          <div
            style="
              display: flex;
              flex-wrap: wrap;
              gap: 10px;
              margin-top: 22px;
            "
          >

            <span class="badge">
              Role: ${esc(profile.role)}
            </span>

            <span class="badge badge-success">
              Account: ${esc(profile.status || "Active")}
            </span>

          </div>

        </section>

        <section
          style="
            display: grid;
            grid-template-columns:
              repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 22px;
          "
        >

          <article class="card">

            <h3
              style="
                color: var(--deep-blue);
                font-size: 17px;
              "
            >
              Student Records
            </h3>

            <p
              style="
                margin-top: 8px;
                color: var(--text-muted);
                font-size: 14px;
              "
            >
              Access student academic records
              and enrollment information.
            </p>

            <a
              href="./students.html"
              style="
                display: inline-block;
                margin-top: 16px;
                color: var(--primary-blue);
                font-weight: 700;
                text-decoration: none;
              "
            >
              View Students →
            </a>

          </article>


          <article class="card">

            <h3
              style="
                color: var(--deep-blue);
                font-size: 17px;
              "
            >
              Teachers and Classes
            </h3>

            <p
              style="
                margin-top: 8px;
                color: var(--text-muted);
                font-size: 14px;
              "
            >
              Manage teacher information
              and school class records.
            </p>

            <a
              href="./teachers.html"
              style="
                display: inline-block;
                margin-top: 16px;
                color: var(--primary-blue);
                font-weight: 700;
                text-decoration: none;
              "
            >
              View Teachers →
            </a>

          </article>


          <article class="card">

            <h3
              style="
                color: var(--deep-blue);
                font-size: 17px;
              "
            >
              Academic Years
            </h3>

            <p
              style="
                margin-top: 8px;
                color: var(--text-muted);
                font-size: 14px;
              "
            >
              Access the academic year
              management section.
            </p>

            <a
              href="./academic-years.html"
              style="
                display: inline-block;
                margin-top: 16px;
                color: var(--primary-blue);
                font-weight: 700;
                text-decoration: none;
              "
            >
              View Academic Years →
            </a>

          </article>


          <article class="card">

            <h3
              style="
                color: var(--deep-blue);
                font-size: 17px;
              "
            >
              Grades and Attendance
            </h3>

            <p
              style="
                margin-top: 8px;
                color: var(--text-muted);
                font-size: 14px;
              "
            >
              Access academic performance
              and attendance management.
            </p>

            <a
              href="./grades.html"
              style="
                display: inline-block;
                margin-top: 16px;
                color: var(--primary-blue);
                font-weight: 700;
                text-decoration: none;
              "
            >
              View Grades →
            </a>

          </article>

        </section>

      `;

    }


    // ============================================
    // START
    // ============================================

    initDashboard();

  </script>

</body>

</html>
