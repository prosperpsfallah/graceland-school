<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Administration Dashboard">
  <title>Administration Dashboard | GRACAIS</title>
  <link rel="icon" type="image/png" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import { setupLogout, esc } from "../assets/app.js";
    import { initLayout, requireUser } from "../assets/layout.js";
    import { supabase } from "../assets/supabase.js";
    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    initLayout(
      "super_admin",
      "dashboard.html",
      "Administration Dashboard"
    );
    setupLogout();
    const auth = await requireUser(ALLOWED_ROLES);
    if (auth) {
      const profile = auth.profile || {};
      const content = document.getElementById("pageContent");
      if (content) {
        content.innerHTML = `
          <section class="card">
            <p style="color:var(--primary-blue);font-weight:700;font-size:12px;letter-spacing:1px;">
              GRACAIS ADMINISTRATION
            </p>
            <h2 style="margin-top:10px;color:var(--deep-blue);font-size:26px;">
              Welcome, ${esc(profile.first_name || "Administrator")}
            </h2>
            <p style="margin-top:8px;color:var(--text-muted);">
              Welcome to the administration portal of
              Graceland Academy International School of Excellence.
            </p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;">
              <span class="badge">Role: ${esc(profile.role || "Administrator")}</span>
              <span class="badge badge-success">Account: ${esc(profile.status || "Active")}</span>
            </div>
          </section>
          <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:22px;">
            <article class="card">
              <p style="color:var(--text-muted);">Students</p>
              <h2 id="studentCount" style="margin-top:8px;color:var(--deep-blue);">—</h2>
            </article>
            <article class="card">
              <p style="color:var(--text-muted);">Teachers</p>
              <h2 id="teacherCount" style="margin-top:8px;color:var(--deep-blue);">—</h2>
            </article>
            <article class="card">
              <p style="color:var(--text-muted);">Classes</p>
              <h2 id="classCount" style="margin-top:8px;color:var(--deep-blue);">—</h2>
            </article>
            <article class="card">
              <p style="color:var(--text-muted);">Academic Years</p>
              <h2 id="yearCount" style="margin-top:8px;color:var(--deep-blue);">—</h2>
            </article>
          </section>
          <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:22px;">
            <article class="card">
              <h3 style="color:var(--deep-blue);font-size:17px;">Student Records</h3>
              <p style="margin-top:8px;color:var(--text-muted);font-size:14px;">
                Access student academic records and enrollment information.
              </p>
              <a href="./students.html" style="display:inline-block;margin-top:16px;color:var(--primary-blue);font-weight:700;text-decoration:none;">View Students →</a>
            </article>
            <article class="card">
              <h3 style="color:var(--deep-blue);font-size:17px;">Teachers and Classes</h3>
              <p style="margin-top:8px;color:var(--text-muted);font-size:14px;">
                Manage teacher information and school class records.
              </p>
              <a href="./teachers.html" style="display:inline-block;margin-top:16px;color:var(--primary-blue);font-weight:700;text-decoration:none;">View Teachers →</a>
              <br>
              <a href="./classes.html" style="display:inline-block;margin-top:12px;color:var(--primary-blue);font-weight:700;text-decoration:none;">View Classes →</a>
            </article>
            <article class="card">
              <h3 style="color:var(--deep-blue);font-size:17px;">Academic Years</h3>
              <p style="margin-top:8px;color:var(--text-muted);font-size:14px;">
                Manage the academic years used for school records.
              </p>
              <a href="./academic-years.html" style="display:inline-block;margin-top:16px;color:var(--primary-blue);font-weight:700;text-decoration:none;">View Academic Years →</a>
            </article>
            <article class="card">
              <h3 style="color:var(--deep-blue);font-size:17px;">Grades and Attendance</h3>
              <p style="margin-top:8px;color:var(--text-muted);font-size:14px;">
                Review academic performance and attendance records.
              </p>
              <a href="./grades.html" style="display:inline-block;margin-top:16px;color:var(--primary-blue);font-weight:700;text-decoration:none;">View Grades →</a>
              <br>
              <a href="./attendance.html" style="display:inline-block;margin-top:12px;color:var(--primary-blue);font-weight:700;text-decoration:none;">View Attendance →</a>
            </article>
          </section>
          <section class="card" style="margin-top:22px;">
            <h3>Database Status</h3>
            <p id="dashboardMessage" role="status" style="margin-top:8px;color:var(--text-muted);">
              Loading school statistics...
            </p>
            <button type="button" id="refreshDashboard" class="btn btn-primary" style="margin-top:12px;">
              Refresh Statistics
            </button>
          </section>
        `;
        async function getCount(table) {
          const { count, error } = await supabase
            .from(table)
            .select("*", { count: "exact", head: true });
          if (error) {
            console.error(`Unable to count ${table}:`, error);
            return null;
          }
          return count ?? 0;
        }
        async function loadStatistics() {
          const message = document.getElementById("dashboardMessage");
          message.textContent = "Loading school statistics...";
          const [students, teachers, classes, years] = await Promise.all([
            getCount("students"),
            getCount("teachers"),
            getCount("classes"),
            getCount("academic_years")
          ]);
          document.getElementById("studentCount").textContent =
            students === null ? "—" : students;
          document.getElementById("teacherCount").textContent =
            teachers === null ? "—" : teachers;
          document.getElementById("classCount").textContent =
            classes === null ? "—" : classes;
          document.getElementById("yearCount").textContent =
            years === null ? "—" : years;
          const failed = [students, teachers, classes, years]
            .some(value => value === null);
          message.textContent = failed
            ? "Some statistics could not load. Check the table permissions and database configuration."
            : "School statistics loaded successfully.";
        }
        document.getElementById("refreshDashboard")
          .addEventListener("click", loadStatistics);
        await loadStatistics();
      }
    }
  </script>
</body>
</html>
