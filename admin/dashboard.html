<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Administration Dashboard">
  <title>Administration Dashboard | GRACAIS</title>
  <link rel="icon" type="image/png" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import { setupLogout, esc } from "../assets/app.js";
    import { initLayout, requireUser } from "../assets/layout.js";
    import { supabase } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    initLayout(
      "super_admin",
      "dashboard.html",
      "Administration Dashboard"
    );

    setupLogout();

    const auth = await requireUser(ALLOWED_ROLES);
    if (auth) {
      const profile = auth.profile || {};
      const content = document.getElementById("pageContent");

      if (content) {
        content.innerHTML = `
          <!-- Welcome Banner Card -->
          <section class="card portal-card">
            <p style="color:#063B7A; font-weight:700; font-size:12px; letter-spacing:1px; text-transform:uppercase; margin:0 0 6px 0;">
              GRACAIS ADMINISTRATION [GRADES 4TH - 12TH]
            </p>
            <h2 style="margin:0; color:#063B7A; font-size:26px;">
              Welcome, ${esc(profile.first_name || "Administrator")}
            </h2>
            <p style="margin-top:8px; color:#64748B; font-size:14px; line-height:1.5;">
              Welcome to the administration portal of
              Graceland Academy International School of Excellence.
            </p>
            <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:18px;">
              <span class="status-badge" style="background:#E0F5FF; color:#063B7A;">Role: ${esc(profile.role || "Administrator")}</span>
              <span class="status-badge active">Account Status: ${esc(profile.status || "Active")}</span>
            </div>
          </section>

          <!-- Metrics Stats Summary Row -->
          <section style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-top:22px;">
            <article class="card portal-card stat-card">
              <p style="color:#64748B; font-size:0.85rem; font-weight:600; margin:0;">Students</p>
              <h2 id="studentCount" style="margin:8px 0 0 0; color:#063B7A; font-size:2rem; font-weight:700;">—</h2>
            </article>
            <article class="card portal-card stat-card">
              <p style="color:#64748B; font-size:0.85rem; font-weight:600; margin:0;">Teachers</p>
              <h2 id="teacherCount" style="margin:8px 0 0 0; color:#063B7A; font-size:2rem; font-weight:700;">—</h2>
            </article>
            <article class="card portal-card stat-card">
              <p style="color:#64748B; font-size:0.85rem; font-weight:600; margin:0;">Classes</p>
              <h2 id="classCount" style="margin:8px 0 0 0; color:#063B7A; font-size:2rem; font-weight:700;">—</h2>
            </article>
            <article class="card portal-card stat-card">
              <p style="color:#64748B; font-size:0.85rem; font-weight:600; margin:0;">Academic Years</p>
              <h2 id="yearCount" style="margin:8px 0 0 0; color:#063B7A; font-size:2rem; font-weight:700;">—</h2>
            </article>
          </section>

          <!-- Admin Add User Section -->
          <section class="card portal-card" style="margin-top:22px;">
            <h3 style="color: #063B7A; margin-top:0; margin-bottom:16px; font-size:20px;">Add New Portal Member</h3>
            <form id="addUserForm">
              <div style="display: flex; gap: 12px; margin-bottom: 12px; flex-wrap:wrap;">
                <div style="flex: 1; min-width:200px;">
                  <label style="font-size:13px; font-weight:600; color:#334155;">First Name</label>
                  <input type="text" id="addFirstName" required placeholder="e.g. Mary" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #CBD5E1; border-radius: 6px; box-sizing:border-box;">
                </div>
                <div style="flex: 1; min-width:200px;">
                  <label style="font-size:13px; font-weight:600; color:#334155;">Last Name</label>
                  <input type="text" id="addLastName" required placeholder="e.g. Johnson" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #CBD5E1; border-radius: 6px; box-sizing:border-box;">
                </div>
              </div>

              <div style="margin-bottom: 12px;">
                <label style="font-size:13px; font-weight:600; color:#334155;">Email Address</label>
                <input type="email" id="addEmail" required placeholder="e.g. user@graceland.edu" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #CBD5E1; border-radius: 6px; box-sizing:border-box;">
              </div>

              <div style="margin-bottom: 12px;">
                <label style="font-size:13px; font-weight:600; color:#334155;">Temporary Password</label>
                <input type="password" id="addPassword" required placeholder="At least 6 characters" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #CBD5E1; border-radius: 6px; box-sizing:border-box;">
              </div>

              <div style="display: flex; gap: 12px; margin-bottom: 16px; flex-wrap:wrap;">
                <div style="flex: 1; min-width:200px;">
                  <label style="font-size:13px; font-weight:600; color:#334155;">Role</label>
                  <select id="addRole" required style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #CBD5E1; border-radius: 6px; background:#fff; box-sizing:border-box;">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher / Instructor</option>
                    <option value="admin">Administrator</option>
                  </select>
                </div>

                <div style="flex: 1; min-width:200px;" id="gradeLevelContainer">
                  <label style="font-size:13px; font-weight:600; color:#334155;">Grade Level</label>
                  <select id="addGradeLevel" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #CBD5E1; border-radius: 6px; background:#fff; box-sizing:border-box;">
                    <option value="4" selected>Grade 4</option>
                    <option value="5">Grade 5</option>
                    <option value="6">Grade 6</option>
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                  </select>
                </div>
              </div>

              <button type="submit" id="submitAddUserBtn" style="width: 100%; padding: 12px; background-color: #063B7A; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size:15px;">
                Create Account & Provision Profile
              </button>
            </form>
          </section>

          <!-- Module Navigation Grid -->
          <section style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:18px; margin-top:22px;">
            <article class="card portal-card">
              <h3 style="color:#063B7A; font-size:17px; margin:0;">Student Records</h3>
              <p style="margin-top:8px; color:#64748B; font-size:14px; line-height:1.5;">
                Access student academic records and enrollment information.
              </p>
              <div style="margin-top:16px;">
                <a href="./students.html" class="portal-btn-link">View Students →</a>
              </div>
            </article>

            <article class="card portal-card">
              <h3 style="color:#063B7A; font-size:17px; margin:0;">Teachers and Classes</h3>
              <p style="margin-top:8px; color:#64748B; font-size:14px; line-height:1.5;">
                Manage teacher information and school class records.
              </p>
              <div style="display:flex; flex-direction:column; gap:8px; margin-top:16px;">
                <a href="./teachers.html" class="portal-btn-link">View Teachers →</a>
                <a href="./classes.html" class="portal-btn-link">View Classes →</a>
              </div>
            </article>

            <article class="card portal-card">
              <h3 style="color:#063B7A; font-size:17px; margin:0;">Academic Years</h3>
              <p style="margin-top:8px; color:#64748B; font-size:14px; line-height:1.5;">
                Manage the academic years used for school records.
              </p>
              <div style="margin-top:16px;">
                <a href="./academic-years.html" class="portal-btn-link">View Academic Years →</a>
              </div>
            </article>

            <article class="card portal-card">
              <h3 style="color:#063B7A; font-size:17px; margin:0;">Grades and Attendance</h3>
              <p style="margin-top:8px; color:#64748B; font-size:14px; line-height:1.5;">
                Review academic performance and attendance records.
              </p>
              <div style="display:flex; flex-direction:column; gap:8px; margin-top:16px;">
                <a href="./grades.html" class="portal-btn-link">View Grades →</a>
                <a href="./attendance.html" class="portal-btn-link">View Attendance →</a>
              </div>
            </article>
          </section>

          <!-- Database Status Card -->
          <section class="card portal-card" style="margin-top:22px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
              <div>
                <h3 style="color:#063B7A; margin:0;">Database Connection Status</h3>
                <p id="dashboardMessage" role="status" style="margin-top:4px; color:#64748B; font-size:0.9rem;">
                  Loading school statistics...
                </p>
              </div>
              <button type="button" id="refreshDashboard" class="btn btn-secondary">
                ↻ Refresh Statistics
              </button>
            </div>
          </section>

          <style>
            .portal-card {
              background: #ffffff;
              border-radius: 12px;
              border: 1px solid #D9E5F0;
              box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
              padding: 24px;
            }

            .stat-card {
              border-left: 4px solid #063B7A;
            }

            .status-badge {
              display: inline-flex;
              align-items: center;
              padding: 5px 12px;
              border-radius: 12px;
              font-size: 0.8rem;
              font-weight: 600;
            }

            .status-badge.active {
              background: #DCFCE7;
              color: #15803D;
            }

            .portal-btn-link {
              display: inline-block;
              color: #063B7A;
              font-weight: 600;
              font-size: 0.88rem;
              text-decoration: none;
              padding: 6px 12px;
              background: #F1F5F9;
              border: 1px solid #CBD5E1;
              border-radius: 6px;
              transition: all 0.2s ease;
            }

            .portal-btn-link:hover {
              background: #E0F5FF;
              border-color: #063B7A;
            }
          </style>
        `;

        async function getCount(table) {
          const { count, error } = await supabase
            .from(table)
            .select("*", { count: "exact", head: true });
          if (error) {
            console.error(`Unable to count ${table}:`, error);
            return null;
          }
          return count ?? 0;
        }

        async function loadStatistics() {
          const message = document.getElementById("dashboardMessage");
          message.textContent = "Loading school statistics...";

          const [students, teachers, classes, years] = await Promise.all([
            getCount("students"),
            getCount("teachers"),
            getCount("classes"),
            getCount("academic_years")
          ]);

          document.getElementById("studentCount").textContent =
            students === null ? "—" : students;
          document.getElementById("teacherCount").textContent =
            teachers === null ? "—" : teachers;
          document.getElementById("classCount").textContent =
            classes === null ? "—" : classes;
          document.getElementById("yearCount").textContent =
            years === null ? "—" : years;

          const failed = [students, teachers, classes, years]
            .some(value => value === null);

          message.textContent = failed
            ? "Some statistics could not load. Check table permissions and database configuration."
            : "✓ All school statistics synchronized successfully from Supabase.";
        }

        document.getElementById("refreshDashboard")
          .addEventListener("click", loadStatistics);

        await loadStatistics();

        // Handle Add User Form Submission
        const addUserForm = document.getElementById("addUserForm");
        if (addUserForm) {
          addUserForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const btn = document.getElementById("submitAddUserBtn");
            btn.disabled = true;
            btn.innerText = "Creating Account & Provisioning...";

            const firstName = document.getElementById("addFirstName").value.trim();
            const lastName = document.getElementById("addLastName").value.trim();
            const email = document.getElementById("addEmail").value.trim();
            const password = document.getElementById("addPassword").value;
            const role = document.getElementById("addRole").value;
            const gradeLevel = document.getElementById("addGradeLevel").value;

            try {
              const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                  data: {
                    first_name: firstName,
                    last_name: lastName,
                    role: role,
                    grade_level: parseInt(gradeLevel, 10)
                  }
                }
              });

              if (error) {
                alert("Error creating account: " + error.message);
              } else if (data.user) {
                alert(`Success! Account created for ${firstName} ${lastName} (${role.toUpperCase()}). Profile and school ID were automatically generated!`);
                addUserForm.reset();
                loadStatistics(); // Refresh counts
              }
            } catch (err) {
              console.error("User creation error:", err);
              alert("An unexpected error occurred.");
            } finally {
              btn.disabled = false;
              btn.innerText = "Create Account & Provision Profile";
            }
          });
        }
      }
    }
  </script>
</body>
</html>
