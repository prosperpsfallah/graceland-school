<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS School Announcements">
  <title>Announcements | GRACAIS E-Portal</title>

  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
  <div id="app">
    <main class="page-content">
      <p>Loading announcements...</p>
    </main>
  </div>

  <script type="module">
    import {
      requireUser,
      setupLogout
    } from "../assets/app.js";

    import {
      initLayout
    } from "../assets/layout.js";

    import {
      supabase
    } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    let announcements = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function showMessage(message, type = "info") {
      const element = document.getElementById("announcementMessage");
      if (!element) return;

      element.textContent = message;
      element.className = `announcement-message ${type}`;
      element.hidden = false;
    }

    function formatDate(value) {
      if (!value) return "Date not available";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHTML(value);
      }

      return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function getAnnouncementContent(item) {
      return item.content || item.message || item.body || item.description || "";
    }

    function getAnnouncementDate(item) {
      return item.created_at || item.date || item.published_at || item.created_date || null;
    }

    function toggleActionDropdown(button) {
      const currentDropdown = button.nextElementSibling;
      const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
      
      allDropdowns.forEach(menu => {
        if (menu !== currentDropdown) {
          menu.classList.remove("show");
        }
      });

      if (currentDropdown) {
        currentDropdown.classList.toggle("show");
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".portal-action-wrapper")) {
        document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
          menu.classList.remove("show");
        });
      }
    });

    function renderAnnouncements() {
      const tbody = document.getElementById("announcementsTableBody");
      const search = document.getElementById("announcementSearch");

      if (!tbody) return;

      const term = (search?.value || "").trim().toLowerCase();

      const filtered = announcements.filter(item => {
        const title = String(item.title || item.subject || "").toLowerCase();
        const content = String(getAnnouncementContent(item)).toLowerCase();

        return title.includes(term) || content.includes(term);
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4">
              <div class="empty-state">
                <h3>${announcements.length ? "No matching announcements" : "No announcements available"}</h3>
                <p>
                  ${announcements.length
                    ? "Try another search term."
                    : "School announcements will appear here when they are added to the database."}
                </p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map((item, index) => {
        const title = escapeHTML(item.title || item.subject || "Untitled announcement");
        const dateStr = escapeHTML(formatDate(getAnnouncementDate(item)));
        const contentText = escapeHTML(getAnnouncementContent(item));
        const snippet = contentText.length > 80 ? contentText.substring(0, 80) + "..." : contentText;

        return `
          <tr>
            <td class="font-bold-title">${title}</td>
            <td>${dateStr}</td>
            <td>
              <span class="announcement-snippet" title="${contentText}">${snippet}</span>
            </td>
            <td>
              <div class="portal-action-wrapper">
                <button type="button" class="portal-action-btn action-toggle-btn">
                  Actions ▾
                </button>
                <div class="portal-dropdown-menu">
                  <button type="button" class="portal-dropdown-item view-announcement" data-index="${index}">
                    👁️ View Full Notice
                  </button>
                </div>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".action-toggle-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleActionDropdown(btn);
        });
      });

      tbody.querySelectorAll(".view-announcement").forEach(button => {
        button.addEventListener("click", () => {
          const item = filtered[button.dataset.index];
          const fullTitle = item.title || item.subject || "Announcement Details";
          const fullContent = getAnnouncementContent(item);
          alert(`--- ${fullTitle} ---\n\n${fullContent}`);
        });
      });
    }

    async function fetchAnnouncementsData() {
      // 1. Try querying primary announcements table with select("*")
      let primaryRes = await supabase
        .from("announcements")
        .select("*");

      if (!primaryRes.error) {
        return primaryRes;
      }

      console.warn("Primary announcements query failed, trying alternative table names...", primaryRes.error);

      // 2. Try school_announcements table
      let altRes = await supabase
        .from("school_announcements")
        .select("*");

      if (!altRes.error) {
        return altRes;
      }

      // 3. Try notices table
      let noticesRes = await supabase
        .from("notices")
        .select("*");

      if (!noticesRes.error) {
        return noticesRes;
      }

      return primaryRes;
    }

    async function loadAnnouncements() {
      const tbody = document.getElementById("announcementsTableBody");
      const refreshButton = document.getElementById("refreshAnnouncements");

      if (tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="loading-cell">Loading real announcements...</td>
          </tr>
        `;
      }

      if (refreshButton) {
        refreshButton.disabled = true;
        refreshButton.textContent = "Loading...";
      }

      const { data, error } = await fetchAnnouncementsData();

      if (refreshButton) {
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Refresh";
      }

      if (error) {
        console.error("Load announcements error:", error);

        announcements = [];

        if (tbody) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <h3>Could not load announcements</h3>
                  <p>
                    Check the announcements table columns and your Supabase permissions.
                    No sample records have been added.
                  </p>
                  <p class="error-detail">${escapeHTML(error.message || "")}</p>
                </div>
              </td>
            </tr>
          `;
        }

        showMessage(
          `Database error: ${error.message || "Failed to load announcements from Supabase."}`,
          "error"
        );

        return;
      }

      announcements = data || [];

      // Sort by created date if present
      announcements.sort((a, b) => {
        const dateA = new Date(getAnnouncementDate(a) || 0).getTime();
        const dateB = new Date(getAnnouncementDate(b) || 0).getTime();
        return dateB - dateA;
      });

      renderAnnouncements();
    }

    async function initAnnouncementsPage() {
      initLayout(
        "super_admin",
        "announcements.html",
        "School Announcements"
      );

      setupLogout();

      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>School Announcements</h1>
            <p>
              Review school notices and academic updates for
              Graceland Academy International School of Excellence (GRACAIS) [Grades 4th - 12th].
            </p>
          </div>

          <button
            class="btn btn-secondary"
            id="refreshAnnouncements"
            type="button"
          >
            ↻ Refresh
          </button>
        </section>

        <div
          id="announcementMessage"
          class="announcement-message"
          role="status"
          hidden
        ></div>

        <section class="card portal-card">
          <div class="card-header">
            <div>
              <h2>Announcements Feed</h2>
              <p>Records are loaded from the connected Supabase database.</p>
            </div>
          </div>

          <div class="table-toolbar">
            <div class="search-input-wrapper">
              <input
                type="search"
                id="announcementSearch"
                placeholder="🔍 Search by title or announcement content..."
                autocomplete="off"
              >
            </div>
          </div>

          <div class="table-container">
            <table class="portal-table">
              <thead>
                <tr>
                  <th>Title / Subject</th>
                  <th>Published Date</th>
                  <th>Content Preview</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="announcementsTableBody">
                <tr><td colspan="4" class="loading-cell">Loading announcements...</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <style>
          .portal-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #D9E5F0;
            box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
            padding: 24px;
          }

          .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
          }

          .page-heading h1 {
            color: #063B7A;
            font-size: 1.5rem;
            margin: 0;
          }

          .page-heading p {
            color: #64748B;
            margin: 4px 0 0 0;
            font-size: 0.9rem;
          }

          .announcement-message {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            background: #E0F5FF;
            color: #063B7A;
            font-weight: 500;
          }

          .announcement-message.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
          }

          .announcement-message.success {
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #86EFAC;
          }

          .error-detail {
            color: #DC2626;
            font-size: 13px;
            margin-top: 6px;
          }

          .table-toolbar {
            margin-bottom: 16px;
          }

          .table-toolbar input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #D9E5F0;
            border-radius: 8px;
            font-size: 0.9rem;
          }

          .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
          }

          .portal-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
          }

          .portal-table th {
            background: #F8FAFC;
            color: #063B7A;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid #E2E8F0;
            white-space: nowrap;
          }

          .portal-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #E2E8F0;
            color: #334155;
            vertical-align: middle;
          }

          .font-bold-title {
            font-weight: 600;
            color: #0F172A;
          }

          .announcement-snippet {
            color: #64748B;
            display: inline-block;
            max-width: 350px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }

          /* Dropdown Menu System */
          .portal-action-wrapper {
            position: relative;
            display: flex;
            justify-content: flex-end;
          }

          .portal-action-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
          }

          .portal-action-btn:hover {
            background: #E2E8F0;
          }

          .portal-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            min-width: 160px;
            z-index: 50;
            overflow: hidden;
          }

          .portal-dropdown-menu.show {
            display: block;
          }

          .portal-dropdown-item {
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            background: transparent;
            border: none;
            color: #334155;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease;
          }

          .portal-dropdown-item:hover {
            background: #F8FAFC;
            color: #063B7A;
          }

          .loading-cell {
            text-align: center;
            padding: 24px;
            color: #64748B;
          }

          .empty-state {
            text-align: center;
            padding: 32px 16px;
          }

          .empty-state h3 {
            margin: 0;
            color: #063B7A;
          }

          .empty-state p {
            margin: 6px 0 0 0;
            color: #64748B;
          }

          #refreshAnnouncements:disabled {
            opacity: 0.65;
            cursor: wait;
          }
        </style>
      `;

      document.getElementById("announcementSearch")
        .addEventListener("input", renderAnnouncements);

      document.getElementById("refreshAnnouncements")
        .addEventListener("click", loadAnnouncements);

      await loadAnnouncements();
    }

    initAnnouncementsPage().catch(error => {
      console.error("Announcements page error:", error);

      const app = document.getElementById("app");

      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card portal-card">
              <h2>Unable to load Announcements</h2>
              <p>
                Check the shared portal files, authentication configuration,
                and Supabase connection.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
