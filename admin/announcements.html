<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS School Announcements">
  <title>Announcements | GRACAIS E-Portal</title>

  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
  <div id="app">
    <main class="page-content">
      <p>Loading announcements...</p>
    </main>
  </div>

  <script type="module">
    import {
      requireUser,
      setupLogout
    } from "../assets/app.js";

    import {
      initLayout
    } from "../assets/layout.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    async function initAnnouncementsPage() {
      initLayout(
        "super_admin",
        "announcements.html",
        "School Announcements"
      );

      setupLogout();

      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>School Announcements</h1>
            <p>
              Review school notices and academic updates
              for Graceland Academy International School
              of Excellence (GRACAIS).
            </p>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <div>
              <h2>Announcements</h2>
              <p>
                Published announcements will be loaded from
                the connected database.
              </p>
            </div>
          </div>

          <div class="form-group">
            <label for="announcementSearch">
              Search announcements
            </label>
            <input
              type="search"
              id="announcementSearch"
              placeholder="Search by announcement title..."
              autocomplete="off"
              disabled
            >
            <small>
              Search will be enabled after database integration.
            </small>
          </div>

          <div id="announcementList">
            <div class="empty-state">
              <h3>No announcements loaded</h3>
              <p>
                Actual school notices will appear here after
                database integration. No demo announcements
                are being created.
              </p>
            </div>
          </div>
        </section>
      `;
    }

    initAnnouncementsPage().catch(error => {
      console.error("Announcements page error:", error);

      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card">
              <h2>Unable to load Announcements</h2>
              <p>
                Check the shared portal files and
                authentication configuration.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
