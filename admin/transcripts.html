<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Student Transcripts">
  <title>Transcripts | GRACAIS E-Portal</title>

  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
  <div id="app">
    <main class="page-content">
      <p>Loading student transcripts...</p>
    </main>
  </div>

  <script type="module">
    import {
      requireUser,
      setupLogout
    } from "../assets/app.js";

    import {
      initLayout
    } from "../assets/layout.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    async function initTranscriptsPage() {
      initLayout(
        "super_admin",
        "transcripts.html",
        "Student Transcripts"
      );

      setupLogout();

      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Student Transcripts</h1>
            <p>
              Review academic histories and transcript records
              for Graceland Academy International School
              of Excellence (GRACAIS).
            </p>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <div>
              <h2>Transcript Records</h2>
              <p>
                Transcript information will be retrieved from
                the real database after integration.
              </p>
            </div>
          </div>

          <div class="form-group">
            <label for="transcriptSearch">
              Find a student's transcript
            </label>
            <input
              type="search"
              id="transcriptSearch"
              placeholder="Enter student ID or name..."
              autocomplete="off"
              disabled
            >
            <small>
              Transcript search will be enabled after
              database integration.
            </small>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Academic Year</th>
                  <th>Transcript Status</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td colspan="5">
                    <div class="empty-state">
                      <h3>No transcript records loaded</h3>
                      <p>
                        Actual academic records will appear
                        after the database is connected.
                        No sample transcripts are being created.
                      </p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    initTranscriptsPage().catch(error => {
      console.error("Transcripts page error:", error);

      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card">
              <h2>Unable to load Student Transcripts</h2>
              <p>
                Check the shared portal files and
                authentication configuration.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
