<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Academic Reports">
  <title>Academic Reports | GRACAIS E-Portal</title>
  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import { initLayout, requireUser } from "../assets/layout.js";
    import { setupLogout } from "../assets/app.js";
    import { supabase } from "../assets/supabase.js";
    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    initLayout("super_admin", "reports.html", "Academic Reports");
    setupLogout();
    const auth = await requireUser(ALLOWED_ROLES);
    if (auth) {
      const pageContent = document.getElementById("pageContent");
      if (pageContent) {
        pageContent.innerHTML = `
          <section class="page-heading">
            <h1>Academic Reports</h1>
            <p>
              Review verified academic records for
              Graceland Academy International School of Excellence (GRACAIS).
            </p>
          </section>
          <section class="card">
            <h2>Report Center</h2>
            <p style="margin:8px 0 18px;">
              Select a report and academic year, then generate or print it.
            </p>
            <form id="reportForm">
              <div class="form-group">
                <label for="reportType">Report type</label>
                <select id="reportType" required>
                  <option value="">Select a report</option>
                  <option value="grades">Grade Summary</option>
                  <option value="attendance">Attendance Summary</option>
                  <option value="enrollment">Enrollment Summary</option>
                  <option value="class-performance">Class Performance</option>
                </select>
              </div>
              <div class="form-group">
                <label for="reportYear">Academic year</label>
                <select id="reportYear" required>
                  <option value="">Loading academic years...</option>
                </select>
              </div>
              <button type="submit" id="generateReport" class="btn btn-primary">
                Generate Report
              </button>
              <button type="button" id="printReport" class="btn btn-primary" disabled>
                Print Report
              </button>
              <p id="reportMessage" role="status" style="margin-top:12px;"></p>
            </form>
          </section>
          <section class="card" id="reportOutput" style="margin-top:20px;">
            <h2>Report Results</h2>
            <p>Select a report and academic year to begin.</p>
          </section>
        `;
        const reportForm = document.getElementById("reportForm");
        const reportType = document.getElementById("reportType");
        const reportYear = document.getElementById("reportYear");
        const reportMessage = document.getElementById("reportMessage");
        const reportOutput = document.getElementById("reportOutput");
        const generateButton = document.getElementById("generateReport");
        const printButton = document.getElementById("printReport");
        let academicYears = [];
        let currentReportTitle = "";
        function escapeHTML(value) {
          return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[char]);
        }
        async function loadAcademicYears() {
          const { data, error } = await supabase
            .from("academic_years")
            .select("*")
            .order("start_date", { ascending: false });
          if (error) {
            console.error("Academic years loading error:", error);
            reportYear.innerHTML =
              '<option value="">Unable to load academic years</option>';
            reportMessage.textContent =
              "Could not load academic years. Check the academic_years table and access policies.";
            return;
          }
          academicYears = data || [];
          reportYear.innerHTML =
            '<option value="">Select an academic year</option>' +
            academicYears.map(year => {
              const label = year.name ||
                [year.start_date, year.end_date].filter(Boolean).join(" – ") ||
                year.id;
              return `
                <option value="${escapeHTML(year.id)}">
                  ${escapeHTML(label)}
                </option>
              `;
            }).join("");
        }
        function showReport(title, summary, rows, headers) {
          currentReportTitle = title;
          const table = rows.length
            ? `
              <div class="table-container" style="overflow-x:auto;">
                <table>
                  <thead>
                    <tr>${headers.map(header => `<th>${escapeHTML(header)}</th>`).join("")}</tr>
                  </thead>
                  <tbody>
                    ${rows.map(row => `
                      <tr>${row.map(value => `<td>${escapeHTML(value)}</td>`).join("")}</tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            `
            : "<p>No records were found for this report.</p>";
          reportOutput.innerHTML = `
            <div id="printableReport">
              <h2>${escapeHTML(title)}</h2>
              <p>Graceland Academy International School of Excellence (GRACAIS)</p>
              <p>${escapeHTML(summary)}</p>
              <p>Generated: ${escapeHTML(new Date().toLocaleString())}</p>
              <hr style="margin:16px 0;">
              ${table}
            </div>
          `;
          printButton.disabled = false;
        }
        async function fetchRows(table, columns, yearId) {
          let query = supabase.from(table).select(columns);
          // This assumes these tables use academic_year_id.
          query = query.eq("academic_year_id", yearId);
          return await query.limit(2000);
        }
        async function generateSelectedReport() {
          const type = reportType.value;
          const yearId = reportYear.value;
          const year = academicYears.find(
            item => String(item.id) === String(yearId)
          );
          if (!type || !yearId) {
            reportMessage.textContent =
              "Select both a report type and academic year.";
            return;
          }
          generateButton.disabled = true;
          printButton.disabled = true;
          reportMessage.textContent = "Generating report...";
          reportOutput.innerHTML = "<p>Loading report data...</p>";
          try {
            if (type === "grades") {
              const { data, error } = await fetchRows(
                "grades",
                "*",
                yearId
              );
              if (error) throw error;
              const rows = (data || []).map(item => [
                item.student_id ?? "—",
                item.subject ?? item.subject_id ?? "—",
                item.grading_period ?? "—",
                item.score ?? "—",
                item.grade ?? "—"
              ]);
              showReport(
                "Grade Summary",
                `Academic year: ${year.name || yearId}. ${rows.length} grade record(s).`,
                rows,
                ["Student ID", "Subject", "Period", "Score", "Grade"]
              );
            } else if (type === "attendance") {
              const { data, error } = await fetchRows(
                "attendance",
                "*",
                yearId
              );
              if (error) throw error;
              const records = data || [];
              const present = records.filter(
                item => String(item.status || "").toLowerCase() === "present"
              ).length;
              const absent = records.filter(
                item => String(item.status || "").toLowerCase() === "absent"
              ).length;
              const rows = records.map(item => [
                item.student_id ?? "—",
                item.date ?? "—",
                item.status ?? "—"
              ]);
              showReport(
                "Attendance Summary",
                `Academic year: ${year.name || yearId}. Total: ${records.length}; Present: ${present}; Absent: ${absent}.`,
                rows,
                ["Student ID", "Date", "Status"]
              );
            } else if (type === "enrollment") {
              const { data, error } = await fetchRows(
                "enrollments",
                "*",
                yearId
              );
              if (error) throw error;
              const rows = (data || []).map(item => [
                item.student_id ?? "—",
                item.class_id ?? "—",
                item.status ?? "—"
              ]);
              showReport(
                "Enrollment Summary",
                `Academic year: ${year.name || yearId}. ${rows.length} enrollment record(s).`,
                rows,
                ["Student ID", "Class ID", "Status"]
              );
            } else if (type === "class-performance") {
              const { data, error } = await fetchRows(
                "grades",
                "*",
                yearId
              );
              if (error) throw error;
              const grouped = new Map();
              (data || []).forEach(item => {
                const key = item.class_id ?? "Unassigned";
                if (!grouped.has(key)) grouped.set(key, []);
                if (item.score !== null && item.score !== undefined &&
                    item.score !== "" && Number.isFinite(Number(item.score))) {
                  grouped.get(key).push(Number(item.score));
                }
              });
              const rows = [...grouped.entries()].map(([classId, scores]) => {
                const average = scores.length
                  ? (scores.reduce((sum, score) => sum + score, 0) / scores.length).toFixed(2)
                  : "No scores";
                return [classId, scores.length, average];
              });
              showReport(
                "Class Performance",
                `Academic year: ${year.name || yearId}. Averages are calculated from available numeric scores.`,
                rows,
                ["Class ID", "Number of Scores", "Average Score"]
              );
            }
            reportMessage.textContent = "Report generated.";
          } catch (error) {
            console.error("Report generation error:", error);
            reportOutput.innerHTML = `
              <h2>Unable to generate report</h2>
              <p>Check the table names, academic_year_id column, database relationships, and Supabase access policies.</p>
            `;
            reportMessage.textContent =
              "Report generation failed. Your database schema may differ from the expected columns.";
          } finally {
            generateButton.disabled = false;
          }
        }
        reportForm.addEventListener("submit", async event => {
          event.preventDefault();
          await generateSelectedReport();
        });
        printButton.addEventListener("click", () => {
          if (printButton.disabled) return;
          const content = document.getElementById("printableReport");
          if (!content) return;
          const printWindow = window.open("", "_blank");
          if (!printWindow) {
            reportMessage.textContent =
              "Printing window blocked. Allow pop-ups and try again.";
            return;
          }
          printWindow.document.write(`
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <title>${escapeHTML(currentReportTitle)}</title>
              <style>
                body { font-family: Arial, sans-serif; padding: 24px; color: #172033; }
                h2 { color: #063B7A; }
                table { border-collapse: collapse; width: 100%; margin-top: 20px; }
                th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
                th { background: #E0F5FF; }
                @media print { body { padding: 0; } }
              </style>
            </head>
            <body>${content.innerHTML}</body>
            </html>
          `);
          printWindow.document.close();
          printWindow.focus();
          printWindow.print();
        });
        await loadAcademicYears();
      }
    }
  </script>
</body>
</html>
