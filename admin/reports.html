<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Academic Reports">
  <title>Academic Reports | GRACAIS E-Portal</title>
  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import { initLayout, requireUser } from "../assets/layout.js";
    import { setupLogout } from "../assets/app.js";
    import { supabase } from "../assets/supabase.js";
    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    initLayout("super_admin", "reports.html", "Academic Reports");
    setupLogout();
    const auth = await requireUser(ALLOWED_ROLES);
    if (auth) {
      const pageContent = document.getElementById("pageContent");
      if (pageContent) {
        pageContent.innerHTML = `
          <section class="page-heading">
            <div>
              <h1>Academic Reports</h1>
              <p>
                Review verified academic records for
                Graceland Academy International School of Excellence (GRACAIS) [Grades 4th - 12th].
              </p>
            </div>
          </section>

          <div class="portal-grid">
            <section class="card portal-card">
              <div class="card-header">
                <div>
                  <h2>Report Center</h2>
                  <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Select a report and academic year, then generate or print it.</p>
                </div>
              </div>
              <form id="reportForm">
                <div class="form-row">
                  <div class="form-group">
                    <label for="reportType">Report type</label>
                    <select id="reportType" required>
                      <option value="">Select a report</option>
                      <option value="grades">Grade Summary</option>
                      <option value="attendance">Attendance Summary</option>
                      <option value="enrollment">Enrollment Summary</option>
                      <option value="class-performance">Class Performance</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="reportYear">Academic year</label>
                    <select id="reportYear" required>
                      <option value="">Loading academic years...</option>
                    </select>
                  </div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap;">
                  <button type="submit" id="generateReport" class="btn btn-primary">
                    + Generate Report
                  </button>
                  <button type="button" id="printReport" class="btn btn-secondary" disabled>
                    🖨️ Print Report
                  </button>
                </div>
                <p id="reportMessage" role="status" class="form-message"></p>
              </form>
            </section>

            <section class="card portal-card" id="reportOutput">
              <div class="card-header">
                <div>
                  <h2>Report Results</h2>
                  <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Select a report and academic year to begin.</p>
                </div>
              </div>
              <div class="empty-state-cell" style="padding: 32px 16px; text-align: center; color: #64748B;">
                No report generated yet.
              </div>
            </section>
          </div>

          <style>
            .portal-grid {
              display: flex;
              flex-direction: column;
              gap: 20px;
            }

            .portal-card {
              background: #ffffff;
              border-radius: 12px;
              border: 1px solid #D9E5F0;
              box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
              padding: 24px;
            }

            .page-heading {
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 20px;
              flex-wrap: wrap;
              gap: 12px;
            }

            .page-heading h1 {
              color: #063B7A;
              font-size: 1.5rem;
              margin: 0;
            }

            .page-heading p {
              color: #64748B;
              margin: 4px 0 0 0;
              font-size: 0.9rem;
            }

            .form-row {
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 16px;
            }

            @media (max-width: 600px) {
              .form-row {
                grid-template-columns: 1fr;
              }
            }

            #reportForm {
              display: grid;
              gap: 16px;
              margin-top: 12px;
            }

            .form-message {
              margin-top: 8px;
              font-size: 0.88rem;
              font-weight: 500;
              color: #063B7A;
            }

            .table-container {
              width: 100%;
              overflow-x: auto;
              border: 1px solid #E2E8F0;
              border-radius: 8px;
            }

            .portal-table {
              width: 100%;
              border-collapse: collapse;
              text-align: left;
              font-size: 0.88rem;
            }

            .portal-table th {
              background: #F8FAFC;
              color: #063B7A;
              font-weight: 600;
              padding: 12px 16px;
              border-bottom: 2px solid #E2E8F0;
              white-space: nowrap;
            }

            .portal-table td {
              padding: 14px 16px;
              border-bottom: 1px solid #E2E8F0;
              color: #334155;
              vertical-align: middle;
            }

            .font-bold-title {
              font-weight: 600;
              color: #0F172A;
            }

            /* Dropdown Menu System */
            .portal-action-wrapper {
              position: relative;
              display: flex;
              justify-content: flex-end;
            }

            .portal-action-btn {
              background: #F1F5F9;
              border: 1px solid #CBD5E1;
              color: #0F172A;
              padding: 6px 12px;
              border-radius: 6px;
              font-size: 0.85rem;
              font-weight: 600;
              cursor: pointer;
              transition: all 0.2s ease;
            }

            .portal-action-btn:hover {
              background: #E2E8F0;
            }

            .portal-dropdown-menu {
              display: none;
              position: absolute;
              right: 0;
              top: 100%;
              margin-top: 4px;
              background: #ffffff;
              border: 1px solid #E2E8F0;
              box-shadow: 0 10px 25px rgba(0,0,0,0.1);
              border-radius: 8px;
              min-width: 160px;
              z-index: 50;
              overflow: hidden;
            }

            .portal-dropdown-menu.show {
              display: block;
            }

            .portal-dropdown-item {
              width: 100%;
              text-align: left;
              padding: 10px 14px;
              background: transparent;
              border: none;
              color: #334155;
              font-size: 0.85rem;
              font-weight: 500;
              cursor: pointer;
              display: flex;
              align-items: center;
              gap: 8px;
              transition: background 0.15s ease;
            }

            .portal-dropdown-item:hover {
              background: #F8FAFC;
              color: #063B7A;
            }

            .loading-cell {
              text-align: center;
              padding: 24px;
              color: #64748B;
            }

            .empty-state-cell {
              text-align: center;
              padding: 32px 16px;
              color: #64748B;
            }
          </style>
        `;

        const reportForm = document.getElementById("reportForm");
        const reportType = document.getElementById("reportType");
        const reportYear = document.getElementById("reportYear");
        const reportMessage = document.getElementById("reportMessage");
        const reportOutput = document.getElementById("reportOutput");
        const generateButton = document.getElementById("generateReport");
        const printButton = document.getElementById("printReport");
        let academicYears = [];
        let currentReportTitle = "";

        function escapeHTML(value) {
          return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[char]);
        }

        function toggleActionDropdown(button) {
          const currentDropdown = button.nextElementSibling;
          const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
          
          allDropdowns.forEach(menu => {
            if (menu !== currentDropdown) {
              menu.classList.remove("show");
            }
          });

          if (currentDropdown) {
            currentDropdown.classList.toggle("show");
          }
        }

        document.addEventListener("click", (e) => {
          if (!e.target.closest(".portal-action-wrapper")) {
            document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
              menu.classList.remove("show");
            });
          }
        });

        async function loadAcademicYears() {
          const { data, error } = await supabase
            .from("academic_years")
            .select("*")
            .order("start_date", { ascending: false });

          if (error) {
            console.error("Academic years loading error:", error);
            reportYear.innerHTML =
              '<option value="">Unable to load academic years</option>';
            reportMessage.textContent =
              "Could not load academic years. Check the academic_years table and access policies.";
            return;
          }

          academicYears = data || [];
          reportYear.innerHTML =
            '<option value="">Select an academic year</option>' +
            academicYears.map(year => {
              const label = year.name ||
                [year.start_date, year.end_date].filter(Boolean).join(" – ") ||
                year.id;
              return `
                <option value="${escapeHTML(year.id)}">
                  ${escapeHTML(label)}
                </option>
              `;
            }).join("");
        }

        function showReport(title, summary, rows, headers) {
          currentReportTitle = title;
          const table = rows.length
            ? `
              <div class="table-container">
                <table class="portal-table">
                  <thead>
                    <tr>
                      ${headers.map(header => `<th>${escapeHTML(header)}</th>`).join("")}
                      <th style="text-align: right;">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rows.map((row, index) => `
                      <tr>
                        ${row.map(value => `<td>${escapeHTML(value)}</td>`).join("")}
                        <td>
                          <div class="portal-action-wrapper">
                            <button type="button" class="portal-action-btn action-toggle-btn">
                              Actions ▾
                            </button>
                            <div class="portal-dropdown-menu">
                              <button type="button" class="portal-dropdown-item view-row-item" data-index="${index}">
                                👁️ View Entry
                              </button>
                              <button type="button" class="portal-dropdown-item copy-row-data" data-text="${escapeHTML(row.join(" | "))}">
                                📋 Copy Row Data
                              </button>
                            </div>
                          </div>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            `
            : "<div class=\"empty-state-cell\">No records were found for this report.</div>";

          reportOutput.innerHTML = `
            <div id="printableReport">
              <div class="card-header" style="margin-bottom:16px;">
                <div>
                  <h2 style="color:#063B7A; margin:0; font-size:1.25rem;">${escapeHTML(title)}</h2>
                  <p style="margin:4px 0; color:#64748B; font-size:0.85rem;">Graceland Academy International School of Excellence (GRACAIS) [Grades 4th - 12th]</p>
                  <p style="margin:0; font-weight:600; color:#334155; font-size:0.9rem;">${escapeHTML(summary)}</p>
                  <p style="margin:4px 0 0 0; color:#64748B; font-size:0.8rem;">Generated: ${escapeHTML(new Date().toLocaleString())}</p>
                </div>
              </div>
              <hr style="margin:16px 0; border:none; border-top:1px solid #E2E8F0;">
              ${table}
            </div>
          `;

          reportOutput.querySelectorAll(".action-toggle-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              toggleActionDropdown(btn);
            });
          });

          reportOutput.querySelectorAll(".view-row-item").forEach(button => {
            button.addEventListener("click", () => {
              const row = rows[button.dataset.index];
              alert(`--- Report Entry Details ---\n${headers.map((h, i) => `${h}:${row[i]}`).join("\n")}`);
            });
          });

          reportOutput.querySelectorAll(".copy-row-data").forEach(button => {
            button.addEventListener("click", () => {
              const text = button.dataset.text;
              if (text) {
                navigator.clipboard.writeText(text);
                alert(`Copied entry to clipboard:\n${text}`);
              }
            });
          });

          printButton.disabled = false;
        }

        async function fetchRows(table, columns, yearId) {
          let query = supabase.from(table).select(columns);
          query = query.eq("academic_year_id", yearId);
          return await query.limit(2000);
        }

        async function generateSelectedReport() {
          const type = reportType.value;
          const yearId = reportYear.value;
          const year = academicYears.find(
            item => String(item.id) === String(yearId)
          );

          if (!type || !yearId) {
            reportMessage.textContent =
              "Select both a report type and academic year.";
            return;
          }

          generateButton.disabled = true;
          printButton.disabled = true;
          reportMessage.textContent = "Generating report...";
          reportOutput.innerHTML = "<div class='loading-cell'>Loading report data from Supabase...</div>";

          try {
            if (type === "grades") {
              const { data, error } = await fetchRows(
                "grades",
                "*",
                yearId
              );
              if (error) throw error;
              const rows = (data || []).map(item => [
                item.student_id ?? "—",
                item.subject ?? item.subject_id ?? "—",
                item.grading_period ?? "—",
                item.score ?? "—",
                item.grade ?? "—"
              ]);
              showReport(
                "Grade Summary Report",
                `Academic year: ${year.name || yearId}. ${rows.length} grade record(s).`,
                rows,
                ["Student ID", "Subject", "Period", "Score", "Grade"]
              );
            } else if (type === "attendance") {
              const { data, error } = await fetchRows(
                "attendance",
                "*",
                yearId
              );
              if (error) throw error;
              const records = data || [];
              const present = records.filter(
                item => String(item.status || "").toLowerCase() === "present"
              ).length;
              const absent = records.filter(
                item => String(item.status || "").toLowerCase() === "absent"
              ).length;
              const rows = records.map(item => [
                item.student_id ?? "—",
                item.date ?? "—",
                item.status ?? "—"
              ]);
              showReport(
                "Attendance Summary Report",
                `Academic year: ${year.name || yearId}. Total: ${records.length}; Present: ${present}; Absent: ${absent}.`,
                rows,
                ["Student ID", "Date", "Status"]
              );
            } else if (type === "enrollment") {
              const { data, error } = await fetchRows(
                "enrollments",
                "*",
                yearId
              );
              if (error) throw error;
              const rows = (data || []).map(item => [
                item.student_id ?? "—",
                item.class_id ?? "—",
                item.status ?? "—"
              ]);
              showReport(
                "Enrollment Summary Report",
                `Academic year: ${year.name || yearId}. ${rows.length} enrollment record(s).`,
                rows,
                ["Student ID", "Class ID", "Status"]
              );
            } else if (type === "class-performance") {
              const { data, error } = await fetchRows(
                "grades",
                "*",
                yearId
              );
              if (error) throw error;
              const grouped = new Map();
              (data || []).forEach(item => {
                const key = item.class_id ?? "Unassigned";
                if (!grouped.has(key)) grouped.set(key, []);
                if (item.score !== null && item.score !== undefined &&
                    item.score !== "" && Number.isFinite(Number(item.score))) {
                  grouped.get(key).push(Number(item.score));
                }
              });
              const rows = [...grouped.entries()].map(([classId, scores]) => {
                const average = scores.length
                  ? (scores.reduce((sum, score) => sum + score, 0) / scores.length).toFixed(2)
                  : "No scores";
                return [classId, scores.length, average];
              });
              showReport(
                "Class Performance Report",
                `Academic year: ${year.name || yearId}. Averages calculated from available numeric scores.`,
                rows,
                ["Class ID", "Number of Scores", "Average Score"]
              );
            }
            reportMessage.textContent = "Report generated successfully.";
          } catch (error) {
            console.error("Report generation error:", error);
            reportOutput.innerHTML = `
              <div class="empty-state-cell">
                <h3 style="color:#991B1B;">Unable to generate report</h3>
                <p>Check table names, academic_year_id column, database relationships, and Supabase policies.</p>
              </div>
            `;
            reportMessage.textContent =
              "Report generation failed. Your database schema may differ.";
          } finally {
            generateButton.disabled = false;
          }
        }

        reportForm.addEventListener("submit", async event => {
          event.preventDefault();
          await generateSelectedReport();
        });

        printButton.addEventListener("click", () => {
          if (printButton.disabled) return;
          const content = document.getElementById("printableReport");
          if (!content) return;
          const printWindow = window.open("", "_blank");
          if (!printWindow) {
            reportMessage.textContent =
              "Printing window blocked. Allow pop-ups and try again.";
            return;
          }
          printWindow.document.write(`
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <title>${escapeHTML(currentReportTitle)}</title>
              <style>
                body { font-family: Arial, sans-serif; padding: 24px; color: #172033; }
                h2 { color: #063B7A; }
                table { border-collapse: collapse; width: 100%; margin-top: 20px; }
                th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 13px; }
                th { background: #E0F5FF; color: #063B7A; }
                @media print { body { padding: 0; } }
              </style>
            </head>
            <body>${content.innerHTML}</body>
            </html>
          `);
          printWindow.document.close();
          printWindow.focus();
          printWindow.print();
        });

        await loadAcademicYears();
      }
    }
  </script>
</body>
</html>
