<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Academic Reports">
  <title>Academic Reports | GRACAIS E-Portal</title>

  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
  <div id="app">
    <main class="page-content">
      <p>Loading academic reports...</p>
    </main>
  </div>

  <script type="module">
    import {
      requireUser,
      setupLogout
    } from "../assets/app.js";

    import {
      initLayout
    } from "../assets/layout.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    async function initReportsPage() {
      initLayout(
        "super_admin",
        "reports.html",
        "Academic Reports"
      );

      setupLogout();

      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Academic Reports</h1>
            <p>
              Review academic performance and school records
              for Graceland Academy International School
              of Excellence (GRACAIS).
            </p>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <div>
              <h2>Report Center</h2>
              <p>
                Reports will use actual school records
                after database integration.
              </p>
            </div>
          </div>

          <div class="form-group">
            <label for="reportType">Report type</label>
            <select id="reportType" disabled>
              <option value="">Select a report</option>
              <option value="grades">Grade Summary</option>
              <option value="attendance">Attendance Summary</option>
              <option value="enrollment">Enrollment Summary</option>
              <option value="class-performance">Class Performance</option>
            </select>
            <small>
              Report generation will be enabled after
              database integration.
            </small>
          </div>

          <div class="form-group">
            <label for="reportYear">Academic year</label>
            <select id="reportYear" disabled>
              <option value="">Select an academic year</option>
            </select>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Report</th>
                  <th>Academic Year</th>
                  <th>Generated Date</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="4">
                    <div class="empty-state">
                      <h3>No reports available</h3>
                      <p>
                        Reports will be generated from verified
                        academic records after database integration.
                        No demo results are being displayed.
                      </p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    initReportsPage().catch(error => {
      console.error("Academic reports error:", error);

      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card">
              <h2>Unable to load Academic Reports</h2>
              <p>
                Check the shared portal files and
                authentication configuration.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
