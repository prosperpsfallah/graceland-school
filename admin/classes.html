<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Class Management">
  <title>Classes | GRACAIS E-Portal</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="app">
    <main class="page-content">
      <p>Loading class records...</p>
    </main>
  </div>
  <script type="module">
    import { requireUser, setupLogout } from "../assets/app.js";
    import { initLayout } from "../assets/layout.js";
    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    async function initClassesPage() {
      initLayout(
        "super_admin",
        "classes.html",
        "Class Management"
      );
      setupLogout();
      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;
      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;
      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Class Management</h1>
            <p>
              Manage the school classes and grade levels
              of Graceland Academy International School
              of Excellence (GRACAIS).
            </p>
          </div>
        </section>
        <section class="card">
          <div class="card-header">
            <div>
              <h2>School Classes</h2>
              <p>
                Class records will be retrieved from the
                real database after integration.
              </p>
            </div>
          </div>
          <div class="form-group">
            <label for="classSearch">Search classes</label>
            <input
              type="search"
              id="classSearch"
              placeholder="Search by class name or grade..."
              disabled
            >
            <small>
              Class search will be enabled after database integration.
            </small>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Class ID</th>
                  <th>Class Name</th>
                  <th>Grade Level</th>
                  <th>Academic Year</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="5">
                    <div class="empty-state">
                      <h3>No class records loaded</h3>
                      <p>
                        Actual classes will appear after the
                        database is connected. No sample
                        classes are being added.
                      </p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }
    initClassesPage().catch(error => {
      console.error("Class management error:", error);
      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card">
              <h2>Unable to load Class Management</h2>
              <p>
                Check the shared portal files and
                authentication configuration.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
