<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Class Management">
  <title>Classes | GRACAIS E-Portal</title>

  <link
    rel="icon"
    href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png"
    type="image/png"
  >
  <link
    rel="apple-touch-icon"
    href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png"
  >
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
  <div id="portalLayout"></div>

  <script type="module">
    import { requireUser, initLayout } from "../assets/layout.js";
    import { setupLogout } from "../assets/app.js";
    import { supabase } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    initLayout("super_admin", "classes.html", "Class Management");
    setupLogout();

    const auth = await requireUser(ALLOWED_ROLES);

    if (auth) {
      const pageContent = document.getElementById("pageContent");

      if (!pageContent) {
        console.error(
          "The portal layout did not create an element with id='pageContent'."
        );
        alert(
          "The page layout could not be loaded. Check assets/layout.js."
        );
      } else {
        pageContent.innerHTML = `
          <section class="page-heading">
            <div>
              <h1>Class Management</h1>
              <p>
                Manage class records for Graceland Academy International
                School of Excellence (GRACAIS), from 4th through 12th Grade.
              </p>
            </div>

            <button
              type="button"
              id="refreshClasses"
              class="btn btn-secondary"
            >
              ↻ Refresh Classes
            </button>
          </section>

          <div class="classes-grid">

            <section class="card classes-card">
              <div class="card-header">
                <div>
                  <h2>Add a Class</h2>
                  <p>Create a class record in the school database.</p>
                </div>
              </div>

              <form id="classForm">
                <div class="form-group">
                  <label for="className">Class name</label>
                  <input
                    id="className"
                    name="className"
                    type="text"
                    placeholder="e.g. 4th Grade - Section A"
                    maxlength="100"
                    required
                  >
                </div>

                <div class="form-group">
                  <label for="gradeLevel">Grade level</label>
                  <select id="gradeLevel" name="gradeLevel" required>
                    <option value="">Select grade level</option>
                    <option value="4">4th Grade</option>
                    <option value="5">5th Grade</option>
                    <option value="6">6th Grade</option>
                    <option value="7">7th Grade</option>
                    <option value="8">8th Grade</option>
                    <option value="9">9th Grade</option>
                    <option value="10">10th Grade</option>
                    <option value="11">11th Grade</option>
                    <option value="12">12th Grade</option>
                  </select>
                </div>

                <button
                  type="submit"
                  id="saveClass"
                  class="btn btn-primary"
                >
                  + Save Class
                </button>

                <p id="formMessage" role="status" class="form-message"></p>
              </form>
            </section>

            <section class="card classes-card">
              <div class="classes-header">
                <div>
                  <h2>School Classes</h2>
                  <p>Records retrieved from Supabase.</p>
                </div>

                <p id="tableMessage" role="status">
                  Loading classes...
                </p>
              </div>

              <div class="table-toolbar">
                <input
                  type="search"
                  id="classSearch"
                  placeholder="Search by class name or grade..."
                  aria-label="Search classes"
                >
              </div>

              <div class="table-container">
                <table class="portal-table">
                  <thead>
                    <tr>
                      <th>Class ID</th>
                      <th>Class Name</th>
                      <th>Grade Level</th>
                      <th>Date Created</th>
                      <th>Actions</th>
                    </tr>
                  </thead>

                  <tbody id="classesBody">
                    <tr>
                      <td colspan="5" class="loading-cell">
                        Loading classes...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>

          <style>
            .classes-grid {
              display: grid;
              grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.7fr);
              gap: 20px;
              align-items: start;
            }

            .classes-card {
              min-width: 0;
              padding: 22px;
              background: #fff;
              border: 1px solid #D9E5F0;
              border-radius: 12px;
              box-shadow: 0 4px 16px rgba(3, 42, 88, 0.05);
            }

            .classes-card h2 {
              margin-top: 0;
              margin-bottom: 6px;
              color: #063B7A;
            }

            .classes-card p {
              color: #64748B;
            }

            .page-heading {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 14px;
              flex-wrap: wrap;
              margin-bottom: 20px;
            }

            .page-heading h1 {
              color: #063B7A;
              margin: 0;
              font-size: 1.5rem;
            }

            .page-heading p {
              margin-top: 6px;
              color: #64748B;
            }

            #classForm {
              display: grid;
              gap: 16px;
              margin-top: 18px;
            }

            .form-group {
              display: grid;
              gap: 7px;
            }

            .form-group label {
              font-weight: 600;
              color: #063B7A;
            }

            .form-group input,
            .form-group select,
            #classSearch {
              width: 100%;
              box-sizing: border-box;
              min-height: 44px;
              padding: 10px 12px;
              border: 1px solid #CBD5E1;
              border-radius: 8px;
              background: #fff;
              color: #0F172A;
              font: inherit;
            }

            .form-group input:focus,
            .form-group select:focus,
            #classSearch:focus {
              outline: 2px solid #38BDF8;
              outline-offset: 2px;
            }

            .form-message {
              min-height: 20px;
              margin: 0;
              font-size: 0.9rem;
              overflow-wrap: anywhere;
            }

            .form-message.success {
              color: #15803D;
            }

            .form-message.error {
              color: #B91C1C;
            }

            .classes-header {
              display: flex;
              justify-content: space-between;
              align-items: center;
              flex-wrap: wrap;
              gap: 12px;
              margin-bottom: 16px;
            }

            .classes-header p {
              margin: 5px 0 0;
              font-size: 0.9rem;
            }

            #tableMessage {
              font-weight: 600;
              color: #063B7A;
            }

            .table-toolbar {
              margin-bottom: 14px;
            }

            .table-container {
              width: 100%;
              overflow-x: auto;
              border: 1px solid #E2E8F0;
              border-radius: 8px;
            }

            .portal-table {
              width: 100%;
              border-collapse: collapse;
              text-align: left;
              font-size: 0.88rem;
            }

            .portal-table th {
              padding: 12px;
              background: #F0F7FF;
              color: #063B7A;
              border-bottom: 2px solid #D9E5F0;
              white-space: nowrap;
            }

            .portal-table td {
              padding: 12px;
              color: #334155;
              border-bottom: 1px solid #E2E8F0;
              vertical-align: middle;
            }

            .class-name-cell {
              font-weight: 600;
              color: #0F172A;
            }

            .class-id {
              display: inline-block;
              max-width: 150px;
              overflow-wrap: anywhere;
              font-family: monospace;
              font-size: 0.78rem;
            }

            .grade-badge {
              display: inline-block;
              padding: 5px 9px;
              border-radius: 7px;
              background: #E0F5FF;
              color: #063B7A;
              font-weight: 600;
              white-space: nowrap;
            }

            .action-buttons {
              display: flex;
              gap: 7px;
              flex-wrap: wrap;
            }

            .action-button {
              padding: 7px 9px;
              border: 1px solid #CBD5E1;
              border-radius: 7px;
              background: #F8FAFC;
              color: #063B7A;
              font: inherit;
              font-size: 0.8rem;
              cursor: pointer;
            }

            .action-button:hover {
              background: #E0F5FF;
            }

            .loading-cell,
            .empty-state-cell {
              padding: 26px 12px !important;
              text-align: center;
              color: #64748B !important;
            }

            button:disabled {
              opacity: 0.6;
              cursor: not-allowed;
            }

            @media (max-width: 900px) {
              .classes-grid {
                grid-template-columns: 1fr;
              }
            }

            @media (max-width: 600px) {
              .classes-card {
                padding: 15px;
              }

              .page-heading h1 {
                font-size: 1.3rem;
              }

              .portal-table {
                font-size: 0.82rem;
              }

              .portal-table th,
              .portal-table td {
                padding: 10px;
              }
            }
          </style>
        `;

        const form = document.getElementById("classForm");
        const formMessage = document.getElementById("formMessage");
        const tableMessage = document.getElementById("tableMessage");
        const classesBody = document.getElementById("classesBody");
        const searchInput = document.getElementById("classSearch");
        const saveButton = document.getElementById("saveClass");

        let classes = [];

        function escapeHTML(value) {
          return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[character]);
        }

        function gradeLabel(value) {
          const grade = Number(value);

          if (!Number.isInteger(grade) || grade < 4 || grade > 12) {
            return value == null ? "—" : `Grade ${escapeHTML(value)}`;
          }

          const suffix =
            grade % 100 >= 11 && grade % 100 <= 13
              ? "th"
              : ({ 1: "st", 2: "nd", 3: "rd" }[grade % 10] || "th");

          return `${grade}${suffix} Grade`;
        }

        function formatDate(value) {
          if (!value) return "—";

          const date = new Date(value);

          if (Number.isNaN(date.getTime())) return "—";

          return date.toLocaleDateString(undefined, {
            year: "numeric",
            month: "short",
            day: "numeric"
          });
        }

        function showFormMessage(message, type = "") {
          formMessage.textContent = message;
          formMessage.className = `form-message ${type}`;
        }

        function renderClasses() {
          const term = searchInput.value.trim().toLowerCase();

          const filtered = classes.filter(item => {
            const grade = gradeLabel(item.grade_level);

            return [
              item.id,
              item.name,
              item.grade_level,
              grade,
              formatDate(item.created_at)
            ].some(value =>
              String(value ?? "").toLowerCase().includes(term)
            );
          });

          if (filtered.length === 0) {
            classesBody.innerHTML = `
              <tr>
                <td colspan="5" class="empty-state-cell">
                  ${
                    term
                      ? "No classes match your search."
                      : "No classes have been added yet."
                  }
                </td>
              </tr>
            `;
            return;
          }

          classesBody.innerHTML = filtered.map(item => `
            <tr>
              <td>
                <span class="class-id">${escapeHTML(item.id)}</span>
              </td>

              <td class="class-name-cell">
                ${escapeHTML(item.name)}
              </td>

              <td>
                <span class="grade-badge">
                  ${gradeLabel(item.grade_level)}
                </span>
              </td>

              <td>${escapeHTML(formatDate(item.created_at))}</td>

              <td>
                <div class="action-buttons">
                  <button
                    type="button"
                    class="action-button view-class"
                    data-id="${escapeHTML(item.id)}"
                  >
                    View
                  </button>

                  <button
                    type="button"
                    class="action-button copy-class"
                    data-id="${escapeHTML(item.id)}"
                  >
                    Copy ID
                  </button>
                </div>
              </td>
            </tr>
          `).join("");

          classesBody.querySelectorAll(".view-class").forEach(button => {
            button.addEventListener("click", () => {
              const item = classes.find(
                record => String(record.id) === button.dataset.id
              );

              if (!item) return;

              alert(
                "CLASS DETAILS\n\n" +
                `Class ID: ${item.id}\n` +
                `Class Name: ${item.name}\n` +
                `Grade Level: ${gradeLabel(item.grade_level)}\n` +
                `Date Created: ${formatDate(item.created_at)}`
              );
            });
          });

          classesBody.querySelectorAll(".copy-class").forEach(button => {
            button.addEventListener("click", async () => {
              const id = button.dataset.id;
              if (!id) return;

              try {
                await navigator.clipboard.writeText(id);
                button.textContent = "Copied!";
              } catch (error) {
                console.error("Copy class ID failed:", error);
                window.prompt("Copy this Class ID:", id);
              }
            });
          });
        }

        async function loadClasses() {
          tableMessage.textContent = "Loading classes...";

          classesBody.innerHTML = `
            <tr>
              <td colspan="5" class="loading-cell">
                Loading classes...
              </td>
            </tr>
          `;

          try {
            const { data, error } = await supabase
              .from("classes")
              .select("id, name, grade_level, created_at")
              .order("grade_level", { ascending: true })
              .order("name", { ascending: true });

            if (error) throw error;

            classes = data || [];

            tableMessage.textContent =
              `${classes.length} class record(s) loaded.`;

            renderClasses();
          } catch (error) {
            console.error("Classes loading error:", error);

            classes = [];

            classesBody.innerHTML = `
              <tr>
                <td colspan="5" class="empty-state-cell">
                  Could not load classes. Check the browser console
                  and the Supabase SELECT policy for the classes table.
                </td>
              </tr>
            `;

            tableMessage.textContent = "Class records could not be loaded.";
          }
        }

        form.addEventListener("submit", async event => {
          event.preventDefault();

          const name =
            document.getElementById("className").value.trim();

          const gradeLevel =
            Number(document.getElementById("gradeLevel").value);

          if (!name || !Number.isInteger(gradeLevel) ||
              gradeLevel < 4 || gradeLevel > 12) {
            showFormMessage(
              "Enter a class name and select a grade from 4 to 12.",
              "error"
            );
            return;
          }

          saveButton.disabled = true;
          showFormMessage("Saving class...");

          try {
            const { data, error } = await supabase
              .from("classes")
              .insert({
                name,
                grade_level: gradeLevel
              })
              .select("id, name, grade_level, created_at")
              .single();

            if (error) throw error;

            form.reset();

            showFormMessage("Class saved successfully.", "success");

            await loadClasses();

            if (data) {
              tableMessage.textContent =
                "Class created successfully.";
            }
          } catch (error) {
            console.error("Class save error:", error);

            showFormMessage(
              "Could not save the class. Check the browser console " +
              "and the Supabase INSERT policy for the classes table.",
              "error"
            );
          } finally {
            saveButton.disabled = false;
          }
        });

        searchInput.addEventListener("input", renderClasses);

        document
          .getElementById("refreshClasses")
          .addEventListener("click", loadClasses);

        await loadClasses();
      }
    }
  </script>
</body>
</html>
