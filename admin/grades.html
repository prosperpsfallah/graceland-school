<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Academic Grades">
  <title>Grades | GRACAIS E-Portal</title>
  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="portalLayout"></div>
  <script type="module">
    import { initLayout, requireUser } from "../assets/layout.js";
    import { setupLogout } from "../assets/app.js";
    import { supabase } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    initLayout("super_admin", "grades.html", "Academic Grades");
    setupLogout();

    const auth = await requireUser(ALLOWED_ROLES);
    if (auth) {
      const pageContent = document.getElementById("pageContent");
      if (pageContent) {
        pageContent.innerHTML = `
          <section class="page-heading">
            <div>
              <h1>Academic Grades</h1>
              <p>
                Review student results for Graceland Academy
                International School of Excellence (GRACAIS) [Grades 4th - 12th].
              </p>
            </div>
            <button type="button" id="refreshGrades" class="btn btn-secondary">
              ↻ Refresh Records
            </button>
          </section>

          <section class="card portal-card">
            <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
              <div>
                <h2>Grade Records</h2>
                <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Read-only view of saved academic results synchronized from Supabase.</p>
              </div>
              <p id="gradesMessage" role="status" style="font-weight: 600; color: #063B7A; margin: 0;">Loading grade records...</p>
            </div>

            <div class="table-toolbar" style="margin-bottom: 16px;">
              <div class="search-input-wrapper">
                <input
                  type="search"
                  id="gradeSearch"
                  placeholder="🔍 Search by student ID, name, class, subject, or period..."
                  autocomplete="off"
                  style="width:100%; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px;"
                >
              </div>
            </div>

            <div class="table-container">
              <table class="portal-table">
                <thead>
                  <tr>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Class</th>
                    <th>Subject</th>
                    <th>Grading Period</th>
                    <th>Score</th>
                    <th>Grade</th>
                    <th style="text-align: right;">Actions</th>
                  </tr>
                </thead>
                <tbody id="gradesBody">
                  <tr><td colspan="8" class="loading-cell">Loading grades...</td></tr>
                </tbody>
              </table>
            </div>
          </section>

          <style>
            .portal-card {
              background: #ffffff;
              border-radius: 12px;
              border: 1px solid #D9E5F0;
              box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
              padding: 24px;
            }

            .page-heading {
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 20px;
              flex-wrap: wrap;
              gap: 12px;
            }

            .page-heading h1 {
              color: #063B7A;
              font-size: 1.5rem;
              margin: 0;
            }

            .page-heading p {
              color: #64748B;
              margin: 4px 0 0 0;
              font-size: 0.9rem;
            }

            .table-container {
              width: 100%;
              overflow-x: auto;
              border: 1px solid #E2E8F0;
              border-radius: 8px;
            }

            .portal-table {
              width: 100%;
              border-collapse: collapse;
              text-align: left;
              font-size: 0.88rem;
            }

            .portal-table th {
              background: #F8FAFC;
              color: #063B7A;
              font-weight: 600;
              padding: 12px 16px;
              border-bottom: 2px solid #E2E8F0;
              white-space: nowrap;
            }

            .portal-table td {
              padding: 14px 16px;
              border-bottom: 1px solid #E2E8F0;
              color: #334155;
              vertical-align: middle;
            }

            .font-bold-title {
              font-weight: 600;
              color: #0F172A;
            }

            .grade-badge {
              display: inline-block;
              padding: 4px 10px;
              border-radius: 12px;
              font-weight: 700;
              font-size: 0.85rem;
              background: #E0F5FF;
              color: #063B7A;
            }

            /* Dropdown Menu System */
            .portal-action-wrapper {
              position: relative;
              display: flex;
              justify-content: flex-end;
            }

            .portal-action-btn {
              background: #F1F5F9;
              border: 1px solid #CBD5E1;
              color: #0F172A;
              padding: 6px 12px;
              border-radius: 6px;
              font-size: 0.85rem;
              font-weight: 600;
              cursor: pointer;
              transition: all 0.2s ease;
            }

            .portal-action-btn:hover {
              background: #E2E8F0;
            }

            .portal-dropdown-menu {
              display: none;
              position: absolute;
              right: 0;
              top: 100%;
              margin-top: 4px;
              background: #ffffff;
              border: 1px solid #E2E8F0;
              box-shadow: 0 10px 25px rgba(0,0,0,0.1);
              border-radius: 8px;
              min-width: 170px;
              z-index: 50;
              overflow: hidden;
            }

            .portal-dropdown-menu.show {
              display: block;
            }

            .portal-dropdown-item {
              width: 100%;
              text-align: left;
              padding: 10px 14px;
              background: transparent;
              border: none;
              color: #334155;
              font-size: 0.85rem;
              font-weight: 500;
              cursor: pointer;
              display: flex;
              align-items: center;
              gap: 8px;
              transition: background 0.15s ease;
            }

            .portal-dropdown-item:hover {
              background: #F8FAFC;
              color: #063B7A;
            }

            .loading-cell {
              text-align: center;
              padding: 24px;
              color: #64748B;
            }

            .empty-state-cell {
              text-align: center;
              padding: 32px 16px;
              color: #64748B;
            }
          </style>
        `;

        const gradesBody = document.getElementById("gradesBody");
        const gradesMessage = document.getElementById("gradesMessage");
        const gradeSearch = document.getElementById("gradeSearch");
        let grades = [];

        function escapeHTML(value) {
          return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[char]);
        }

        function getLetterGrade(score) {
          if (score === null || score === undefined || score === "") {
            return "—";
          }
          const numericScore = Number(score);
          if (!Number.isFinite(numericScore)) return "—";
          if (numericScore >= 90) return "A";
          if (numericScore >= 80) return "B";
          if (numericScore >= 70) return "C";
          if (numericScore >= 60) return "D";
          return "F";
        }

        function toggleActionDropdown(button) {
          const currentDropdown = button.nextElementSibling;
          const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
          
          allDropdowns.forEach(menu => {
            if (menu !== currentDropdown) {
              menu.classList.remove("show");
            }
          });

          if (currentDropdown) {
            currentDropdown.classList.toggle("show");
          }
        }

        document.addEventListener("click", (e) => {
          if (!e.target.closest(".portal-action-wrapper")) {
            document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
              menu.classList.remove("show");
            });
          }
        });

        function renderGrades() {
          const term = gradeSearch.value.trim().toLowerCase();
          const filtered = grades.filter(item => {
            const student = item.students || {};
            const classRecord = item.classes || {};
            const values = [
              student.student_id,
              student.first_name,
              student.last_name,
              item.student_id,
              classRecord.name,
              classRecord.grade_level,
              item.subject,
              item.grading_period,
              item.score,
              item.grade
            ];
            return values.some(value =>
              String(value ?? "").toLowerCase().includes(term)
            );
          });

          if (filtered.length === 0) {
            gradesBody.innerHTML = `
              <tr><td colspan="8" class="empty-state-cell">No matching grade records found.</td></tr>
            `;
            return;
          }

          gradesBody.innerHTML = filtered.map((item, index) => {
            const student = item.students || {};
            const classRecord = item.classes || {};
            const studentId =
              student.student_id || item.student_id || "—";
            const studentName = [
              student.first_name,
              student.last_name
            ].filter(Boolean).join(" ") || "—";
            const className =
              classRecord.name ||
              classRecord.grade_level ||
              "—";
            const score =
              item.score === null || item.score === undefined
                ? "—"
                : escapeHTML(item.score);
            const grade =
              item.grade || getLetterGrade(item.score);

            return `
              <tr>
                <td style="font-family: monospace;" class="font-bold-title">${escapeHTML(studentId)}</td>
                <td>${escapeHTML(studentName)}</td>
                <td>${escapeHTML(className)}</td>
                <td>${escapeHTML(item.subject || "—")}</td>
                <td>${escapeHTML(item.grading_period || "—")}</td>
                <td>${score}</td>
                <td><span class="grade-badge">${escapeHTML(grade)}</span></td>
                <td>
                  <div class="portal-action-wrapper">
                    <button type="button" class="portal-action-btn action-toggle-btn">
                      Actions ▾
                    </button>
                    <div class="portal-dropdown-menu">
                      <button type="button" class="portal-dropdown-item view-grade" data-index="${index}">
                        👁️ View Full Report
                      </button>
                      <button type="button" class="portal-dropdown-item copy-student-id" data-id="${escapeHTML(studentId)}">
                        📋 Copy Student ID
                      </button>
                    </div>
                  </div>
                </td>
              </tr>
            `;
          }).join("");

          gradesBody.querySelectorAll(".action-toggle-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              toggleActionDropdown(btn);
            });
          });

          gradesBody.querySelectorAll(".view-grade").forEach(button => {
            button.addEventListener("click", () => {
              const item = filtered[button.dataset.index];
              const student = item.students || {};
              const name = [student.first_name, student.last_name].filter(Boolean).join(" ") || "Student";
              alert(`--- Grade Report Summary ---\nStudent: ${name} (${item.student_id || 'N/A'})\nSubject: ${item.subject || 'N/A'}\nPeriod: ${item.grading_period || 'N/A'}\nScore: ${item.score ?? 'N/A'}\nGrade: ${item.grade || getLetterGrade(item.score)}`);
            });
          });

          gradesBody.querySelectorAll(".copy-student-id").forEach(button => {
            button.addEventListener("click", () => {
              const id = button.dataset.id;
              if (id) {
                navigator.clipboard.writeText(id);
                alert(`Copied Student ID: ${id}`);
              }
            });
          });
        }

        async function loadGrades() {
          gradesMessage.textContent = "Loading grade records...";
          gradesBody.innerHTML =
            '<tr><td colspan="8" class="loading-cell">Loading...</td></tr>';

          const { data, error } = await supabase
            .from("grades")
            .select(`
              *,
              students (
                student_id,
                first_name,
                last_name
              ),
              classes (
                name,
                grade_level
              )
            `)
            .limit(1000);

          if (error) {
            console.error("Grade records loading error:", error);
            grades = [];
            gradesBody.innerHTML = `
              <tr>
                <td colspan="8" class="empty-state-cell">
                  Unable to load grade records. Check the grades table
                  columns, relationship definitions, and Supabase access policies.
                </td>
              </tr>
            `;
            gradesMessage.textContent =
              "Grade records could not be loaded.";
            return;
          }

          grades = data || [];
          gradesMessage.textContent =
            `${grades.length} grade record(s) loaded successfully.`;
          renderGrades();
        }

        gradeSearch.addEventListener("input", renderGrades);
        document.getElementById("refreshGrades")
          .addEventListener("click", loadGrades);

        await loadGrades();
      }
    }
  </script>
</body>
</html>
