<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Student Attendance">
  <title>Attendance | GRACAIS E-Portal</title>
  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="app">
    <main class="page-content">
      <p>Loading attendance records...</p>
    </main>
  </div>
  <script type="module">
    import {
      requireUser,
      setupLogout
    } from "../assets/app.js";
    import {
      initLayout
    } from "../assets/layout.js";
    import {
      supabase
    } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];
    let attendanceRecords = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value + "T00:00:00");
      return Number.isNaN(date.getTime())
        ? escapeHTML(value)
        : date.toLocaleDateString(undefined, {
            year: "numeric",
            month: "short",
            day: "numeric"
          });
    }

    function getStudentName(record) {
      if (record.student_name) return record.student_name;
      const student = record.students;
      if (Array.isArray(student)) {
        return student.map(getStudentName).join(", ") || "—";
      }
      if (!student) return "—";
      const first = student.first_name || "";
      const last = student.last_name || "";
      const full = `${first} ${last}`.trim();
      return full || "—";
    }

    function getClassName(record) {
      if (record.class_name) return record.class_name;
      if (record.classes?.name) return record.classes.name;
      const student = Array.isArray(record.students)
        ? record.students[0]
        : record.students;
      const enrollment = student?.enrollments;
      const enrollmentRecord = Array.isArray(enrollment)
        ? enrollment[0]
        : enrollment;
      const classRecord = enrollmentRecord?.classes;
      const classInfo = Array.isArray(classRecord)
        ? classRecord[0]
        : classRecord;
      return classInfo?.name || classInfo?.class_name || "—";
    }

    function getStatus(record) {
      return record.status || record.attendance_status || "—";
    }

    function toggleActionDropdown(button) {
      const currentDropdown = button.nextElementSibling;
      const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
      
      allDropdowns.forEach(menu => {
        if (menu !== currentDropdown) {
          menu.classList.remove("show");
        }
      });

      if (currentDropdown) {
        currentDropdown.classList.toggle("show");
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".portal-action-wrapper")) {
        document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
          menu.classList.remove("show");
        });
      }
    });

    function renderAttendance() {
      const tbody = document.getElementById("attendanceTableBody");
      if (!tbody) return;
      const searchTerm = (
        document.getElementById("attendanceSearch")?.value || ""
      ).trim().toLowerCase();
      const selectedDate =
        document.getElementById("attendanceDate")?.value || "";

      const filtered = attendanceRecords.filter(record => {
        const studentName = getStudentName(record).toLowerCase();
        const studentId = String(
          record.student_id || record.students?.student_id || ""
        ).toLowerCase();
        const className = getClassName(record).toLowerCase();
        const status = String(getStatus(record)).toLowerCase();
        const matchesSearch = [
          studentName,
          studentId,
          className,
          status
        ].some(value => value.includes(searchTerm));
        const matchesDate =
          !selectedDate || record.date === selectedDate;
        return matchesSearch && matchesDate;
      });

      const summary = document.getElementById("attendanceSummary");
      if (summary) {
        summary.textContent =
          `${filtered.length} record${filtered.length === 1 ? "" : "s"} shown`;
      }

      if (!filtered.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <h3>No attendance records found</h3>
                <p>
                  ${attendanceRecords.length
                    ? "Try changing the search term or date."
                    : "Real attendance records will appear here when they exist in the database."}
                </p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map((record, index) => {
        const statusVal = getStatus(record);
        const statusLower = statusVal.toLowerCase();
        let badgeClass = "inactive";
        if (statusLower.includes("present") || statusLower.includes("on time")) badgeClass = "active";
        else if (statusLower.includes("absent")) badgeClass = "error-badge";
        else if (statusLower.includes("late")) badgeClass = "warning-badge";

        return `
          <tr>
            <td class="font-bold-title">${escapeHTML(record.student_id || "—")}</td>
            <td>${escapeHTML(getStudentName(record))}</td>
            <td>${escapeHTML(getClassName(record))}</td>
            <td>${escapeHTML(formatDate(record.date))}</td>
            <td>
              <span class="status-badge ${badgeClass}">
                ${escapeHTML(statusVal)}
              </span>
            </td>
            <td>
              <div class="portal-action-wrapper">
                <button type="button" class="portal-action-btn action-toggle-btn">
                  Actions ▾
                </button>
                <div class="portal-dropdown-menu">
                  <button type="button" class="portal-dropdown-item view-attendance" data-index="${index}">
                    👁️ View Details
                  </button>
                  <button type="button" class="portal-dropdown-item edit-attendance" data-index="${index}">
                    ✏️ Update Status
                  </button>
                </div>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".action-toggle-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleActionDropdown(btn);
        });
      });

      tbody.querySelectorAll(".view-attendance").forEach(button => {
        button.addEventListener("click", () => {
          const record = filtered[button.dataset.index];
          alert(`Attendance Details:\nStudent: ${getStudentName(record)}\nClass: ${getClassName(record)}\nDate: ${record.date}\nStatus: ${getStatus(record)}`);
        });
      });

      tbody.querySelectorAll(".edit-attendance").forEach(button => {
        button.addEventListener("click", () => {
          const record = filtered[button.dataset.index];
          const newStatus = prompt("Enter new attendance status (Present, Absent, Late):", getStatus(record));
          if (newStatus) {
            alert(`Status update action triggered for record ID ${record.id || 'N/A' to} -> ${newStatus}`);
          }
        });
      });
    }

    async function fetchAttendanceData() {
      const primaryRes = await supabase
        .from("attendance")
        .select(`
          *,
          students (
            student_id,
            first_name,
            last_name
          )
        `)
        .order("date", { ascending: false });

      if (!primaryRes.error) {
        return primaryRes;
      }

      console.warn("Relational attendance query failed, attempting standalone table fallback...", primaryRes.error);

      const fallbackRes = await supabase
        .from("attendance")
        .select("*")
        .order("date", { ascending: false });

      if (!fallbackRes.error) {
        return fallbackRes;
      }

      return await supabase
        .from("student_attendance")
        .select("*")
        .order("date", { ascending: false });
    }

    async function loadAttendance() {
      const tbody = document.getElementById("attendanceTableBody");
      const refreshButton = document.getElementById("refreshAttendance");
      const message = document.getElementById("attendanceMessage");

      if (tbody) {
        tbody.innerHTML = `
          <tr><td colspan="6" class="loading-cell">Loading attendance records...</td></tr>
        `;
      }
      if (refreshButton) {
        refreshButton.disabled = true;
        refreshButton.textContent = "Loading...";
      }
      if (message) {
        message.hidden = true;
        message.textContent = "";
      }

      const { data, error } = await fetchAttendanceData();

      if (refreshButton) {
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Refresh";
      }

      if (error) {
        console.error("Attendance query error:", error);
        attendanceRecords = [];
        if (tbody) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  <h3>Unable to load attendance</h3>
                  <p>
                    Check the attendance table columns, student relationship,
                    and Supabase permissions.
                  </p>
                  <p class="error-detail">${escapeHTML(error.message || "")}</p>
                </div>
              </td>
            </tr>
          `;
        }
        if (message) {
          message.textContent = `Query error: ${error.message || "Failed to load records from Supabase."}`;
          message.className = "attendance-message error";
          message.hidden = false;
        }
        return;
      }

      attendanceRecords = data || [];
      renderAttendance();
    }

    async function initAttendancePage() {
      initLayout(
        "super_admin",
        "attendance.html",
        "Student Attendance"
      );
      setupLogout();
      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Student Attendance</h1>
            <p>
              Review attendance records for Graceland Academy
              International School of Excellence (GRACAIS) [Grades 4th - 12th].
            </p>
          </div>
          <button
            class="btn btn-secondary"
            id="refreshAttendance"
            type="button"
          >
            ↻ Refresh
          </button>
        </section>
        <div
          id="attendanceMessage"
          class="attendance-message"
          role="status"
          hidden
        ></div>
        <section class="card portal-card">
          <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div>
              <h2>Attendance Records</h2>
              <p>View real records from the school database.</p>
            </div>
            <p id="attendanceSummary" style="font-weight: 600; color: #063B7A; margin: 0;">Loading...</p>
          </div>
          
          <div class="filter-row" style="display: grid; grid-template-columns: 1fr 2fr; gap: 16px; margin-bottom: 16px;">
            <div class="form-group" style="margin: 0;">
              <label for="attendanceDate" style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #334155;">Filter by date</label>
              <input type="date" id="attendanceDate" style="width: 100%; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px;">
            </div>
            <div class="form-group" style="margin: 0;">
              <label for="attendanceSearch" style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #334155;">Search records</label>
              <input
                type="search"
                id="attendanceSearch"
                placeholder="🔍 Search student ID, name, class, or status..."
                autocomplete="off"
                style="width: 100%; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px;"
              >
            </div>
          </div>

          <div class="table-container">
            <table class="portal-table">
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Date</th>
                  <th>Attendance Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="attendanceTableBody">
                <tr><td colspan="6" class="loading-cell">Loading attendance records...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
        <style>
          .portal-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #D9E5F0;
            box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
            padding: 24px;
          }

          .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
          }

          .page-heading h1 {
            color: #063B7A;
            font-size: 1.5rem;
            margin: 0;
          }

          .page-heading p {
            color: #64748B;
            margin: 4px 0 0 0;
            font-size: 0.9rem;
          }

          .attendance-message {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            background: #E0F5FF;
            color: #063B7A;
            font-weight: 500;
          }
          .attendance-message.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
          }
          .error-detail {
            color: #DC2626;
            font-size: 13px;
            margin-top: 6px;
          }

          @media (max-width: 768px) {
            .filter-row {
              grid-template-columns: 1fr !important;
            }
          }

          .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
          }

          .portal-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
          }

          .portal-table th {
            background: #F8FAFC;
            color: #063B7A;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid #E2E8F0;
            white-space: nowrap;
          }

          .portal-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #E2E8F0;
            color: #334155;
            vertical-align: middle;
          }

          .font-bold-title {
            font-weight: 600;
            color: #0F172A;
          }

          .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
          }
          .status-badge.active {
            background: #DCFCE7;
            color: #15803D;
          }
          .status-badge.inactive {
            background: #F1F5F9;
            color: #64748B;
          }
          .status-badge.error-badge {
            background: #FEE2E2;
            color: #991B1B;
          }
          .status-badge.warning-badge {
            background: #FEF3C7;
            color: #B45309;
          }

          /* Dropdown Menu System */
          .portal-action-wrapper {
            position: relative;
            display: flex;
            justify-content: flex-end;
          }

          .portal-action-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
          }

          .portal-action-btn:hover {
            background: #E2E8F0;
          }

          .portal-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            min-width: 160px;
            z-index: 50;
            overflow: hidden;
          }

          .portal-dropdown-menu.show {
            display: block;
          }

          .portal-dropdown-item {
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            background: transparent;
            border: none;
            color: #334155;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease;
          }

          .portal-dropdown-item:hover {
            background: #F8FAFC;
            color: #063B7A;
          }

          .loading-cell {
            text-align: center;
            padding: 24px;
            color: #64748B;
          }

          .empty-state {
            text-align: center;
            padding: 32px 16px;
          }
          .empty-state h3 {
            margin: 0;
            color: #063B7A;
          }
          .empty-state p {
            margin: 6px 0 0 0;
            color: #64748B;
          }

          #refreshAttendance:disabled {
            opacity: 0.65;
            cursor: wait;
          }
        </style>
      `;

      document.getElementById("attendanceSearch")
        .addEventListener("input", renderAttendance);
      document.getElementById("attendanceDate")
        .addEventListener("change", renderAttendance);
      document.getElementById("refreshAttendance")
        .addEventListener("click", loadAttendance);

      await loadAttendance();
    }

    initAttendancePage().catch(error => {
      console.error("Attendance page error:", error);
      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card portal-card">
              <h2>Unable to load Attendance</h2>
              <p>
                Check the shared portal files, login configuration,
                and Supabase connection.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
