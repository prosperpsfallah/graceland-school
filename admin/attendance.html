<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Student Attendance">
  <title>Attendance | GRACAIS E-Portal</title>

  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
  <div id="app">
    <main class="page-content">
      <p>Loading attendance records...</p>
    </main>
  </div>

  <script type="module">
    import {
      requireUser,
      setupLogout
    } from "../assets/app.js";

    import {
      initLayout
    } from "../assets/layout.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    async function initAttendancePage() {
      initLayout(
        "super_admin",
        "attendance.html",
        "Student Attendance"
      );

      setupLogout();

      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Student Attendance</h1>
            <p>
              Review student attendance records for
              Graceland Academy International School
              of Excellence (GRACAIS).
            </p>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <div>
              <h2>Attendance Records</h2>
              <p>
                Attendance records will be retrieved from
                the real school database after integration.
              </p>
            </div>
          </div>

          <div class="form-group">
            <label for="attendanceDate">Attendance date</label>
            <input
              type="date"
              id="attendanceDate"
              disabled
            >
            <small>
              Date filtering will be enabled after database integration.
            </small>
          </div>

          <div class="form-group">
            <label for="attendanceSearch">
              Search attendance records
            </label>
            <input
              type="search"
              id="attendanceSearch"
              placeholder="Search by student ID or name..."
              autocomplete="off"
              disabled
            >
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Date</th>
                  <th>Attendance Status</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td colspan="5">
                    <div class="empty-state">
                      <h3>No attendance records loaded</h3>
                      <p>
                        Real attendance records will appear
                        after database integration. No sample
                        attendance is being created.
                      </p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    initAttendancePage().catch(error => {
      console.error("Attendance page error:", error);

      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <main class="page-content">
            <section class="card">
              <h2>Unable to load Attendance</h2>
              <p>
                Check the shared portal files and
                authentication configuration.
              </p>
            </section>
          </main>
        `;
      }
    });
  </script>
</body>
</html>
