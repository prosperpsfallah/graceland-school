<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Academic Schedule">
  <title>Schedule | GRACAIS E-Portal</title>

  <link rel="icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="apple-touch-icon" href="../0D4244B7-EEBA-4E94-8009-2C2063D1E070.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
  <div id="portalLayout"></div>

  <script type="module">
    import {
      setupLogout,
      esc
    } from "../assets/app.js";

    import {
      initLayout,
      requireUser
    } from "../assets/layout.js";

    import { supabase } from "../assets/supabase.js";

    const ALLOWED_ROLES = [
      "super_admin",
      "principal",
      "administration",
      "registrar"
    ];

    let scheduleRecords = [];

    function escapeHTML(value) {
      return esc(String(value ?? ""));
    }

    function displayValue(value) {
      return value === null || value === undefined || value === ""
        ? "—"
        : escapeHTML(value);
    }

    function formatTime(value) {
      if (!value) return "—";

      const match = String(value).match(/^(\d{2}):(\d{2})/);

      if (!match) return escapeHTML(value);

      let hour = Number(match[1]);
      const minute = match[2];
      const suffix = hour >= 12 ? "PM" : "AM";

      hour = hour % 12 || 12;

      return `${hour}:${minute} ${suffix}`;
    }

    function toggleActionDropdown(button) {
      const currentDropdown = button.nextElementSibling;
      const allDropdowns = document.querySelectorAll(".portal-dropdown-menu");
      
      allDropdowns.forEach(menu => {
        if (menu !== currentDropdown) {
          menu.classList.remove("show");
        }
      });

      if (currentDropdown) {
        currentDropdown.classList.toggle("show");
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".portal-action-wrapper")) {
        document.querySelectorAll(".portal-dropdown-menu").forEach(menu => {
          menu.classList.remove("show");
        });
      }
    });

    function renderSchedule(records) {
      const tbody = document.getElementById("scheduleRows");
      const status = document.getElementById("scheduleStatus");

      if (!tbody || !status) return;

      const query = document
        .getElementById("scheduleSearch")
        .value
        .trim()
        .toLowerCase();

      const filtered = records.filter(record => {
        const searchable = [
          record.day,
          record.day_of_week,
          record.class_name,
          record.subject_name,
          record.teacher_name,
          record.start_time,
          record.end_time,
          record.room
        ].filter(Boolean).join(" ").toLowerCase();

        return searchable.includes(query);
      });

      status.textContent =
        `${filtered.length} schedule record${filtered.length === 1 ? "" : "s"} shown`;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="empty-state-cell">
              <div class="empty-state">
                <h3>${query ? "No matching schedules" : "No schedule records found"}</h3>
                <p>
                  ${query
                    ? "Try another search term."
                    : "Real timetable records will appear here when available in the database."}
                </p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map((record, index) => {
        const day = record.day ?? record.day_of_week;
        const className =
          record.class_name ??
          record.classes?.name ??
          record.class_id;

        const subjectName =
          record.subject_name ??
          record.subjects?.name ??
          record.subject_id;

        const teacherName =
          record.teacher_name ??
          (
            record.teachers
              ? [
                  record.teachers.first_name,
                  record.teachers.last_name
                ].filter(Boolean).join(" ")
              : record.teacher_id
          );

        const startTimeFormatted = formatTime(record.start_time);
        const endTimeFormatted = formatTime(record.end_time);

        return `
          <tr>
            <td class="font-bold-title">${displayValue(day)}</td>
            <td>${displayValue(className)}</td>
            <td>${displayValue(subjectName)}</td>
            <td>${displayValue(teacherName)}</td>
            <td>${startTimeFormatted}</td>
            <td>${endTimeFormatted}</td>
            <td>${displayValue(record.room ?? record.room_name)}</td>
            <td>
              <div class="portal-action-wrapper">
                <button type="button" class="portal-action-btn action-toggle-btn">
                  Actions ▾
                </button>
                <div class="portal-dropdown-menu">
                  <button type="button" class="portal-dropdown-item view-schedule" data-index="${index}">
                    👁️ Inspect Schedule
                  </button>
                  <button type="button" class="portal-dropdown-item copy-schedule-info" data-text="${escapeHTML(`${day}:${subjectName} (${startTimeFormatted} -${endTimeFormatted})`)}">
                    📋 Copy Summary
                  </button>
                </div>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".action-toggle-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleActionDropdown(btn);
        });
      });

      tbody.querySelectorAll(".view-schedule").forEach(button => {
        button.addEventListener("click", () => {
          const record = filtered[button.dataset.index];
          const day = record.day ?? record.day_of_week ?? 'N/A';
          const className = record.class_name ?? record.classes?.name ?? record.class_id ?? 'N/A';
          const subject = record.subject_name ?? record.subjects?.name ?? record.subject_id ?? 'N/A';
          alert(`--- Timetable Entry Details ---\nDay: ${day}\nClass: ${className}\nSubject: ${subject}\nTime: ${formatTime(record.start_time)} - ${formatTime(record.end_time)}\nRoom: ${record.room ?? record.room_name ?? 'N/A'}`);
        });
      });

      tbody.querySelectorAll(".copy-schedule-info").forEach(button => {
        button.addEventListener("click", () => {
          const text = button.dataset.text;
          if (text) {
            navigator.clipboard.writeText(text);
            alert(`Copied schedule summary: ${text}`);
          }
        });
      });
    }

    async function loadSchedule() {
      const tbody = document.getElementById("scheduleRows");
      const status = document.getElementById("scheduleStatus");
      const refreshButton = document.getElementById("refreshSchedule");

      if (!tbody || !status) return;

      refreshButton.disabled = true;
      status.textContent = "Loading timetable...";

      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="loading-cell">Loading academic schedule...</td>
        </tr>
      `;

      try {
        const { data, error } = await supabase
          .from("schedules")
          .select("*")
          .order("day_of_week", { ascending: true })
          .order("start_time", { ascending: true });

        if (error) throw error;

        scheduleRecords = data ?? [];
        renderSchedule(scheduleRecords);

      } catch (error) {
        console.error("Schedule loading error:", error);

        status.textContent = "Unable to load schedule";

        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="empty-state-cell">
              <div class="empty-state">
                <h3>Could not load timetable</h3>
                <p>
                  Check that the schedules table exists,
                  its column names are correct, and your
                  Supabase permissions allow access.
                </p>
                <p id="scheduleError" style="color: #DC2626; font-size: 13px; margin-top: 6px;"></p>
              </div>
            </td>
          </tr>
        `;

        const errorElement = document.getElementById("scheduleError");

        if (errorElement) {
          errorElement.textContent =
            error?.message || "An unexpected database error occurred.";
        }
      } finally {
        refreshButton.disabled = false;
      }
    }

    async function initSchedulePage() {
      initLayout(
        "super_admin",
        "schedule.html",
        "Academic Schedule"
      );

      setupLogout();

      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading">
          <div>
            <h1>Academic Schedule</h1>
            <p>
              View school timetables and academic schedules
              for GRACAIS [Grades 4th - 12th].
            </p>
          </div>
          <button
            type="button"
            class="btn btn-secondary"
            id="refreshSchedule"
          >
            ↻ Refresh Timetable
          </button>
        </section>

        <section class="card portal-card">
          <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
            <div>
              <h2>Schedule Records</h2>
              <p style="margin: 4px 0 0 0; color: #64748B; font-size: 0.88rem;">Timetable information from the connected database.</p>
            </div>
            <p id="scheduleStatus" aria-live="polite" style="font-weight: 600; color: #063B7A; margin: 0;">Preparing schedule...</p>
          </div>

          <div class="table-toolbar" style="margin-bottom: 16px;">
            <div class="search-input-wrapper">
              <input
                type="search"
                id="scheduleSearch"
                placeholder="🔍 Search by day, class, subject, or teacher..."
                autocomplete="off"
                style="width:100%; padding: 10px 14px; border: 1px solid #D9E5F0; border-radius: 8px;"
              >
            </div>
          </div>

          <div class="table-container">
            <table class="portal-table">
              <thead>
                <tr>
                  <th>Day</th>
                  <th>Class</th>
                  <th>Subject</th>
                  <th>Teacher</th>
                  <th>Start Time</th>
                  <th>End Time</th>
                  <th>Room</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="scheduleRows">
                <tr>
                  <td colspan="8" class="loading-cell">Loading academic schedule...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <style>
          .portal-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #D9E5F0;
            box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
            padding: 24px;
          }

          .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
          }

          .page-heading h1 {
            color: #063B7A;
            font-size: 1.5rem;
            margin: 0;
          }

          .page-heading p {
            color: #64748B;
            margin: 4px 0 0 0;
            font-size: 0.9rem;
          }

          .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
          }

          .portal-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
          }

          .portal-table th {
            background: #F8FAFC;
            color: #063B7A;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid #E2E8F0;
            white-space: nowrap;
          }

          .portal-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #E2E8F0;
            color: #334155;
            vertical-align: middle;
          }

          .font-bold-title {
            font-weight: 600;
            color: #0F172A;
          }

          /* Dropdown Menu System */
          .portal-action-wrapper {
            position: relative;
            display: flex;
            justify-content: flex-end;
          }

          .portal-action-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
          }

          .portal-action-btn:hover {
            background: #E2E8F0;
          }

          .portal-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            min-width: 170px;
            z-index: 50;
            overflow: hidden;
          }

          .portal-dropdown-menu.show {
            display: block;
          }

          .portal-dropdown-item {
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            background: transparent;
            border: none;
            color: #334155;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease;
          }

          .portal-dropdown-item:hover {
            background: #F8FAFC;
            color: #063B7A;
          }

          .loading-cell {
            text-align: center;
            padding: 24px;
            color: #64748B;
          }

          .empty-state-cell {
            text-align: center;
            padding: 32px 16px;
            color: #64748B;
          }

          #refreshSchedule:disabled {
            opacity: 0.65;
            cursor: wait;
          }
        </style>
      `;

      document
        .getElementById("scheduleSearch")
        .addEventListener("input", () => {
          renderSchedule(scheduleRecords);
        });

      document
        .getElementById("refreshSchedule")
        .addEventListener("click", loadSchedule);

      await loadSchedule();
    }

    initSchedulePage().catch(error => {
      console.error("Schedule page error:", error);

      const pageContent = document.getElementById("pageContent");

      if (pageContent) {
        pageContent.innerHTML = `
          <section class="card portal-card">
            <h2>Unable to load Academic Schedule</h2>
            <p>Check the shared portal files and authentication configuration.</p>
          </section>
        `;
      }
    });
  </script>
</body>
</html>
