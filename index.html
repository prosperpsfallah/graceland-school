<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Academic Management Portal">
  <title>Graceland Academy International School of Excellence</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/style.css">

  <style>
    :root {
      --deep-blue: #063B7A;
      --deep-blue-dark: #032A58;
      --primary-blue: #0B5CAD;
      --sky-blue: #38BDF8;
      --sky-blue-light: #E0F5FF;
      --light-bg: #F4F9FD;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #18324D;
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(56, 189, 248, 0.35),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(11, 92, 173, 0.45),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #032A58 0%,
          #063B7A 52%,
          #0B5CAD 100%
        );
    }

    .landing-card {
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      background: #FFFFFF;
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(0, 15, 40, 0.3);
      text-align: center;
    }

    .school-logo {
      display: block;
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
      object-fit: contain;
      border-radius: 16px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--deep-blue);
      font-size: 26px;
      font-weight: 800;
    }

    p {
      margin: 0 0 24px;
      color: #64748B;
      font-size: 14px;
      line-height: 1.5;
    }

    .btn-primary {
      display: inline-block;
      width: 100%;
      padding: 14px;
      color: #FFFFFF;
      background: linear-gradient(110deg, var(--deep-blue), var(--primary-blue));
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
      box-shadow: 0 7px 18px rgba(6, 59, 122, 0.2);
      transition: transform 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .loading-text {
      color: #64748B;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="landing-card">
    <img
      src="./logo.png"
      alt="GRACAIS Logo"
      class="school-logo"
      onerror="this.style.display='none'"
    >
    <h1>GRACAIS E-Portal</h1>
    <p>Graceland Academy International School of Excellence [Grades 4th - 12th]</p>

    <div id="contentArea">
      <p class="loading-text">Checking portal session...</p>
    </div>
  </main>

  <script type="module">
    import {
      supabase,
      supabaseReady
    } from "./assets/supabase.js";

    const contentArea = document.getElementById("contentArea");

    const ROLE_DESTINATIONS = {
      super_admin: "./admin/dashboard.html",
      principal: "./admin/dashboard.html",
      administration: "./admin/dashboard.html",
      registrar: "./admin/dashboard.html",
      teacher: "./teacher/dashboard.html",
      instructor: "./teacher/dashboard.html",
      student: "./student-dashboard.html" // Correct path resolved here
    };

    function normalizeRole(role) {
      return String(role || "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");
    }

    async function checkSessionAndRedirect() {
      if (!supabaseReady || !supabase) {
        contentArea.innerHTML = `
          <p style="color: #B42318; margin-bottom: 16px;">Supabase client not initialized.</p>
          <a href="./login.html" class="btn-primary">Go to Login</a>
        `;
        return;
      }

      try {
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();

        if (sessionError || !session) {
          // No active session, redirect to login page
          window.location.replace("./login.html");
          return;
        }

        // Fetch user role profile
        const { data: profile, error: profileError } = await supabase
          .from("user_profiles")
          .select("role, status")
          .eq("id", session.user.id)
          .maybeSingle();

        if (profileError || !profile) {
          contentArea.innerHTML = `
            <p style="color: #B42318; margin-bottom: 16px;">Account profile not found.</p>
            <a href="./login.html" class="btn-primary">Go to Login</a>
          `;
          return;
        }

        const status = String(profile.status || "").trim().toLowerCase();
        if (!["active", "approved"].includes(status)) {
          contentArea.innerHTML = `
            <p style="color: #B42318; margin-bottom: 16px;">Account is not active.</p>
            <a href="./login.html" class="btn-primary">Go to Login</a>
          `;
          return;
        }

        const role = normalizeRole(profile.role);
        const destination = ROLE_DESTINATIONS[role];

        if (!destination) {
          contentArea.innerHTML = `
            <p style="color: #B42318; margin-bottom: 16px;">Unrecognized user role.</p>
            <a href="./login.html" class="btn-primary">Go to Login</a>
          `;
          return;
        }

        // Redirect to appropriate dashboard
        window.location.replace(destination);
      } catch (err) {
        console.error("Session check error:", err);
        window.location.replace("./login.html");
      }
    }

    checkSessionAndRedirect();
  </script>
</body>
</html>
