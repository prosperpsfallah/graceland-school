<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Academic Management Portal">
  <title>Login | Graceland Academy International School of Excellence</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-card">
      <header class="school-header">
        <img
          src="./logo.png"
          alt="GRACAIS School Logo"
          class="school-logo"
          onerror="this.style.display='none'"
        >
        <h1>GRACAIS</h1>
        <p class="school-name">
          Graceland Academy International School of Excellence
        </p>
        <p class="portal-label">
          ACADEMIC MANAGEMENT PORTAL
        </p>
      </header>
      <div class="login-heading">
        <h2>Welcome Back</h2>
        <p>Sign in to access your school portal.</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="username"
            required
          >
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>
        <p id="loginMessage" class="login-message" role="alert"></p>
        <button type="submit" id="loginButton" class="login-button">
          Sign In
        </button>
      </form>
      <footer class="login-footer">
        <p>
          &copy; <span id="currentYear"></span>
          GRACAIS. All rights reserved.
        </p>
      </footer>
    </section>
  </main>
  <script>
    document.getElementById("currentYear").textContent =
      new Date().getFullYear();
  </script>
  <!-- Authentication will be connected in a later stage. -->
</body>
</html>
