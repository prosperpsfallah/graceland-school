
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Academic Management Portal">
  <title>Login | Graceland Academy International School of Excellence</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-card">
      <header class="school-header">
        <img
          src="./logo.png"
          alt="GRACAIS School Logo"
          class="school-logo"
          onerror="this.style.display='none'"
        >
        <h1>GRACAIS</h1>
        <p class="school-name">
          Graceland Academy International School of Excellence
        </p>
        <p class="portal-label">ACADEMIC MANAGEMENT PORTAL</p>
      </header>

      <div class="login-heading">
        <h2>Welcome Back</h2>
        <p>Sign in to access your school portal.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <p
          id="loginMessage"
          class="login-message"
          role="alert"
          aria-live="polite"
        ></p>

        <button type="submit" id="loginButton" class="login-button">
          Sign In
        </button>
      </form>

      <footer class="login-footer">
        <p>
          &copy; <span id="currentYear"></span>
          GRACAIS. All rights reserved.
        </p>
      </footer>
    </section>
  </main>

  <script>
    document.getElementById("currentYear").textContent =
      new Date().getFullYear();
  </script>

  <script type="module">
    import { supabase, supabaseReady } from "./supabase.js";

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("loginMessage");
    const button = document.getElementById("loginButton");

    const ROLE_DESTINATIONS = {
      super_admin: "./admin/dashboard.html",
      principal: "./admin/dashboard.html",
      administration: "./admin/dashboard.html",
      registrar: "./admin/dashboard.html",
      teacher: "./teacher/dashboard.html",
      instructor: "./teacher/dashboard.html",
      student: "./students/dashboard.html"
    };

    function showMessage(text) {
      message.textContent = text;
    }

    function normalizeRole(role) {
      return String(role || "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("");

      if (!supabaseReady || !supabase) {
        showMessage(
          "The Supabase connection is not configured. Check supabase.js."
        );
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      button.disabled = true;
      button.textContent = "Signing In...";

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showMessage(
            error.message || "Sign-in failed. Check your credentials."
          );
          return;
        }

        if (!data.user) {
          showMessage("Sign-in did not return a user account.");
          return;
        }

        const { data: profile, error: profileError } = await supabase
          .from("user_profiles")
          .select("role, status")
          .eq("id", data.user.id)
          .maybeSingle();

        if (profileError) {
          console.error("Profile lookup failed:", profileError);
          await supabase.auth.signOut();
          showMessage(
            "Your account signed in, but its school profile could not be loaded. Please check the user_profiles table and its access policies."
          );
          return;
        }

        if (!profile) {
          await supabase.auth.signOut();
          showMessage(
            "Your account has no school profile yet. Contact the school administrator."
          );
          return;
        }

        const status = String(profile.status || "")
          .trim()
          .toLowerCase();

        if (status && !["active", "approved"].includes(status)) {
          await supabase.auth.signOut();
          showMessage(
            "Your school account is not active yet. Contact the school administrator."
          );
          return;
        }

        const role = normalizeRole(profile.role);
        const destination = ROLE_DESTINATIONS[role];

        if (!destination) {
          await supabase.auth.signOut();
          showMessage(
            "Your account has an unrecognized school role. Contact the administrator."
          );
          return;
        }

        window.location.replace(destination);
      } catch (error) {
        console.error("Login error:", error);
        showMessage(
          "Unable to complete sign-in. Check your connection and try again."
        );
      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
