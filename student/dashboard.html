<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Student Portal Dashboard">
  <title>Student Dashboard | GRACAIS E-Portal</title>
  <link rel="icon" href="./0D4244B7-EEBA-4E94-8009-2C2063D1E070.png" type="image/png">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <div id="app">
    <main class="page-content" id="pageContent">
      <div style="padding: 40px; text-align: center; color: #063B7A;">
        <h2>Loading Student Dashboard...</h2>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireUser, setupLogout } from "./assets/app.js";
    import { initLayout } from "./assets/layout.js";
    import { supabase } from "./assets/supabase.js";

    const ALLOWED_ROLES = ["student"];

    async function initStudentDashboard() {
      // Initialize layout with student role navigation
      if (typeof initLayout === "function") {
        initLayout("student", "student-dashboard.html", "Student Dashboard");
      }
      if (typeof setupLogout === "function") {
        setupLogout();
      }

      // Secure the page for students
      const auth = await requireUser(ALLOWED_ROLES);
      if (!auth) return;

      const pageContent = document.getElementById("pageContent");
      if (!pageContent) return;

      pageContent.innerHTML = `
        <section class="page-heading" style="margin-bottom: 24px;">
          <div>
            <h1>Welcome, Student</h1>
            <p>Graceland Academy International School of Excellence (GRACAIS) [Grades 4th - 12th].</p>
          </div>
        </section>

        <div class="portal-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
          <div class="card portal-card">
            <h2>Attendance Records</h2>
            <p>View your personal attendance history.</p>
            <div id="studentAttendance" style="margin-top: 12px; font-weight: 500; color: #334155;">Loading attendance...</div>
          </div>

          <div class="card portal-card">
            <h2>Academic Profile</h2>
            <p>Your enrollment and class details.</p>
            <div id="studentProfile" style="margin-top: 12px; font-weight: 500; color: #334155;">Loading profile...</div>
          </div>
        </div>

        <style>
          .portal-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #D9E5F0;
            box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
            padding: 24px;
          }
          .page-heading h1 { color: #063B7A; font-size: 1.5rem; margin: 0; }
          .page-heading p { color: #64748B; margin: 4px 0 0 0; font-size: 0.9rem; }
        </style>
      `;

      // Fetch student data safely
      try {
        const userId = auth.user?.id;
        
        // Fetch profile info
        const { data: profileData } = await supabase
          .from("user_profiles")
          .select("*")
          .eq("id", userId)
          .maybeSingle();

        const profileDiv = document.getElementById("studentProfile");
        if (profileDiv) {
          profileDiv.innerHTML = profileData 
            ? `Name: ${profileData.first_name || ''} ${profileData.last_name || ''}<br>Role: Student<br>Status: Active`
            : `Account connected successfully.`;
        }

        // Fetch attendance for this user
        const { data: attendanceData } = await supabase
          .from("attendance")
          .select("*")
          .eq("student_id", userId)
          .order("date", { ascending: false })
          .limit(5);

        const attendanceDiv = document.getElementById("studentAttendance");
        if (attendanceDiv) {
          if (!attendanceData || attendanceData.length === 0) {
            attendanceDiv.innerHTML = "No attendance records found.";
          } else {
            attendanceDiv.innerHTML = attendanceData.map(a => 
              `<div style="padding: 6px 0; border-bottom: 1px solid #E2E8F0;">Date: ${a.date || a.created_at || 'N/A'} — <b>${a.status || 'Present'}</b></div>`
            ).join("");
          }
        }
      } catch (err) {
        console.error("Error loading student details:", err);
      }
    }

    initStudentDashboard();
  </script>
</body>
</html>
