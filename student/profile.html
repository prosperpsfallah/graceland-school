<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063B7A">
  <meta name="description" content="GRACAIS Student Profile">
  <title>My Profile | GRACAIS</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../assets/style.css">

  <style>
    .student-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }

    .welcome-panel {
      padding: 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, #063B7A, #0B5CAD);
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(3, 42, 88, 0.08);
    }

    .welcome-panel h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin: 0 0 10px 0;
    }

    .welcome-panel p {
      line-height: 1.7;
      margin: 0;
      color: #E0F5FF;
    }

    .student-label {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 12px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 30px;
      font-size: .82rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
    }

    .portal-card {
      background: white;
      border: 1px solid #D9E5F0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(3, 42, 88, 0.04);
    }

    .portal-card h2 {
      color: #063B7A;
      margin: 0 0 8px 0;
      font-size: 1.15rem;
    }

    .muted {
      color: #64748B;
      font-size: 0.88rem;
      line-height: 1.6;
      margin: 0;
    }

    .notice {
      padding: 14px 18px;
      margin-bottom: 24px;
      border: 1px solid #F4D58D;
      border-radius: 10px;
      background: #FFF8E6;
      color: #795716;
      line-height: 1.6;
      font-size: 0.9rem;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .profile-field {
      padding: 16px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .profile-field small {
      display: block;
      color: #64748B;
      margin-bottom: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .profile-field strong {
      color: #0F172A;
      font-size: 1rem;
    }

    @media (max-width: 760px) {
      .student-page { padding: 16px; }
      .portal-card { padding: 18px; }
      .welcome-panel { padding: 20px; }
      .profile-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div id="app">
    <p style="padding:24px;">Loading profile details…</p>
  </div>

  <script type="module">
    import {
      requireUser,
      setupLogout,
      esc
    } from "../assets/app.js";

    const ALLOWED_ROLES = ["student"];

    function renderPage(profile) {
      const app = document.getElementById("app");
      const firstName = profile.first_name || "";
      const lastName = profile.last_name || "";
      const fullName = [firstName, lastName].filter(Boolean).join(" ") || "Student";
      const schoolId = profile.school_id || "Not assigned";
      const gradeLevel = profile.grade_level ? `Grade ${profile.grade_level}` : "Grades 4th - 12th";
      const email = profile.email || "Registered Account";

      app.innerHTML = `
        <div class="portal-shell">
          <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
              <img
                src="../logo.png"
                alt="GRACAIS logo"
                style="width:48px;height:48px;object-fit:contain;"
                onerror="this.style.display='none'"
              >
              <div>
                <strong>GRACAIS</strong>
                <small>Student Portal</small>
              </div>
            </div>

            <nav class="sidebar-nav" aria-label="Student navigation">
              <a href="./dashboard.html">Dashboard</a>
              <a href="./grades.html">My Grades</a>
              <a href="./attendance.html">My Attendance</a>
              <a href="./subjects.html">My Subjects</a>
              <a href="./schedule.html">My Schedule</a>
              <a href="./announcements.html">Announcements</a>
              <a href="./profile.html" aria-current="page">My Profile</a>
              <a href="./password.html">Change Password</a>
            </nav>

            <div class="sidebar-footer">
              <button type="button" id="logoutButton" class="logout-button">
                Sign Out
              </button>
            </div>
          </aside>

          <div class="main-area">
            <header class="topbar">
              <button
                type="button"
                id="menuButton"
                aria-label="Open navigation menu"
                aria-expanded="false"
              >☰</button>
              <div>
                <strong>Student Profile</strong>
                <div style="font-size:13px;color:#64748b;">
                  GRACAIS Academic Portal [Grades 4th - 12th]
                </div>
              </div>
            </header>

            <main class="student-page">
              <section class="welcome-panel">
                <span class="student-label">Identity Record</span>
                <h1>My Profile Details</h1>
                <p>View your official student identification, institutional credentials, and assigned class details.</p>
              </section>

              <div class="notice">
                <strong>Profile Data Protection:</strong> Personal records and school IDs are secured under Supabase Row Level Security (RLS) policies.
              </div>

              <!-- Profile Details Card -->
              <section class="portal-card">
                <h2>Official Student Record</h2>
                <p class="muted">Your unique account metadata registered in the school database.</p>

                <div class="profile-grid">
                  <div class="profile-field">
                    <small>Full Name</small>
                    <strong>${esc(fullName)}</strong>
                  </div>

                  <div class="profile-field">
                    <small>School ID Number</small>
                    <strong style="color:#063B7A;">${esc(schoolId)}</strong>
                  </div>

                  <div class="profile-field">
                    <small>Assigned Academic Level</small>
                    <strong>${esc(gradeLevel)}</strong>
                  </div>

                  <div class="profile-field">
                    <small>Account Email</small>
                    <strong>${esc(email)}</strong>
                  </div>

                  <div class="profile-field">
                    <small>Institutional Scope</small>
                    <strong>Graceland Academy International School of Excellence</strong>
                  </div>

                  <div class="profile-field">
                    <small>Account Status</small>
                    <strong style="color:#166534;">Active & Verified</strong>
                  </div>
                </div>
              </section>
            </main>
          </div>

          <div id="sidebarOverlay" class="sidebar-overlay"></div>
        </div>
      `;

      const menuButton = document.getElementById("menuButton");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");

      function closeMenu() {
        sidebar?.classList.remove("open");
        overlay?.classList.remove("show");
        menuButton?.setAttribute("aria-expanded", "false");
      }

      menuButton?.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        overlay.classList.toggle("show", isOpen);
        menuButton.setAttribute("aria-expanded", String(isOpen));
      });

      overlay?.addEventListener("click", closeMenu);

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeMenu();
      });
    }

    setupLogout();

    const result = await requireUser(ALLOWED_ROLES);

    if (result) {
      renderPage(result.profile || {});
      setupLogout();
    }
  </script>
</body>
</html>
